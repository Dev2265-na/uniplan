    return '<div class="pool-item' + (sel ? ' touch-selected' : '') + '" ' + (editing ? 'draggable="true" ' : '') +
      'data-member="' + escapeHtml(m.name) + '" style="background:' + escapeHtml(m.color) + ';">' +
      '<div class="pool-item-title">' + escapeHtml(m.name) + '</div>' +
      '<div class="pool-item-code">' + count + (count === 1 ? ' duty' : ' duties') + '</div>' +
      '<div class="pool-item-actions"><button type="button" class="pool-action-btn" data-action="del-member" data-name="' + escapeHtml(m.name) + '" title="Remove member"><i class="fi fi-rr-trash"></i></button></div>' +
    '</div>';
  }).join('');
}

function addMember() {
  var input = $('memberNameInput');
  var name = input.value.trim();
  if (!name) { showWarning('Please enter a member name'); return; }
  var exists = STATE.duty.members.some(function(m) { return m.name.toLowerCase() === name.toLowerCase(); });
  if (exists) { showWarning('That member already exists'); return; }

  // Auto-assign the first palette color not used yet
  var used = STATE.duty.members.map(function(m) { return m.color; });
  var color = CONFIG.COLORS.find(function(c) { return used.indexOf(c) === -1; }) ||
              CONFIG.COLORS[STATE.duty.members.length % CONFIG.COLORS.length];
  STATE.duty.members.push({ name: name, color: color });
  input.value = '';
  setDutyDirty(true);
  renderDuty();
}

function removeMember(name) {
  var count = STATE.duty.assignments.filter(function(a) { return a.person === name; }).length;
  confirmDialog('Remove ' + name + '?',
    count ? ('Their ' + count + ' duty assignment(s) will be removed too.') : 'This member has no assignments.',
    'Remove').then(function(ok) {
    if (!ok) return;
    STATE.duty.members = STATE.duty.members.filter(function(m) { return m.name !== name; });
    STATE.duty.assignments = STATE.duty.assignments.filter(function(a) { return a.person !== name; });
    clearSelections();
    setDutyDirty(true);
    renderDuty();
  });
}

// ── Time slots ────────────────────────────────────────────
function addTimeSlot() {
  Swal.fire({
    title: 'Add time slot',
    html: '<div class="swal-time-row">' +
            '<label>Start<input id="slotStartInput" type="time" class="swal2-input" value="08:00"></label>' +
            '<label>End<input id="slotEndInput" type="time" class="swal2-input" value="12:00"></label>' +
          '</div>',
    showCancelButton: true,
    confirmButtonText: 'Add slot',
    focusConfirm: false,
    preConfirm: function() {
      var s = $('slotStartInput').value, e = $('slotEndInput').value;
      if (!s || !e) { Swal.showValidationMessage('Start and end times are required'); return false; }
      if (timeToMin(e) <= timeToMin(s)) { Swal.showValidationMessage('End time must be after start time'); return false; }
      if (STATE.duty.slots.some(function(x) { return x.start === s && x.end === e; })) {
        Swal.showValidationMessage('That time slot already exists'); return false;
      }
      return { start: s, end: e };
    }
  }).then(function(r) {
    if (!r.isConfirmed || !r.value) return;
    STATE.duty.slots.push(r.value);
    sortSlots(STATE.duty.slots);
    setDutyDirty(true);
    renderDuty();
  });
}

function removeTimeSlot(start, end) {
  var count = STATE.duty.assignments.filter(function(a) { return a.start === start && a.end === end; }).length;
  confirmDialog('Remove slot ' + start + ' – ' + end + '?',
    count ? (count + ' assignment(s) in this slot will be removed too.') : 'This slot is empty.',
    'Remove').then(function(ok) {
    if (!ok) return;
    STATE.duty.slots = STATE.duty.slots.filter(function(s) { return !(s.start === start && s.end === end); });
    STATE.duty.assignments = STATE.duty.assignments.filter(function(a) { return !(a.start === start && a.end === end); });
    clearSelections();
    setDutyDirty(true);
    renderDuty();
  });
}

// ── Grid ──────────────────────────────────────────────────
function renderDutyGrid() {
  var grid = $('dutyGrid');
  if (!grid) return;
  var editing = STATE.duty.editMode;
  var todayIdx = (new Date().getDay() + 6) % 7;
  var html = '<div class="duty-head">Time</div>';

  CONFIG.DUTY_DAYS.forEach(function(d, i) {
    var dayDate = addDays(STATE.duty.weekStart, i);
    var isToday = formatDateISO(dayDate) === formatDateISO(new Date());
    var dateNum = dayDate.getDate();
    var monthName = dayDate.toLocaleDateString('en-GB', { month: 'short' });
    html += '<div class="duty-head' + (isToday ? ' today' : '') + '"><span>' + d + '</span><span class="duty-head-date">' + dateNum + ' ' + monthName + '</span></div>';
  });

  STATE.duty.slots.forEach(function(slot) {
    html += '<div class="duty-slot-label"><span class="slot-times">' + slot.start + ' – ' + slot.end + '</span>' +
      '<button type="button" class="slot-remove" data-action="del-slot" data-start="' + slot.start + '" data-end="' + slot.end + '"><i class="fi fi-rr-minus-small"></i> Remove</button></div>';

    CONFIG.DUTY_DAYS.forEach(function(day) {
      html += '<div class="duty-cell" data-day="' + day + '" data-start="' + slot.start + '" data-end="' + slot.end + '">';
      STATE.duty.assignments.filter(function(a) {
        return a.day === day && a.start === slot.start && a.end === slot.end;
      }).forEach(function(a) {
        var sel = STATE.duty.selected && STATE.duty.selected.type === 'assign' && STATE.duty.selected.id === a.id;
        html += '<div class="duty-chip' + (sel ? ' touch-selected' : '') + '" ' + (editing ? 'draggable="true" ' : '') +
          'data-id="' + a.id + '" style="background:' + escapeHtml(memberColor(a.person)) + ';">' +
          '<div class="chip-person">' + escapeHtml(a.person) + '</div>' +
          (a.duty_name ? '<div class="chip-duty">' + escapeHtml(a.duty_name) + '</div>' : '') +
          (a.notes ? '<div class="chip-notes">' + escapeHtml(a.notes) + '</div>' : '') +
          '<div class="chip-actions">' +
            '<button type="button" class="chip-btn" data-action="edit-assign" data-id="' + a.id + '" title="Edit"><i class="fi fi-rr-pencil"></i></button>' +
            '<button type="button" class="chip-btn" data-action="del-assign" data-id="' + a.id + '" title="Remove"><i class="fi fi-rr-cross-small"></i></button>' +
          '</div></div>';
      });
      html += '</div>';
    });
  });

  if (STATE.duty.slots.length === 0) {
    html += '<div class="duty-slot-label" style="grid-column:1 / -1;">No time slots. Use "Add time slot" in edit mode.</div>';
  }
  grid.innerHTML = html;
}

// ── Placement + conflict detection ────────────────────────
/** Another assignment of the same person that overlaps this day/slot, or null */
function findDutyConflict(person, day, start, end, ignoreId) {
  return STATE.duty.assignments.find(function(a) {
    return a.id !== ignoreId && a.person === person && a.day === day && timesOverlap(a.start, a.end, start, end);
  }) || null;
}

function warnDutyConflict(person, day, other) {
  Swal.fire({
    icon: 'warning', title: 'Time conflict!',
    text: person + ' is already on duty on ' + day + ' ' + other.start + ' – ' + other.end + '.',
    timer: 3200, showConfirmButton: false
  });
}

function placeMemberInCell(name, cell) {
  var day = cell.dataset.day, start = cell.dataset.start, end = cell.dataset.end;
  var conflict = findDutyConflict(name, day, start, end, null);
  if (conflict) { warnDutyConflict(name, day, conflict); return; }
  STATE.duty.assignments.push({
    id: newDutyId(),
    week_start: formatDateISO(STATE.duty.weekStart),
    day: day,
    start: start,
    end: end,
    duty_name: '',
    person: name,
    notes: ''
  });
  setDutyDirty(true);
  renderDuty();
}

function moveAssignmentToCell(id, cell) {
  var a = STATE.duty.assignments.find(function(x) { return x.id === id; });
  if (!a) return;
  var day = cell.dataset.day, start = cell.dataset.start, end = cell.dataset.end;
  if (a.day === day && a.start === start && a.end === end) return;
  var conflict = findDutyConflict(a.person, day, start, end, a.id);
  if (conflict) { warnDutyConflict(a.person, day, conflict); return; }
  a.day = day; a.start = start; a.end = end;
  setDutyDirty(true);
  renderDuty();
}

function removeAssignment(id) {
  STATE.duty.assignments = STATE.duty.assignments.filter(function(a) { return a.id !== id; });
  if (STATE.duty.selected && STATE.duty.selected.id === id) clearSelections();
  setDutyDirty(true);
  renderDuty();
}

// ── Events: HTML5 drag & drop + tap-to-select ─────────────
function initDutyEvents() {
  var layout = $('dutyLayout');
  if (!layout) return;

  layout.addEventListener('dragstart', function(e) {
    if (!STATE.duty.editMode) return;
    var member = e.target.closest && e.target.closest('.pool-item[data-member]');
    var chip = e.target.closest && e.target.closest('.duty-chip');
    if (member) STATE.drag = { kind: 'member', id: member.dataset.member };
    else if (chip) STATE.drag = { kind: 'assign', id: chip.dataset.id };
    else return;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', STATE.drag.id); } catch (err) {}
    (member || chip).classList.add('dragging');
  });

  layout.addEventListener('dragend', function() {
    STATE.drag = null;
    layout.querySelectorAll('.dragging, .drag-over').forEach(function(el) { el.classList.remove('dragging', 'drag-over'); });
  });

  layout.addEventListener('dragover', function(e) {
    var cell = e.target.closest && e.target.closest('.duty-cell');
    if (!cell || !STATE.drag || !STATE.duty.editMode) return;
    e.preventDefault();
    layout.querySelectorAll('.duty-cell.drag-over').forEach(function(c) { if (c !== cell) c.classList.remove('drag-over'); });
    cell.classList.add('drag-over');
  });

  layout.addEventListener('drop', function(e) {
    var cell = e.target.closest && e.target.closest('.duty-cell');
    if (!cell || !STATE.drag) return;
    e.preventDefault();
    var drag = STATE.drag;
    STATE.drag = null;
    cell.classList.remove('drag-over');
    if (drag.kind === 'member') placeMemberInCell(drag.id, cell);
    else moveAssignmentToCell(drag.id, cell);
  });

  layout.addEventListener('click', onDutyClick);
}

function onDutyClick(e) {
  var actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    var action = actionBtn.dataset.action;
    if (action === 'edit-assign') openDutyModal(actionBtn.dataset.id);
    else if (action === 'del-assign') removeAssignment(actionBtn.dataset.id);
    else if (action === 'del-member') removeMember(actionBtn.dataset.name);
    else if (action === 'del-slot') removeTimeSlot(actionBtn.dataset.start, actionBtn.dataset.end);
    return;
  }

  // If clicking directly on a duty chip in view mode, open details modal
  if (!STATE.duty.editMode) {
    var viewChip = e.target.closest('.duty-chip');
    if (viewChip && viewChip.dataset.id) {
      openDutyModal(viewChip.dataset.id);
    }
    return;
  }

  var sel = STATE.duty.selected;
  var memberEl = e.target.closest('.pool-item[data-member]');
  var chip = e.target.closest('.duty-chip');
  var cell = e.target.closest('.duty-cell');

  // Tap a member → select / deselect
  if (memberEl) {
    var name = memberEl.dataset.member;
    if (sel && sel.type === 'member' && sel.id === name) { clearSelections(); renderDuty(); return; }
    clearSelections();
    STATE.duty.selected = { type: 'member', id: name };
    renderDuty();
    showHint('Tap a cell to place ' + name + ' (tap the name again to cancel)');
    return;
  }

  // Tap a chip with nothing (or the same chip) selected → select it for moving
  if (chip && (!sel || (sel.type === 'assign' && sel.id === chip.dataset.id))) {
    if (sel) { clearSelections(); renderDuty(); return; }
    STATE.duty.selected = { type: 'assign', id: chip.dataset.id };
    renderDuty();
    showHint('Tap a cell to move this duty');
    return;
  }

  // Tap a cell with a selection → place / move
  if (cell && sel) {
    if (sel.type === 'member') {
      placeMemberInCell(sel.id, cell);
      showHint('Tap a cell to place ' + sel.id + ' (tap the name again to cancel)');
    } else {
      moveAssignmentToCell(sel.id, cell);
      clearSelections();
      renderDuty();
    }
  }
}

// ── Assignment modal ──────────────────────────────────────
function openDutyModal(id) {
  var a = STATE.duty.assignments.find(function(x) { return x.id === id; });
  if (!a) return;
  $('dutyEditId').value = id;

  // Populate person dropdown
  var pSel = $('dutyPersonSelect');
  if (pSel) {
    pSel.innerHTML = (STATE.duty.members || []).map(function(m) {
      return '<option value="' + escapeHtml(m.name) + '"' + (m.name === a.person ? ' selected' : '') + '>' + escapeHtml(m.name) + '</option>';
    }).join('');
    if (!pSel.value && a.person) {
      pSel.innerHTML += '<option value="' + escapeHtml(a.person) + '" selected>' + escapeHtml(a.person) + '</option>';
    }
  }

  // Populate day dropdown with dates
  var dSel = $('dutyDaySelect');
  if (dSel) {
    dSel.innerHTML = CONFIG.DUTY_DAYS.map(function(d, idx) {
      var dayDate = addDays(STATE.duty.weekStart, idx);
      var dateLabel = d + ' (' + dayDate.getDate() + ' ' + dayDate.toLocaleDateString('en-GB', { month: 'short' }) + ')';
      return '<option value="' + d + '"' + (d === a.day ? ' selected' : '') + '>' + dateLabel + '</option>';
    }).join('');
  }

  // Populate slot dropdown
  var sSel = $('dutySlotSelect');
  if (sSel) {
    var curSlotVal = a.start + '-' + a.end;
    var hasCurSlot = (STATE.duty.slots || []).some(function(s) { return s.start === a.start && s.end === a.end; });
    var slotOptions = (STATE.duty.slots || []).map(function(s) {
      var val = s.start + '-' + s.end;
      return '<option value="' + val + '"' + (val === curSlotVal ? ' selected' : '') + '>' + s.start + ' – ' + s.end + '</option>';
    });
    if (!hasCurSlot && a.start && a.end) {
      slotOptions.unshift('<option value="' + curSlotVal + '" selected>' + a.start + ' – ' + a.end + '</option>');
    }
    sSel.innerHTML = slotOptions.join('');
  }

  $('dutyNameInput').value = a.duty_name || '';
  $('dutyNotesInput').value = a.notes || '';
  $('dutyModal').classList.remove('hidden');
  setTimeout(function() { $('dutyNameInput').focus(); }, 100);
}

function closeDutyModal() {
  var m = $('dutyModal');
  if (m) m.classList.add('hidden');
}

function submitDutyModal() {
  var id = $('dutyEditId').value;
  var a = STATE.duty.assignments.find(function(x) { return x.id === id; });
  if (!a) { closeDutyModal(); return; }

  var pSel = $('dutyPersonSelect');
  var dSel = $('dutyDaySelect');
  var sSel = $('dutySlotSelect');

  var newPerson = pSel ? pSel.value : a.person;
  var newDay = dSel ? dSel.value : a.day;
  var newSlot = sSel ? sSel.value : (a.start + '-' + a.end);
  var parts = newSlot.split('-');
  var newStart = parts[0];
  var newEnd = parts[1];

  var newDutyName = $('dutyNameInput').value.trim();
  var newNotes = $('dutyNotesInput').value.trim();

  // Conflict check if person, day, or slot changed
  if (newPerson !== a.person || newDay !== a.day || newStart !== a.start || newEnd !== a.end) {
    var conflict = findDutyConflict(newPerson, newDay, newStart, newEnd, a.id);
    if (conflict) {
      warnDutyConflict(newPerson, newDay, conflict);
      return;
    }
  }

  a.person = newPerson;
  a.day = newDay;
  a.start = newStart;
  a.end = newEnd;
  a.duty_name = newDutyName;
  a.notes = newNotes;

  setDutyDirty(true);
  renderDuty();
  closeDutyModal();
  showSuccess('Duty assignment updated!');
}

function removeDutyFromModal() {
  var id = $('dutyEditId').value;
  closeDutyModal();
  removeAssignment(id);
}

// ── Save ──────────────────────────────────────────────────
function saveRota() {
  if (STATE.duty.saving) return;
  STATE.duty.saving = true;
  refreshSyncIndicator();
  var btn = $('dutySaveBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fi fi-rr-spinner"></i> Saving...';

  function done() {
    STATE.duty.saving = false;
    btn.disabled = false;
    btn.innerHTML = '<i class="fi fi-rr-disk"></i> Save Rota';
    refreshSyncIndicator();
  }

  // Merge active week's assignments into STATE.duty.allAssignments
  var currentWeekKey = formatDateISO(STATE.duty.weekStart);
  STATE.duty.allAssignments = (STATE.duty.allAssignments || []).filter(function(a) {
    return a.week_start !== currentWeekKey && (a.week_start || currentWeekKey !== formatDateISO(getWeekStart(new Date())));
  });
  (STATE.duty.assignments || []).forEach(function(a) {
    a.week_start = currentWeekKey;
    STATE.duty.allAssignments.push(a);
  });

  var payload = {
    slots: STATE.duty.slots,
    members: STATE.duty.members,
    assignments: STATE.duty.allAssignments.map(function(a) {
      return {
        week_start: a.week_start || currentWeekKey,
        day: a.day,
        start: a.start,
        end: a.end,
        duty_name: a.duty_name,
        person: a.person,
        notes: a.notes
      };
    })
  };

  runServer('saveDutyData', [JSON.stringify(payload)], function(res) {
    done();
    if (!res || !res.success) { refreshSyncIndicator('error', 'Save failed'); showError(res && res.error); return; }
    STATE.duty.dirty = false;
    refreshSyncIndicator();
    Swal.fire({ icon: 'success', title: 'Rota saved for this week!', timer: 1500, showConfirmButton: false });
  }, function(e) { done(); refreshSyncIndicator('error', 'Save failed'); handleError(e); });
}

// ── Export ────────────────────────────────────────────────
function captureDutyCanvas() {
  if (typeof html2canvas === 'undefined') {
    return Promise.reject(new Error('The image library could not be loaded. Check your connection.'));
  }
  var grid = $('dutyGrid');
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim() || '#0f172a';
  grid.classList.add('exporting');
  return html2canvas(grid, { backgroundColor: bg, scale: 2, useCORS: true }).then(function(canvas) {
    grid.classList.remove('exporting');
    return canvas;
  }, function(err) {
    grid.classList.remove('exporting');
    throw err;
  });
}

function exportDutyImage() {
  Swal.fire({ title: 'Creating image...', allowOutsideClick: false, showConfirmButton: false, didOpen: function() { Swal.showLoading(); } });
  captureDutyCanvas().then(function(canvas) {
    Swal.close();
    var link = document.createElement('a');
    link.download = 'duty_rota_' + formatDateISO(new Date()) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(function(err) {
    Swal.close();
    showError(err && err.message);
  });
}

/** Tab-separated text table (pastes nicely into Sheets / Excel / chat) */
function buildDutyText() {
  var lines = [['Time'].concat(CONFIG.DUTY_DAYS).join('\t')];
  STATE.duty.slots.forEach(function(slot) {
    var row = [slotLabel(slot)];
    CONFIG.DUTY_DAYS.forEach(function(day) {
      row.push(STATE.duty.assignments.filter(function(a) {
        return a.day === day && a.start === slot.start && a.end === slot.end;
      }).map(function(a) { return a.person + (a.duty_name ? ' (' + a.duty_name + ')' : ''); }).join(', '));
    });
    lines.push(row.join('\t'));
  });
  return lines.join('\n');
}

function copyTextFallback(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function copyDutyText() {
  var text = buildDutyText();
  var p = (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(text) : Promise.reject();
  return p.then(function() { return true; }, function() { return copyTextFallback(text); });
}

function copyDutyToClipboard() {
  var canCopyImage = navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== 'undefined';

  function copyAsText() {
    copyDutyText().then(function(ok) {
      if (ok) Swal.fire({ icon: 'success', title: 'Copied as text', text: 'Image copy is not available here, so the rota was copied as a table.', timer: 2600, showConfirmButton: false });
      else showError('Could not access the clipboard. Use "Export as Image" instead.');
    });
  }

  if (!canCopyImage) { copyAsText(); return; }

  captureDutyCanvas().then(function(canvas) {
    return new Promise(function(resolve, reject) {
      canvas.toBlob(function(blob) { blob ? resolve(blob) : reject(new Error('Image creation failed')); }, 'image/png');
    });
  }).then(function(blob) {
    return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
  }).then(function() {
    Swal.fire({ icon: 'success', title: 'Rota image copied', timer: 1500, showConfirmButton: false });
  }).catch(function() {
    copyAsText();
  });
}

// ── Sync Duty Rota to Google Calendar & Discord ───────────
function ensureDutySavedBeforeAction(callback) {
  if (!STATE.duty.dirty) {
    callback();
    return;
  }
  var currentWeekKey = formatDateISO(STATE.duty.weekStart);
  STATE.duty.allAssignments = (STATE.duty.allAssignments || []).filter(function(a) {
    return a.week_start !== currentWeekKey && (a.week_start || currentWeekKey !== formatDateISO(getWeekStart(new Date())));
  });
  (STATE.duty.assignments || []).forEach(function(a) {
    a.week_start = currentWeekKey;
    STATE.duty.allAssignments.push(a);
  });
  var payload = {
    slots: STATE.duty.slots,
    members: STATE.duty.members,
    assignments: STATE.duty.allAssignments.map(function(a) {
      return {
        week_start: a.week_start || currentWeekKey,
        day: a.day,
        start: a.start,
        end: a.end,
        duty_name: a.duty_name,
        person: a.person,
        notes: a.notes
      };
    })
  };
  runServer('saveDutyData', [JSON.stringify(payload)], function(res) {
    if (res && res.success) {
      STATE.duty.dirty = false;
      refreshSyncIndicator();
    }
    callback();
  }, function() { callback(); });
}

// ═══════════════════════════════════════════════════════════
// SECTION 3: CLASS SCHEDULE (Google Sheets)
// ═══════════════════════════════════════════════════════════

var SUBJECT_COLORS = CONFIG.COLORS;

function loadClassModule(force) {
  if (STATE.classesLoaded && !force) { renderClassModule(); return; }
  showLoading();
  var pending = 2, failed = false;

  function finish() {
    pending--;
    if (pending > 0) return;
    hideLoading();
    if (failed) return;
    STATE.classesLoaded = true;
    STATE.classDirty = false;
    renderClassModule();
    refreshSyncIndicator();
  }
  function failHandler(e) { failed = true; handleError(e); finish(); }

  runServer('getSubjectPool', [], function(res) {
    if (res && res.success) ingestSubjectPoolResponse(res.data || []);
    else { failed = true; showError(res && res.error); }
    finish();
  }, failHandler);

  runServer('getAllClasses', [], function(res) {
    if (res && res.success) {
      STATE.allClasses = mergeLocalClassMaterials(res.data || []);
      var currentWeekKey = formatDateISO(STATE.classWeekStart);
      STATE.classes = STATE.allClasses.filter(function(c) {
        return c.week_start === currentWeekKey || (!c.week_start && currentWeekKey === formatDateISO(getWeekStart(new Date())));
      });
    }
    else { failed = true; showError(res && res.error); }
    finish();
  }, failHandler);
}

function renderClassModule() {
  renderClassWeekNav();
  renderSubjectPool();
  renderTimetable();
  initColorSwatches();
  refreshSyncIndicator();
  renderOverviewHub();
}

// ── Week navigation ───────────────────────────────────────
function renderClassWeekNav() {
  var lbl = $('classWeekRangeLabel');
  if (!lbl) return;
  var start = STATE.classWeekStart;
  var end = addDays(start, 6);
  lbl.textContent = formatDateShort(start) + ' – ' + formatDateShort(end) + ' ' + end.getFullYear();
  var todayBtn = $('classTodayBtn');
  var isCurrent = formatDateISO(start) === formatDateISO(getWeekStart(new Date()));
  if (todayBtn) {
    todayBtn.classList.toggle('btn-primary', isCurrent);
    todayBtn.classList.toggle('btn-secondary', !isCurrent);
  }
}

function switchClassWeek(newWeekStart) {
  var oldWeekKey = formatDateISO(STATE.classWeekStart);
  STATE.allClasses = (STATE.allClasses || []).filter(function(c) {
    return c.week_start !== oldWeekKey && (c.week_start || oldWeekKey !== formatDateISO(getWeekStart(new Date())));
  });
  (STATE.classes || []).forEach(function(c) {
    c.week_start = oldWeekKey;
    STATE.allClasses.push(c);
  });

  STATE.classWeekStart = newWeekStart;
  var newWeekKey = formatDateISO(newWeekStart);
  STATE.classes = STATE.allClasses.filter(function(c) {
    return c.week_start === newWeekKey || (!c.week_start && newWeekKey === formatDateISO(getWeekStart(new Date())));
  });

  renderClassWeekNav();
  renderTimetable();
}

function prevClassWeek() {
  switchClassWeek(addDays(STATE.classWeekStart, -7));
}

function nextClassWeek() {
  switchClassWeek(addDays(STATE.classWeekStart, 7));
}

function todayClassWeek() {
  switchClassWeek(getWeekStart(new Date()));
}

function copyFromPrevClassWeek() {
  var prevWeekKey = formatDateISO(addDays(STATE.classWeekStart, -7));
  var currentWeekKey = formatDateISO(STATE.classWeekStart);

  var prevClasses = (STATE.allClasses || []).filter(function(c) {
    return c.week_start === prevWeekKey;
  });

  if (prevClasses.length === 0) {
    prevClasses = (STATE.allClasses || []).filter(function(c) { return !c.week_start; });
  }

  if (prevClasses.length === 0) {
    Swal.fire({
      icon: 'info',
      title: 'No classes found',
      text: 'There are no classes in the previous week (' + prevWeekKey + ') to copy.',
      timer: 2500,
      showConfirmButton: false
    });
    return;
  }

  function doCopy() {
    var cloned = prevClasses.map(function(c) {
      return {
        id: 'cls_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        subject_code: c.subject_code,
        subject_name: c.subject_name,
        week_start: currentWeekKey,
        day: c.day,
        start_time: c.start_time,
        end_time: c.end_time,
        room: c.room || '',
        color: c.color || '#6366f1',
        slide_url: c.slide_url || '',
        meeting_url: c.meeting_url || '',
        session_notes: c.session_notes || ''
      };
    });
    STATE.classes = cloned;
    setClassDirty(true);
    renderTimetable();
    Swal.fire({
      icon: 'success',
      title: 'Schedule copied!',
      text: 'Copied ' + cloned.length + ' class(es) from last week. Click "Save Timetable" to save.',
      timer: 2200,
      showConfirmButton: false
    });
  }

  if (STATE.classes && STATE.classes.length > 0) {
    confirmDialog(
      'Replace this week\'s schedule?',
      'This will replace the ' + STATE.classes.length + ' class(es) in this week with ' + prevClasses.length + ' class(es) from last week.',
      'Replace'
    ).then(function(confirmed) {
      if (confirmed) doCopy();
    });
  } else {
    doCopy();
  }
}

// ── Edit / View mode ──────────────────────────────────────

// ── Subject pool ──────────────────────────────────────────
function renderSubjectPool() {

// ── Timetable render engine ───────────────────────────────
function renderTimetable() {
  var grid = $('timetable');
  if (!grid) return;

  // Dynamic visible hours based on the placed classes
  var valid = STATE.classes.filter(function(c) { return parseTimeToDecimal(c.end_time) > parseTimeToDecimal(c.start_time); });
  if (valid.length > 0) {
    var minT = 24, maxT = 0;
    valid.forEach(function(c) {
      minT = Math.min(minT, parseTimeToDecimal(c.start_time));
      maxT = Math.max(maxT, parseTimeToDecimal(c.end_time));
    });
    CONFIG.GRID_START = Math.min(8, Math.max(0, Math.floor(minT)));
    CONFIG.GRID_END = Math.max(16, Math.min(24, Math.ceil(maxT) + 1));
  } else {
    CONFIG.GRID_START = 8;
    CONFIG.GRID_END = 16;
  }

  var totalHours = CONFIG.GRID_END - CONFIG.GRID_START;
  var todayIdx = (new Date().getDay() + 6) % 7;
  grid.style.gridTemplateColumns = '80px repeat(' + (totalHours * 2) + ', minmax(40px, 1fr))';

  var html = ['<div class="tt-header-cell"></div>'];
  for (var i = 0; i < totalHours; i++) {
    html.push('<div class="tt-header-cell" style="grid-column: span 2;">' + pad2(CONFIG.GRID_START + i) + ':00</div>');
  }

  CONFIG.CLASS_DAYS.forEach(function(day, idx) {
    var dayDate = addDays(STATE.classWeekStart, idx);
    var isToday = formatDateISO(dayDate) === formatDateISO(new Date());
    var dateNum = dayDate.getDate();
    var monthName = dayDate.toLocaleDateString('en-GB', { month: 'short' });
    html.push('<div class="tt-day-label' + (isToday ? ' today' : '') + '"><span>' + day.label + '</span><span class="tt-day-date">' + dateNum + ' ' + monthName + '</span></div>');
    html.push('<div class="tt-day-track" data-day="' + day.key + '">');
    for (var h = 0; h < totalHours; h++) {
      var hourVal = CONFIG.GRID_START + h;
      html.push('<div class="tt-cell" data-day="' + day.key + '" data-time="' + hourVal + '"></div>');
      html.push('<div class="tt-cell hour-end" data-day="' + day.key + '" data-time="' + (hourVal + 0.5) + '"></div>');
    }
    html.push(STATE.classes.filter(function(c) { return c.day === day.key; }).map(buildClassBlock).join(''));
    html.push('</div>');
  });

  grid.innerHTML = html.join('');
}

function buildClassBlock(cls) {
  var startDec = parseTimeToDecimal(cls.start_time);
  var endDec = parseTimeToDecimal(cls.end_time);
  if (endDec <= startDec || startDec >= CONFIG.GRID_END || endDec <= CONFIG.GRID_START) return '';

  var renderStart = Math.max(startDec, CONFIG.GRID_START);
  var renderEnd = Math.min(endDec, CONFIG.GRID_END);
  var totalHours = CONFIG.GRID_END - CONFIG.GRID_START;
  var left = ((renderStart - CONFIG.GRID_START) / totalHours) * 100;
  var width = ((renderEnd - renderStart) / totalHours) * 100;
  var sel = STATE.classSelected && STATE.classSelected.type === 'block' && STATE.classSelected.id === cls.id;

  var badges = [];
  if (cls.slide_url) badges.push('<span class="cb-badge" title="Slides attached"><i class="fi fi-rr-file-pdf"></i></span>');
  if (cls.meeting_url) badges.push('<span class="cb-badge" title="Online link attached"><i class="fi fi-rr-video-camera-alt"></i></span>');
  if (cls.session_notes) badges.push('<span class="cb-badge" title="' + escapeHtml(cls.session_notes) + '"><i class="fi fi-rr-notebook"></i></span>');

  return '<div class="class-block' + (sel ? ' touch-selected' : '') + '" ' +
    (STATE.isTimetableEditMode ? 'draggable="true" ' : '') +
    'data-class-id="' + escapeHtml(cls.id) + '" style="left:' + left + '%; width:' + width + '%; background:' + escapeHtml(cls.color || '#6366f1') + ';">' +
    '<div class="cb-line cb-code">' + escapeHtml(cls.subject_code) + (badges.length ? ' <span class="cb-badges">' + badges.join('') + '</span>' : '') + '</div>' +
    (cls.subject_name ? '<div class="cb-line">' + escapeHtml(cls.subject_name) + '</div>' : '') +
    '<div class="cb-line cb-meta">' + escapeHtml(cls.start_time) + ' - ' + escapeHtml(cls.end_time) + '</div>' +
    (cls.room ? '<div class="cb-line cb-meta">' + escapeHtml(cls.room) + '</div>' : '') +
    '<button type="button" class="class-block-edit" data-action="edit-block" data-id="' + escapeHtml(cls.id) + '" title="Session details & links"><i class="fi fi-rr-edit"></i></button>' +
    '<button type="button" class="class-block-del" data-action="del-block" data-id="' + escapeHtml(cls.id) + '" title="Remove"><i class="fi fi-rr-trash"></i></button>' +
  '</div>';
}

// ── Placement + overlap detection ─────────────────────────
/** A class on the same day whose time overlaps [start, end) — null when free */
function findClassOverlap(day, start, end, ignoreId) {
  return STATE.classes.find(function(c) {
    if (c.id === ignoreId || c.day !== day) return false;
    return start < parseTimeToDecimal(c.end_time) && end > parseTimeToDecimal(c.start_time);
  }) || null;
}

function warnClassConflict(other) {
  Swal.fire({
    icon: 'warning', title: 'Time conflict!',
    text: 'This time is already used by ' + other.subject_code + ' (' + other.start_time + ' - ' + other.end_time + ').',
    timer: 3200, showConfirmButton: false
  });
}

function placeSubjectInCell(subjectId, cell) {
  var subj = STATE.subjectPool.find(function(s) { return s.id === subjectId; });
  if (!subj) return;
  var day = cell.dataset.day;
  var start = parseFloat(cell.dataset.time);
  var end = Math.min(start + 1, CONFIG.GRID_END);
  var conflict = findClassOverlap(day, start, end, null);
  if (conflict) { warnClassConflict(conflict); return; }

  STATE.classes.push({
    id: 'cls_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    subject_code: subj.subject_code,
    subject_name: subj.subject_name,
    week_start: formatDateISO(STATE.classWeekStart),
    day: day,
    start_time: decimalToTime(start),
    end_time: decimalToTime(end),
    room: subj.room || '',
    color: subj.color || '#6366f1',
    slide_url: '',
    meeting_url: '',
    session_notes: ''
  });
  setClassDirty(true);
  renderTimetable();
}

function moveBlockToCell(classId, cell) {
  var cls = STATE.classes.find(function(c) { return c.id === classId; });
  if (!cls) return;
  var day = cell.dataset.day;
  var duration = parseTimeToDecimal(cls.end_time) - parseTimeToDecimal(cls.start_time);
  var start = parseFloat(cell.dataset.time);
  if (start + duration > CONFIG.GRID_END) start = Math.max(CONFIG.GRID_START, CONFIG.GRID_END - duration);
  var end = start + duration;

  var conflict = findClassOverlap(day, start, end, cls.id);
  if (conflict) { warnClassConflict(conflict); return; }

  cls.day = day;
  cls.start_time = decimalToTime(start);
  cls.end_time = decimalToTime(end);
  setClassDirty(true);
  renderTimetable();
}

function removeClassFromGrid(classId) {
  STATE.classes = STATE.classes.filter(function(c) { return c.id !== classId; });
  if (STATE.classSelected && STATE.classSelected.id === classId) clearSelections();
  setClassDirty(true);
  renderTimetable();
}

// ── Events: HTML5 drag & drop + tap-to-select ─────────────
function initClassEvents() {
  var layout = $('classLayout');
  if (!layout) return;

  layout.addEventListener('dragstart', function(e) {
    if (!STATE.isTimetableEditMode) return;
    var subj = e.target.closest && e.target.closest('.pool-item[data-subject-id]');
    var block = e.target.closest && e.target.closest('.class-block');
    if (subj) STATE.drag = { kind: 'subject', id: subj.dataset.subjectId };
    else if (block) STATE.drag = { kind: 'block', id: block.dataset.classId };
    else return;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', STATE.drag.id); } catch (err) {}
    (subj || block).classList.add('dragging');
  });

  layout.addEventListener('dragend', function() {
    STATE.drag = null;
    layout.querySelectorAll('.dragging, .drag-over').forEach(function(el) { el.classList.remove('dragging', 'drag-over'); });
  });

  layout.addEventListener('dragover', function(e) {
    var cell = e.target.closest && e.target.closest('.tt-cell');
    if (!cell || !STATE.drag || !STATE.isTimetableEditMode) return;
    e.preventDefault();
    layout.querySelectorAll('.tt-cell.drag-over').forEach(function(c) { if (c !== cell) c.classList.remove('drag-over'); });
    cell.classList.add('drag-over');
  });

  layout.addEventListener('drop', function(e) {
    var cell = e.target.closest && e.target.closest('.tt-cell');
    if (!cell || !STATE.drag) return;
    e.preventDefault();
    var drag = STATE.drag;
    STATE.drag = null;
    cell.classList.remove('drag-over');
    if (drag.kind === 'subject') placeSubjectInCell(drag.id, cell);
    else moveBlockToCell(drag.id, cell);
  });

  layout.addEventListener('click', onClassClick);
}

function onClassClick(e) {
  var actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    var action = actionBtn.dataset.action, id = actionBtn.dataset.id;
    if (action === 'edit-block') openClassBlockModal(id);
    else if (action === 'del-block' && STATE.isTimetableEditMode) removeClassFromGrid(id);
    else if (action === 'edit-subject' && STATE.isTimetableEditMode) openEditSubjectModal(id);
    else if (action === 'del-subject' && STATE.isTimetableEditMode) confirmDeleteSubject(id);
    return;
  }

  // In View Mode, clicking a class block opens its Session & Materials modal (Slides, Zoom, Notes)
  if (!STATE.isTimetableEditMode) {
    var viewBlock = e.target.closest('.class-block');
    if (viewBlock && viewBlock.dataset.classId) {
      openClassBlockModal(viewBlock.dataset.classId);
    }
    return;
  }

  var sel = STATE.classSelected;
  var poolItem = e.target.closest('.pool-item[data-subject-id]');
  var block = e.target.closest('.class-block');
  var cell = e.target.closest('.tt-cell');

  // Tap a subject → select / deselect
  if (poolItem) {
    var sid = poolItem.dataset.subjectId;
    if (sel && sel.type === 'subject' && sel.id === sid) { clearSelections(); renderClassModule(); return; }
    clearSelections();
    STATE.classSelected = { type: 'subject', id: sid };
    renderClassModule();
    showHint('Tap a time cell in the timetable to place the subject');
    return;
  }

  // Tap a block with nothing (or the same block) selected → select it for moving
  if (block && (!sel || (sel.type === 'block' && sel.id === block.dataset.classId))) {
    if (sel) { clearSelections(); renderClassModule(); return; }
    STATE.classSelected = { type: 'block', id: block.dataset.classId };
    renderClassModule();
    showHint('Tap a new time cell to move this class');
    return;
  }

  // Tap a cell with a selection → place / move
  if (cell && sel) {
    if (sel.type === 'subject') {
      placeSubjectInCell(sel.id, cell);
      clearSelections();
      renderClassModule();
    } else {
      moveBlockToCell(sel.id, cell);
      clearSelections();
      renderClassModule();
    }
  }
}

// ── Class Session & Materials Modal ───────────────────────
function openClassBlockModal(classId) {
  var cls = STATE.classes.find(function(c) { return c.id === classId; });
  if (!cls) return;
  $('editClassBlockId').value = cls.id;
  if ($('blockSubjectCode')) $('blockSubjectCode').value = cls.subject_code || '';
  $('blockSubjectName').value = cls.subject_name || '';
  if ($('blockRoom')) $('blockRoom').value = cls.room || '';
  $('blockStartTime').value = cls.start_time || '08:00';
  $('blockEndTime').value = cls.end_time || '10:00';
  if ($('blockSlideUrl')) $('blockSlideUrl').value = cls.slide_url || '';
  if ($('blockMeetingUrl')) $('blockMeetingUrl').value = cls.meeting_url || '';
  if ($('blockSessionNotes')) $('blockSessionNotes').value = cls.session_notes || '';

  // Quick-open buttons for Slides & Online Meeting
  var qWrap = $('blockQuickLinks');
  var sBtn = $('blockOpenSlideBtn');
  var mBtn = $('blockOpenMeetBtn');
  var hasSlide = !!(cls.slide_url && cls.slide_url.trim());
  var hasMeet = !!(cls.meeting_url && cls.meeting_url.trim());

  if (sBtn) {
    sBtn.href = hasSlide ? cls.slide_url.trim() : '#';
    sBtn.classList.toggle('hidden', !hasSlide);
  }
  if (mBtn) {
    mBtn.href = hasMeet ? cls.meeting_url.trim() : '#';
    mBtn.classList.toggle('hidden', !hasMeet);
  }
  if (qWrap) {
    qWrap.classList.toggle('hidden', !hasSlide && !hasMeet);
  }

  $('classBlockModal').classList.remove('hidden');
}

function closeClassBlockModal() {
  var m = $('classBlockModal');
  if (m) m.classList.add('hidden');
}

function submitClassBlockEdit() {
  var classId = $('editClassBlockId').value;
  var startT = $('blockStartTime').value, endT = $('blockEndTime').value;
  if (!startT || !endT) { showWarning('Please enter both start and end times'); return; }

  var cls = STATE.classes.find(function(c) { return c.id === classId; });
  if (!cls) return;
  var startH = parseTimeToDecimal(startT), endH = parseTimeToDecimal(endT);
  if (endH <= startH) { showWarning('End time must be after start time'); return; }

  var conflict = findClassOverlap(cls.day, startH, endH, cls.id);
  if (conflict) { warnClassConflict(conflict); return; }

  cls.subject_name = ($('blockSubjectName').value || '').trim() || cls.subject_name;
  if ($('blockRoom')) cls.room = $('blockRoom').value.trim();
  cls.start_time = startT;
  cls.end_time = endT;
  if ($('blockSlideUrl')) cls.slide_url = $('blockSlideUrl').value.trim();
  if ($('blockMeetingUrl')) cls.meeting_url = $('blockMeetingUrl').value.trim();
  if ($('blockSessionNotes')) cls.session_notes = $('blockSessionNotes').value.trim();

  closeClassBlockModal();
  renderTimetable();
  renderOverviewHub();

  // If saved while in View mode, persist immediately to Google Sheets
  if (!STATE.isTimetableEditMode) {
    saveTimetableSilent();
  } else {
    setClassDirty(true);
  }
}

function saveLocalClassMaterials(classesList) {
  try {
    var raw = localStorage.getItem('uniplan_class_materials_v1');
    var map = raw ? JSON.parse(raw) : {};
    (classesList || []).forEach(function(c) {
      var hasMeta = (c.slide_url && c.slide_url.trim()) || (c.meeting_url && c.meeting_url.trim()) || (c.session_notes && c.session_notes.trim());
      var k1 = c.id || '';
      var k2 = (c.week_start || '') + '|' + (c.day || '') + '|' + (c.start_time || '') + '|' + (c.subject_code || '');
      if (hasMeta) {
        var meta = {
          slide_url: c.slide_url || '',
          meeting_url: c.meeting_url || '',
          session_notes: c.session_notes || ''
        };
        if (k1) map[k1] = meta;
        map[k2] = meta;
      } else {
        if (k1) delete map[k1];
        delete map[k2];
      }
    });
    localStorage.setItem('uniplan_class_materials_v1', JSON.stringify(map));
  } catch (e) {}
}

function mergeLocalClassMaterials(classesList) {
  try {
    var raw = localStorage.getItem('uniplan_class_materials_v1');
    if (!raw) return classesList || [];
    var map = JSON.parse(raw) || {};
    return (classesList || []).map(function(c) {
      var k1 = c.id || '';
      var k2 = (c.week_start || '') + '|' + (c.day || '') + '|' + (c.start_time || '') + '|' + (c.subject_code || '');
      var meta = map[k1] || map[k2];
      if (meta) {
        if (!c.slide_url && meta.slide_url) c.slide_url = meta.slide_url;
        if (!c.meeting_url && meta.meeting_url) c.meeting_url = meta.meeting_url;
        if (!c.session_notes && meta.session_notes) c.session_notes = meta.session_notes;
      }
      return c;
    });
  } catch (e) {
    return classesList || [];
  }
}

function saveTimetableSilent(callback) {
  var currentWeekKey = formatDateISO(STATE.classWeekStart);
  STATE.allClasses = (STATE.allClasses || []).filter(function(c) {
    return c.week_start !== currentWeekKey && (c.week_start || currentWeekKey !== formatDateISO(getWeekStart(new Date())));
  });
  (STATE.classes || []).forEach(function(c) {
    c.week_start = currentWeekKey;
    STATE.allClasses.push(c);
  });
  saveLocalClassMaterials(STATE.allClasses);

  runServer('saveClasses', [STATE.allClasses, buildCombinedSubjectPoolPayload()], function(res) {
    if (res && res.success !== false) {
      STATE.classDirty = false;
      refreshSyncIndicator();
      if (!callback) showSuccess('Session & links saved!');
    }
    if (callback) callback();
  }, function() {
    if (callback) callback();
  });
}

// ── Subject modal ─────────────────────────────────────────
function openAddSubjectModal() {
  $('subjectModalTitle').textContent = 'New subject';
  $('editSubjectId').value = '';
  $('subjectCode').value = '';
  $('subjectName').value = '';
  $('subjectRoom').value = '';
  $('subjectColor').value = CONFIG.COLORS[STATE.subjectPool.length % CONFIG.COLORS.length];
  initColorSwatches();
  $('subjectModal').classList.remove('hidden');
  setTimeout(function() { $('subjectCode').focus(); }, 100);
}

function openEditSubjectModal(id) {
  var s = STATE.subjectPool.find(function(x) { return x.id === id; });
  if (!s) return;
  $('subjectModalTitle').textContent = 'Edit subject';
  $('editSubjectId').value = s.id;
  $('subjectCode').value = s.subject_code || '';
  $('subjectName').value = s.subject_name || '';
  $('subjectRoom').value = s.room || '';
  $('subjectColor').value = s.color || '#6366f1';
  initColorSwatches();
  $('subjectModal').classList.remove('hidden');
}

function closeSubjectModal() {
  var m = $('subjectModal');
  if (m) m.classList.add('hidden');
}

function submitSubject() {
  var code = $('subjectCode').value.trim();
  var name = $('subjectName').value.trim();
  if (!code || !name) { showWarning('Please enter the subject code and name'); return; }

  var editId = $('editSubjectId').value;
  var subject = {
    id:           editId || ('subj_' + Date.now()),
    subject_code: code,
    subject_name: name,
    room:         $('subjectRoom').value.trim(),
    color:        $('subjectColor').value || '#6366f1'
  };

  if (editId) {
    var idx = STATE.subjectPool.findIndex(function(s) { return s.id === editId; });
    var oldCode = idx >= 0 ? STATE.subjectPool[idx].subject_code : null;
    if (idx >= 0) STATE.subjectPool[idx] = subject;
    // Keep already placed blocks in sync with the edited subject
    STATE.classes.forEach(function(c) {
      if (oldCode && c.subject_code === oldCode) {
        c.subject_code = code; c.subject_name = name; c.room = subject.room; c.color = subject.color;
      }
    });
    if (oldCode && oldCode !== code) {
      if (STATE.study.grades[oldCode]) { STATE.study.grades[code] = STATE.study.grades[oldCode]; delete STATE.study.grades[oldCode]; }
      if (STATE.study.credits[oldCode] !== undefined) { STATE.study.credits[code] = STATE.study.credits[oldCode]; delete STATE.study.credits[oldCode]; }
      if (STATE.study.cutoffs[oldCode]) { STATE.study.cutoffs[code] = STATE.study.cutoffs[oldCode]; delete STATE.study.cutoffs[oldCode]; }
    }
  } else {
    STATE.subjectPool.push(subject);
  }

  closeSubjectModal();
  setClassDirty(true);
  renderClassModule();
  savePoolAndGradesToSheetSilent();
}

function confirmDeleteSubject(id) {
  confirmDialog('Remove this subject from the pool?', 'Classes already placed in the timetable are kept.', 'Remove').then(function(ok) {
    if (!ok) return;
    STATE.subjectPool = STATE.subjectPool.filter(function(x) { return x.id !== id; });
    if (STATE.classSelected && STATE.classSelected.id === id) clearSelections();
    setClassDirty(true);
    renderClassModule();
    savePoolAndGradesToSheetSilent();
  });
}

// ── Color swatches ────────────────────────────────────────
function initColorSwatches() {
  var wrap = $('subjectColorSwatches');
  if (!wrap) return;
  var current = $('subjectColor').value;
  wrap.innerHTML = SUBJECT_COLORS.map(function(c) {
    return '<div class="color-swatch' + (c === current ? ' selected' : '') + '" style="background:' + c + ';" ' +
      'onclick="selectColor(' + arg(c) + ')" data-color="' + c + '"></div>';
  }).join('');
}

function selectColor(color) {
  $('subjectColor').value = color;
  document.querySelectorAll('#subjectColorSwatches .color-swatch').forEach(function(el) {
    el.classList.toggle('selected', el.dataset.color === color);
  });
}

// ── Save Timetable (manual) ───────────────────────────────
function saveTimetable() {
  if (STATE.classSaving) return;
  STATE.classSaving = true;
  refreshSyncIndicator();
  var btn = $('saveNowBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fi fi-rr-spinner"></i> Saving...';

  function done() {
    STATE.classSaving = false;
    btn.disabled = false;
    btn.innerHTML = '<i class="fi fi-rr-disk"></i> Save Timetable';
    refreshSyncIndicator();
  }

  // Merge active week's classes into STATE.allClasses
  var currentWeekKey = formatDateISO(STATE.classWeekStart);
  STATE.allClasses = (STATE.allClasses || []).filter(function(c) {
    return c.week_start !== currentWeekKey && (c.week_start || currentWeekKey !== formatDateISO(getWeekStart(new Date())));
  });
  (STATE.classes || []).forEach(function(c) {
    c.week_start = currentWeekKey;
    STATE.allClasses.push(c);
  });
  saveLocalClassMaterials(STATE.allClasses);

  runServer('saveClasses', [STATE.allClasses, buildCombinedSubjectPoolPayload()], function(res) {
    done();
    if (res && res.success === false) { refreshSyncIndicator('error', 'Save failed'); showError(res.error); return; }
    STATE.classDirty = false;
    refreshSyncIndicator();
    renderOverviewHub();
    Swal.fire({ icon: 'success', title: 'Timetable saved for this week!', timer: 1500, showConfirmButton: false });
  }, function(e) { done(); refreshSyncIndicator('error', 'Save failed'); handleError(e); });
}

// ── Export Class Timetable as Image / Clipboard ───────────
function captureClassCanvas() {
  if (typeof html2canvas === 'undefined') {
    return Promise.reject(new Error('The image library could not be loaded. Check your connection.'));
  }
  var grid = $('timetable');
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim() || '#0f172a';
  grid.classList.add('exporting');
  return html2canvas(grid, { backgroundColor: bg, scale: 2, useCORS: true }).then(function(canvas) {
    grid.classList.remove('exporting');
    return canvas;
  }, function(err) {
    grid.classList.remove('exporting');
    throw err;
  });
}

function exportClassImage() {
  Swal.fire({ title: 'Creating timetable image...', allowOutsideClick: false, showConfirmButton: false, didOpen: function() { Swal.showLoading(); } });
  captureClassCanvas().then(function(canvas) {
    Swal.close();
    var link = document.createElement('a');
    link.download = 'class_timetable_' + formatDateISO(STATE.classWeekStart || new Date()) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(function(err) {
    Swal.close();
    showError(err && err.message);
  });
}

function buildClassText() {
  var lines = ['Day\tTime\tCode\tSubject\tRoom'];
  CONFIG.CLASS_DAYS.forEach(function(d) {
    var dayClasses = (STATE.classes || []).filter(function(c) { return c.day === d.key; });
    dayClasses.sort(function(a, b) { return timeToMin(a.start_time) - timeToMin(b.start_time); });
    dayClasses.forEach(function(c) {
      lines.push([d.label, c.start_time + '-' + c.end_time, c.subject_code, c.subject_name, c.room || ''].join('\t'));
    });
  });
  return lines.join('\n');
}

function copyClassText() {
  var text = buildClassText();
  var p = (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(text) : Promise.reject();
  return p.then(function() { return true; }, function() { return copyTextFallback(text); });
}

function copyClassToClipboard() {
  var canCopyImage = navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== 'undefined';

  function copyAsText() {
    copyClassText().then(function(ok) {
      if (ok) Swal.fire({ icon: 'success', title: 'Copied as text', text: 'Image copy is not available here, so the timetable was copied as a table.', timer: 2600, showConfirmButton: false });
      else showError('Could not access the clipboard. Use "Export as Image" instead.');
    });
  }

  if (!canCopyImage) { copyAsText(); return; }

  captureClassCanvas().then(function(canvas) {
    return new Promise(function(resolve, reject) {
      canvas.toBlob(function(blob) { blob ? resolve(blob) : reject(new Error('Image creation failed')); }, 'image/png');
    });
  }).then(function(blob) {
    return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
  }).then(function() {
    Swal.fire({ icon: 'success', title: 'Timetable image copied', timer: 1500, showConfirmButton: false });
  }).catch(function() {
    copyAsText();
  });
}

function ensureClassesSavedBeforeAction(callback) {
  if (!STATE.classDirty) {
    callback();
    return;
  }
  saveTimetableSilent(callback);
}

function getAvailableSubjectOptionsHtml(allLabel) {
  var seen = {};
  var list = [];
  (STATE.subjectPool || []).forEach(function(s) {
    if (s.subject_code && !seen[s.subject_code]) {
      seen[s.subject_code] = true;
      list.push({ code: s.subject_code, name: s.subject_name || '' });
    }
  });
  getEffectiveAllClasses().forEach(function(c) {
    if (c.subject_code && !seen[c.subject_code]) {
      seen[c.subject_code] = true;
      list.push({ code: c.subject_code, name: c.subject_name || '' });
    }
  });
  return '<option value="all">' + escapeHtml(allLabel || 'All subjects') + '</option>' +
    list.map(function(item) {
      return '<option value="' + escapeHtml(item.code) + '">' + escapeHtml(item.code + (item.name ? ' — ' + item.name : '')) + '</option>';
    }).join('');
}

function buildClientClassDates(weekStartStr, dayKey, startHHMM, endHHMM) {
  var dIdx = CONFIG.DAY_KEYS.indexOf(String(dayKey || 'monday').toLowerCase());
  if (dIdx === -1) dIdx = 0;
  var baseDate = (weekStartStr && /^\d{4}-\d{2}-\d{2}$/.test(weekStartStr))
    ? parseDateISO(weekStartStr)
    : getWeekStart(new Date());
  var classDay = addDays(baseDate, dIdx);
  var sp = String(startHHMM || '08:00').split(':');
  var ep = String(endHHMM || '10:00').split(':');
  var startD = new Date(classDay.getFullYear(), classDay.getMonth(), classDay.getDate(), parseInt(sp[0], 10) || 0, parseInt(sp[1], 10) || 0, 0);
  var endD = new Date(classDay.getFullYear(), classDay.getMonth(), classDay.getDate(), parseInt(ep[0], 10) || 0, parseInt(ep[1], 10) || 0, 0);
  if (endD <= startD) endD = new Date(startD.getTime() + 3600000);
  return { start: startD, end: endD, classDay: classDay };
}

function syncClassesClientFallback(opts) {
  var subjectFilter = (opts && opts.subjectCode) || 'all';
  var weekStartFilter = (opts && opts.weekStart) || 'all';
  var allClasses = getEffectiveAllClasses();
  var filtered = allClasses.filter(function(c) {
    if (subjectFilter !== 'all' && String(c.subject_code).toLowerCase() !== String(subjectFilter).toLowerCase()) return false;
    if (weekStartFilter !== 'all' && c.week_start && c.week_start !== weekStartFilter) return false;
    return true;
  });

  if (filtered.length === 0) {
    hideLoading();
    Swal.fire({ icon: 'info', title: 'No classes matched', text: 'No classes matched the selected filter.' });
    return;
  }

  var idx = 0, created = 0, skipped = 0;
  function next() {
    if (idx >= filtered.length) {
      hideLoading();
      invalidateTaskCache();
      if (STATE.currentModule === 'task') loadTaskModule(true);
      Swal.fire({
        icon: 'success',
        title: 'Classes synced to Google Calendar!',
        text: 'Created ' + created + ' new class event(s)' + (skipped ? ' (' + skipped + ' already in calendar).' : '.')
      });
      return;
    }
    var c = filtered[idx++];
    var times = buildClientClassDates(c.week_start, c.day, c.start_time, c.end_time);
    var title = '[Class] ' + c.subject_code + (c.subject_name ? ' — ' + c.subject_name : '');
    var dup = (STATE.tasks || []).some(function(t) {
      return t.title === title && Math.abs(new Date(t.startTime).getTime() - times.start.getTime()) < 60000;
    });
    if (dup) {
      skipped++;
      next();
      return;
    }
    var descLines = ['Class Session: ' + c.subject_code + (c.subject_name ? ' — ' + c.subject_name : '')];
    if (c.room) descLines.push('Room: ' + c.room);
    if (c.slide_url) descLines.push('Slides: ' + c.slide_url);
    if (c.meeting_url) descLines.push('Online Meeting: ' + c.meeting_url);
    if (c.session_notes) descLines.push('Notes: ' + c.session_notes);

    runServer('createTask', [{
      title: title,
      startTime: times.start.toISOString(),
      endTime: times.end.toISOString(),
      description: descLines.join('\n'),
      priority: 'low'
    }], function(r) {
      if (r && r.success) created++;
      next();
    }, function() { next(); });
  }
  next();
}

function sendClassesDiscordClientFallback(opts, weekLabel) {
  var weekStartStr = (opts && opts.weekStart) || formatDateISO(STATE.classWeekStart);
  var subjectFilter = (opts && opts.subjectCode) || 'all';
  var allClasses = getEffectiveAllClasses();
  var filtered = allClasses.filter(function(c) {
    if (weekStartStr && c.week_start && c.week_start !== weekStartStr) return false;
    if (subjectFilter !== 'all' && String(c.subject_code).toLowerCase() !== String(subjectFilter).toLowerCase()) return false;
    return true;
  });

  var fields = [];
  CONFIG.CLASS_DAYS.forEach(function(dObj) {
    var dayClasses = filtered.filter(function(c) { return String(c.day).toLowerCase() === dObj.key; });
    if (dayClasses.length === 0) return;
    dayClasses.sort(function(a, b) { return timeToMin(a.start_time) - timeToMin(b.start_time); });
    var times = buildClientClassDates(weekStartStr, dObj.key, '08:00', '10:00');
    var dateLabel = formatDateShort(times.classDay);
    var lines = dayClasses.map(function(c) {
      var extras = [];
      if (c.room) extras.push('📍 `' + c.room + '`');
      if (c.slide_url) extras.push('[📄 Slides](' + c.slide_url + ')');
      if (c.meeting_url) extras.push('[🎥 Join](' + c.meeting_url + ')');
      return '• `' + c.start_time + '–' + c.end_time + '` **' + c.subject_code + '**' +
        (c.subject_name ? ' — ' + c.subject_name : '') +
        (extras.length ? ' (' + extras.join(' • ') + ')' : '') +
        (c.session_notes ? '\n  *Note: ' + c.session_notes + '*' : '');
    });
    fields.push({
      name: '📚 ' + dObj.label + ' (' + dateLabel + ')',
      value: lines.join('\n').substring(0, 1020),
      inline: false
    });
  });

  if (fields.length === 0) {
    fields.push({
      name: 'No classes scheduled',
      value: 'There are no classes matching the selected filter for this week.',
      inline: false
    });
  }

  var embedPayload = {
    embeds: [{
      title: '🎓 Class Timetable — ' + weekLabel + (subjectFilter !== 'all' ? ' (' + subjectFilter + ')' : ''),
      description: 'Total sessions: **' + filtered.length + '**',
      color: 1096065,
      fields: fields,
      footer: { text: 'UniPlan • Synced from Class Schedule' },
      timestamp: new Date().toISOString()
    }]
  };

  fetch('/api/gas', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'sendDiscordEmbed', args: [embedPayload] })
  }).then(function(r) { return r.json(); }).then(function(res) {
    hideLoading();
    if (!isOk(res)) return;
    Swal.fire({
      icon: 'success',
      title: 'Sent to Discord!',
      text: 'Posted ' + filtered.length + ' class session(s) for ' + weekLabel + '.',
      timer: 2200,
      showConfirmButton: false
    });
  }).catch(function(e) {
    hideLoading();
    handleError(e);
  });
}

// ── Reminder: class starts in 15 minutes ──────────────────
var CLASS_NOTIFIED = {};
setInterval(function() {
  if (!STATE.classes || STATE.classes.length === 0) return;
  var now = new Date();
  var todayKey = CONFIG.DAY_KEYS[now.getDay() === 0 ? 6 : now.getDay() - 1];
  var nowMin = now.getHours() * 60 + now.getMinutes();

  STATE.classes.forEach(function(c) {
    if (c.day !== todayKey) return;
    var diff = timeToMin(c.start_time) - nowMin;
    var key = formatDateISO(now) + '|' + c.id + '|' + c.start_time;
    if (diff > 0 && diff <= 15 && !CLASS_NOTIFIED[key]) {
      CLASS_NOTIFIED[key] = true;
      sendNotification('Class starting soon!', c.subject_name + ' starts in ' + diff + ' minutes (' + c.start_time + ')');
    }
  });
}, 30000);

function isGradeSheetPoolRow(row) {
  return row && String(row.id || '').indexOf('GRADE_') === 0;
}

function ingestSubjectPoolResponse(rawRows) {
  var rows = Array.isArray(rawRows) ? rawRows : [];
  var cleanSubjects = [];
  var sheetGrades = {};
  var sheetCredits = {};
  var upgradedLegacyNames = false;
  var hasGradeRows = false;

  rows.forEach(function(r) {
    if (!r || !r.subject_code) return;
    if (isGradeSheetPoolRow(r)) {
      hasGradeRows = true;
      var code = String(r.subject_code).trim();
      if (!sheetGrades[code]) sheetGrades[code] = [];
      var compName = r.subject_name || 'Assessment';
      var weight = 10, earned = '', max = 100;
      var metaStr = String(r.room || '');
      if (metaStr.indexOf('W:') !== -1) {
        metaStr.split('|').forEach(function(part) {
          if (part.indexOf('W:') === 0) weight = parseFloat(part.slice(2)) || 0;
          else if (part.indexOf('S:') === 0) {
            var sv = part.slice(2).trim();
            earned = (sv === '' || isNaN(parseFloat(sv))) ? '' : parseFloat(sv);
          } else if (part.indexOf('M:') === 0) max = parseFloat(part.slice(2)) || 100;
        });
      }
      sheetGrades[code].push({ name: compName, weight: weight, earned: earned, max: max });

      var crStr = String(r.color || '');
      if (crStr.indexOf('CR:') === 0) {
        var crVal = parseFloat(crStr.slice(3));
        if (!isNaN(crVal) && crVal > 0) sheetCredits[code] = crVal;
      }
      return;
    }

    var sCode = String(r.subject_code).trim();
    var sName = String(r.subject_name || '').trim();
    if (LEGACY_SEED_NAME_MAP[sName]) {
      sName = LEGACY_SEED_NAME_MAP[sName];
      upgradedLegacyNames = true;
    }
    cleanSubjects.push({
      id: r.id || ('sub_' + sCode.toLowerCase()),
      subject_code: sCode,
      subject_name: sName,
      room: r.room || '',
      color: (r.color && String(r.color).indexOf('#') === 0) ? r.color : CONFIG.COLORS[cleanSubjects.length % CONFIG.COLORS.length]
    });
  });

  if (cleanSubjects.length > 0) {
    STATE.subjectPool = cleanSubjects;
  }

  Object.keys(sheetGrades).forEach(function(code) {
    if (sheetGrades[code].length > 0) {
      STATE.study.grades[code] = sheetGrades[code];
    }
  });
  Object.keys(sheetCredits).forEach(function(code) {
    STATE.study.credits[code] = sheetCredits[code];
  });

  saveStudyDataLocal();

  // If the Google Sheet still had the legacy English names or no grade rows yet, sync them to the Sheet automatically
  if (cleanSubjects.length > 0 && (upgradedLegacyNames || !hasGradeRows)) {
    savePoolAndGradesToSheetSilent();
  }
}

function buildCombinedSubjectPoolPayload() {
  var pool = [];
  var seenCodes = {};

  (STATE.subjectPool || []).forEach(function(s) {
    if (!s || !s.subject_code || isGradeSheetPoolRow(s)) return;
    seenCodes[s.subject_code] = true;
    pool.push({
      id: s.id || ('sub_' + s.subject_code.toLowerCase()),
      subject_code: s.subject_code,
      subject_name: s.subject_name || '',
      room: s.room || '',
      color: s.color || '#6366f1'
    });
  });

  (STATE.study.customSubjects || []).forEach(function(cs) {
    if (!cs || !cs.code || seenCodes[cs.code]) return;
    seenCodes[cs.code] = true;
    pool.push({
      id: 'sub_' + cs.code.toLowerCase(),
      subject_code: cs.code,
      subject_name: cs.name || '',
      room: cs.room || '',
      color: cs.color || CONFIG.COLORS[pool.length % CONFIG.COLORS.length]
    });
  });

  if (pool.length === 0) {
    DEFAULT_STUDY_SUBJECTS.forEach(function(ds, idx) {
      pool.push({
        id: 'sub_' + ds.code.toLowerCase(),
        subject_code: ds.code,
        subject_name: ds.name,
        room: '',
        color: CONFIG.COLORS[idx % CONFIG.COLORS.length]
      });
    });
  }

  // Append each subject's grade rows so they are stored directly in the SubjectPool tab in Google Sheets
  var gradeRows = [];
  pool.forEach(function(s) {
    var code = s.subject_code;
    ensureSubjectGradeInitialized(code);
    var items = STATE.study.grades[code] || [];
    var cred = getSubjectCredits(code);
    items.forEach(function(it, idx) {
      var w = parseFloat(it.weight) || 0;
      var e = (it.earned === '' || it.earned === null || it.earned === undefined || isNaN(parseFloat(it.earned))) ? '' : parseFloat(it.earned);
      var m = parseFloat(it.max) || 100;
      gradeRows.push({
        id: 'GRADE_' + code + '_' + (idx + 1),
        subject_code: code,
        subject_name: it.name || ('Component ' + (idx + 1)),
        room: 'W:' + w + '|S:' + e + '|M:' + m,
        color: 'CR:' + cred
      });
    });
  });

  return pool.concat(gradeRows);
}

function getAllStudySubjects() {
  var map = {};
  var list = [];
  var defaultCreditsMap = {};
  DEFAULT_STUDY_SUBJECTS.forEach(function(ds) {
    defaultCreditsMap[ds.code] = ds.credits || 3;
  });

  var poolSubjects = (STATE.subjectPool || []).filter(function(s) {
    return s && s.subject_code && !isGradeSheetPoolRow(s);
  });

  if (poolSubjects.length > 0) {
    poolSubjects.forEach(function(s) {
      if (!map[s.subject_code]) {
        map[s.subject_code] = true;
        var defCred = defaultCreditsMap[s.subject_code] || 3;
        list.push({
          id: s.id || ('sub_' + s.subject_code.toLowerCase()),
          code: s.subject_code,
          name: s.subject_name || '',
          room: s.room || '',
          color: s.color || '#6366f1',
          credits: (STATE.study.credits && STATE.study.credits[s.subject_code] !== undefined)
            ? parseFloat(STATE.study.credits[s.subject_code])
            : defCred
        });
      }
    });
  } else {
    DEFAULT_STUDY_SUBJECTS.forEach(function(s, idx) {
      map[s.code] = true;
      list.push({
        id: 'sub_' + s.code.toLowerCase(),
        code: s.code,
        name: s.name,
        room: '',
        color: CONFIG.COLORS[idx % CONFIG.COLORS.length],
        credits: s.credits || 3
      });
    });
  }

  (STATE.study.customSubjects || []).forEach(function(s) {
    if (s.code && !map[s.code]) {
      map[s.code] = true;
      list.push({
        id: 'sub_' + s.code.toLowerCase(),
        code: s.code,
        name: s.name || '',
        room: s.room || '',
        color: s.color || '#8b5cf6',
        credits: s.credits || 3
      });
    }
  });
  return list;
}

function getSubjectCredits(subjectCode) {
  if (STATE.study.credits && STATE.study.credits[subjectCode] !== undefined) {
    return parseFloat(STATE.study.credits[subjectCode]) || 0;
  }
  var found = getAllStudySubjects().find(function(s) { return s.code === subjectCode; });
  return found && found.credits ? found.credits : 3;
}

function getSubjectCutoffs(subjectCode) {
  var custom = (STATE.study.cutoffs && STATE.study.cutoffs[subjectCode]) || {};
  return {
    'A':  custom['A']  !== undefined ? parseFloat(custom['A'])  : DEFAULT_GRADE_CUTOFFS['A'],
    'B+': custom['B+'] !== undefined ? parseFloat(custom['B+']) : DEFAULT_GRADE_CUTOFFS['B+'],
    'B':  custom['B']  !== undefined ? parseFloat(custom['B'])  : DEFAULT_GRADE_CUTOFFS['B'],
    'C+': custom['C+'] !== undefined ? parseFloat(custom['C+']) : DEFAULT_GRADE_CUTOFFS['C+'],
    'C':  custom['C']  !== undefined ? parseFloat(custom['C'])  : DEFAULT_GRADE_CUTOFFS['C'],
    'D+': custom['D+'] !== undefined ? parseFloat(custom['D+']) : DEFAULT_GRADE_CUTOFFS['D+'],
    'D':  custom['D']  !== undefined ? parseFloat(custom['D'])  : DEFAULT_GRADE_CUTOFFS['D']
  };
}

function scoreToLetterGrade(scorePct, cutoffs) {
  var c = cutoffs || DEFAULT_GRADE_CUTOFFS;
  if (scorePct >= c['A'])  return 'A';
  if (scorePct >= c['B+']) return 'B+';
  if (scorePct >= c['B'])  return 'B';
  if (scorePct >= c['C+']) return 'C+';
  if (scorePct >= c['C'])  return 'C';
  if (scorePct >= c['D+']) return 'D+';
  if (scorePct >= c['D'])  return 'D';
  return 'F';
}

        var parsed = JSON.parse(localRaw);
        if (parsed && typeof parsed === 'object') {
          STATE.study.grades = parsed.grades || {};
          STATE.study.credits = parsed.credits || {};
          STATE.study.cutoffs = parsed.cutoffs || {};
          STATE.study.customSubjects = Array.isArray(parsed.customSubjects) ? parsed.customSubjects : [];
          STATE.study.sessions = Array.isArray(parsed.sessions) ? parsed.sessions : [];
        }
      }
    } catch (e) {}
  }

  populateStudySubjectDropdowns();
  getAllStudySubjects().forEach(function(s) {
    ensureSubjectGradeInitialized(s.code);
  });
  saveStudyDataLocal();
  renderStudyTimerUI();
  renderStudySessionLogs();
  renderGradeTracker();

  if (!STATE.study.loaded) {
    STATE.study.loaded = true;
    // Fetch SubjectPool & Grade rows from Google Sheet
    syncStudyWithGoogleSheet(false);
    // Also fetch StudyData if available on backend
    runServer('getStudyData', [], function(res) {
      if (res && res.success && res.data) {
        var d = res.data;
        if (d.grades && Object.keys(d.grades).length > 0 && d.v3) STATE.study.grades = d.grades;
        if (d.credits && Object.keys(d.credits).length > 0) STATE.study.credits = d.credits;
        if (d.cutoffs && Object.keys(d.cutoffs).length > 0 && d.v3) STATE.study.cutoffs = d.cutoffs;
        if (Array.isArray(d.customSubjects) && d.customSubjects.length > 0) STATE.study.customSubjects = d.customSubjects;
        if (Array.isArray(d.sessions) && d.sessions.length > 0) STATE.study.sessions = d.sessions;
        saveStudyDataLocal();
        populateStudySubjectDropdowns();
        ensureSubjectGradeInitialized(STATE.study.selectedSubject);
        renderStudySessionLogs();
        renderGradeTracker();
      }
    }, function() {});
  }
}

// ── Web Audio API Chime Generator (1-Min Warning & Time Up) ──
function playStudyChime(type) {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ctx = new AudioCtx();

    function tone(freq, startOffset, duration, gainVal) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + startOffset);
      gain.gain.setValueAtTime(gainVal || 0.22, ctx.currentTime + startOffset);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startOffset + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + startOffset);
      osc.stop(ctx.currentTime + startOffset + duration);
    }

    if (type === 'warning') {
      // Double high chime for OSCE 1-minute warning
      tone(880, 0, 0.22, 0.25);
      tone(1046.5, 0.26, 0.35, 0.25);
    } else {
      // Triple bell for station/session complete
      tone(783.99, 0, 0.22, 0.28);
      tone(987.77, 0.25, 0.22, 0.28);
      tone(1174.66, 0.50, 0.55, 0.30);
    }
  } catch (e) {}
}

// ── Pomodoro & OSCE Station Timer Logic ───────────────────
function selectTimerPreset(presetId, minutes, mode, label) {
  var t = STATE.study.timer;
  if (t.running) {
    clearInterval(t.intervalId);
    t.running = false;
  }
  t.presetId = presetId;
  t.mode = mode;
  t.label = label;
  t.durationSec = minutes * 60;
  t.remainingSec = minutes * 60;
  t.warned1Min = false;

  document.querySelectorAll('.timer-preset-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.id === 'preset_' + presetId);
  });
  renderStudyTimerUI();
}

function toggleStudyTimer() {
  var t = STATE.study.timer;
  if (t.running) {
    clearInterval(t.intervalId);
    t.running = false;
    renderStudyTimerUI();
    return;
  }

  if (t.remainingSec <= 0) {
    t.remainingSec = t.durationSec;
    t.warned1Min = false;
  }

  t.running = true;
  renderStudyTimerUI();

  t.intervalId = setInterval(function() {
    if (t.remainingSec > 0) {
      t.remainingSec--;
    }

    // OSCE 1-minute warning at 60 seconds left
    if (t.mode === 'osce' && t.remainingSec === 60 && !t.warned1Min) {
      t.warned1Min = true;
      playStudyChime('warning');
      sendNotification('OSCE 1-Minute Warning!', '60 seconds remaining in ' + t.label + '. Wrap up and summarize!');
    }

    renderStudyTimerUI();

    if (t.remainingSec <= 0) {
      clearInterval(t.intervalId);
      t.running = false;
      playStudyChime('done');
      onStudyTimerComplete();
    }
  }, 1000);
}

function resetStudyTimer() {
  var t = STATE.study.timer;
  if (t.running) {
    clearInterval(t.intervalId);
    t.running = false;
  }
  t.remainingSec = t.durationSec;
  t.warned1Min = false;
  renderStudyTimerUI();
}

function onStudyTimerComplete() {
  var t = STATE.study.timer;
  var subjSel = $('timerSubjectSelect');
  var subjCode = (subjSel && subjSel.value) ? subjSel.value : STATE.study.selectedSubject;
  var mins = Math.max(1, Math.round(t.durationSec / 60));

  if (t.mode !== 'break') {
    STATE.study.sessions.unshift({
      id: 'sess_' + Date.now(),
      subject: subjCode,
      mode: t.mode,
      label: t.label,
      minutes: mins,
      date: formatDateISO(new Date()),
      time: formatTimeHHMM(new Date())
    });
    if (STATE.study.sessions.length > 40) {
      STATE.study.sessions = STATE.study.sessions.slice(0, 40);
    }
    saveStudyDataToServer(false);
    renderStudySessionLogs();
  }

  renderStudyTimerUI();
  sendNotification('Timer Finished!', t.label + ' (' + subjCode + ') is complete!');
  Swal.fire({
    icon: 'success',
    title: t.mode === 'osce' ? 'OSCE Station Time Up!' : 'Session Complete!',
    text: t.label + ' (' + subjCode + ') finished.',
    timer: 3200,
    showConfirmButton: true
  });
}

function renderStudyTimerUI() {
  var t = STATE.study.timer;
  var mins = Math.floor(t.remainingSec / 60);
  var secs = t.remainingSec % 60;
  var clockStr = pad2(mins) + ':' + pad2(secs);

  var disp = $('studyTimerDisplay');
  if (disp) disp.textContent = clockStr;

  var cap = $('timerModeCaption');
  if (cap) cap.textContent = t.label;

  var pct = t.durationSec > 0 ? Math.max(0, Math.min(100, (t.remainingSec / t.durationSec) * 100)) : 100;
  var bar = $('studyTimerBar');
  if (bar) bar.style.width = pct + '%';

  var isOsceWarn = (t.mode === 'osce' && t.remainingSec > 0 && t.remainingSec <= 60);
  var box = $('timerDisplayBox');
  if (box) {
    box.classList.toggle('osce-warning', isOsceWarn);
    box.classList.toggle('is-running', t.running);
  }
  var warnBanner = $('osceWarningBanner');
  if (warnBanner) warnBanner.classList.toggle('hidden', !isOsceWarn);

  var badge = $('timerStatusBadge');
  if (badge) {
    if (isOsceWarn) {
      badge.textContent = '1-Min Warning!';
      badge.className = 'timer-status-badge warn';
    } else if (t.running) {
      badge.textContent = t.mode === 'osce' ? 'OSCE Active' : 'Focusing...';
      badge.className = 'timer-status-badge running';
    } else {
      badge.textContent = 'Ready';
      badge.className = 'timer-status-badge';
    }
  }

  var startBtn = $('timerStartPauseBtn');
  if (startBtn) {
    startBtn.innerHTML = t.running
      ? '<i class="fi fi-rr-pause"></i> Pause'
      : '<i class="fi fi-rr-play"></i> Start';
  }

  // Update topbar live pill so timer is visible across all modules
  var pill = $('topbarTimerPill');
  if (pill) {
    var showPill = t.running || t.remainingSec < t.durationSec;
    pill.classList.toggle('hidden', !showPill);
    pill.classList.toggle('warn', isOsceWarn);
    var pMode = $('topbarTimerMode');
    var pClock = $('topbarTimerClock');
    if (pMode) pMode.textContent = t.mode === 'osce' ? 'OSCE' : (t.mode === 'break' ? 'Break' : 'Study');
    if (pClock) pClock.textContent = clockStr;
  }
}

function renderStudySessionLogs() {
  var listEl = $('studySessionLogList');
  var totalEl = $('studyTotalMinsPill');
  if (!listEl) return;

  var sessions = STATE.study.sessions || [];
  var totalMins = sessions.reduce(function(sum, s) { return sum + (Number(s.minutes) || 0); }, 0);
  if (totalEl) totalEl.textContent = totalMins + ' mins total (' + sessions.length + ' sessions)';

  if (sessions.length === 0) {
    listEl.innerHTML = '<div class="glance-empty">No completed study or OSCE sessions yet. Start a timer above!</div>';
    return;
  }

  listEl.innerHTML = sessions.slice(0, 8).map(function(s) {
    var isOsce = s.mode === 'osce';
    return '<div class="study-log-item">' +
      '<span class="study-log-tag ' + (isOsce ? 'osce' : 'study') + '">' + (isOsce ? 'OSCE' : 'Focus') + '</span>' +
      '<span class="study-log-subj">' + escapeHtml(s.subject) + '</span>' +
      '<span class="study-log-desc">' + escapeHtml(s.label) + ' (' + escapeHtml(s.minutes) + 'm)</span>' +
      '<span class="study-log-time">' + escapeHtml(s.date + ' ' + (s.time || '')) + '</span>' +
    '</div>';
  }).join('');
}

// ── Score, Weight & Grade Target Calculator ───────────────
function ensureSubjectGradeInitialized(subjectCode) {
  if (!subjectCode) return;
  if (!STATE.study.grades[subjectCode] || !Array.isArray(STATE.study.grades[subjectCode]) || STATE.study.grades[subjectCode].length === 0) {
    STATE.study.grades[subjectCode] = getDefaultGradeComponents(subjectCode);
  }
  if (STATE.study.credits[subjectCode] === undefined) {
    STATE.study.credits[subjectCode] = getSubjectCredits(subjectCode);
  }
}

function selectStudySubject(subjectCode, optScroll) {
  if (!subjectCode) return;
  STATE.study.selectedSubject = subjectCode;
  ensureSubjectGradeInitialized(subjectCode);

  // 1. Sync Global Select
  var globalSel = $('studyGlobalSubjectSelect');
  if (globalSel && globalSel.value !== subjectCode) globalSel.value = subjectCode;

  // 2. Sync Quick Pills
  var pills = document.querySelectorAll('.study-pill-btn');
  pills.forEach(function(btn) {
    var codeEl = btn.querySelector('.sp-code');
    var code = codeEl ? codeEl.textContent.trim() : '';
    btn.classList.toggle('active', code === subjectCode);
  });

  // 3. Sync Timer Select (skip if user deliberately picked OSCE_PRACTICE)
  var timerSel = $('timerSubjectSelect');
  if (timerSel && timerSel.value !== subjectCode && subjectCode !== 'OSCE_PRACTICE') {
    timerSel.value = subjectCode;
  }

  // 4. Sync Grade Select
  var gradeSel = $('gradeSubjectSelect');
  if (gradeSel && gradeSel.value !== subjectCode) {
    gradeSel.value = subjectCode;
  }

  // 5. Sync Credits Input
  var credEl = $('gradeSubjectCredits');
  if (credEl) {
    credEl.value = getSubjectCredits(subjectCode);
  }

  // 6. Render Grade Tracker
  renderGradeTracker();

  // 7. Render Matrix & GPA Overview (to update active row / block and filter)
  renderGpaOverviewTable();

  if (optScroll) {
    var card = $('studyGradesCard');
    if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function onTimerSubjectChange(val) {
  if (val && val !== 'OSCE_PRACTICE') {
    selectStudySubject(val);
  }
}

function onGradeSubjectChange() {
  var sel = $('gradeSubjectSelect');
  if (sel && sel.value) selectStudySubject(sel.value);
}

function selectGradeSubjectFromTable(subjectCode) {
  selectStudySubject(subjectCode, true);
}

function onSubjectCreditsChange(val, optSubjectCode) {
  var subj = optSubjectCode || STATE.study.selectedSubject;
  var num = parseFloat(val);
  STATE.study.credits[subj] = (!isNaN(num) && num >= 0) ? num : 0;
  if (!optSubjectCode || optSubjectCode === STATE.study.selectedSubject) {
    var inp = $('gradeSubjectCredits');
    if (inp && document.activeElement !== inp) inp.value = STATE.study.credits[subj];
  }
  saveStudyDataLocal();
  renderGpaOverviewTable();
}

function ensureSubjectPoolPopulatedFromStudy() {
  if (!STATE.subjectPool || STATE.subjectPool.length === 0) {
    STATE.subjectPool = DEFAULT_STUDY_SUBJECTS.map(function(ds, idx) {
      return {
        id: 'sub_' + ds.code.toLowerCase(),
        subject_code: ds.code,
        subject_name: ds.name,
        room: '',
        color: CONFIG.COLORS[idx % CONFIG.COLORS.length]
      };
    });
  }
}
