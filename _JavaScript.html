function deleteStudySubjectPrompt(optSubjectCode) {
  ensureSubjectPoolPopulatedFromStudy();
  var targetCode = optSubjectCode || STATE.study.selectedSubject;
  var allSubjs = getAllStudySubjects();
  if (allSubjs.length <= 1) {
    showWarning('ต้องมีรายวิชาอย่างน้อย 1 วิชาในระบบ');
    return;
  }
  confirmDialog(
    'ลบรายวิชา ' + targetCode + ' ?',
    'รายวิชานี้และข้อมูลคะแนนของวิชานี้จะถูกลบออกจากระบบและอัปเดตลง Google Sheet',
    'ลบวิชา'
  ).then(function(ok) {
    if (!ok) return;
    STATE.subjectPool = (STATE.subjectPool || []).filter(function(s) {
      return s.subject_code !== targetCode;
    });
    STATE.study.customSubjects = (STATE.study.customSubjects || []).filter(function(cs) {
      return cs.code !== targetCode;
    });
    delete STATE.study.grades[targetCode];
    delete STATE.study.credits[targetCode];
    delete STATE.study.cutoffs[targetCode];

    var remaining = getAllStudySubjects();
    STATE.study.selectedSubject = remaining.length > 0 ? remaining[0].code : 'RAPM201';
    populateStudySubjectDropdowns();
    renderGradeTracker();
    if (STATE.currentModule === 'class') renderClassModule();
    saveStudyDataToServer(true);
  });
}

function normalizeSubjectWeightsTo100() {
  var subj = STATE.study.selectedSubject;
  var items = STATE.study.grades[subj] || [];
  if (items.length === 0) return;
  var sum = items.reduce(function(acc, it) { return acc + (parseFloat(it.weight) || 0); }, 0);
  if (sum <= 0) {
    var eq = +(100 / items.length).toFixed(1);
    items.forEach(function(it) { it.weight = eq; });
  } else {
    var running = 0;
    items.forEach(function(it, idx) {
      if (idx === items.length - 1) {
        it.weight = Math.max(0, +(100 - running).toFixed(1));
      } else {
        var scaled = +(((parseFloat(it.weight) || 0) / sum) * 100).toFixed(1);
        it.weight = scaled;
        running += scaled;
      }
    });
  }
  saveStudyDataLocal();
  renderGradeTracker();
}

function removeGradeComponentRow(idx) {
  var subj = STATE.study.selectedSubject;
  if (!STATE.study.grades[subj]) return;
  STATE.study.grades[subj].splice(idx, 1);
  saveStudyDataLocal();
  renderGradeTracker();
}

function onGradeInputChange(idx, field, val) {
  var subj = STATE.study.selectedSubject;
  var items = STATE.study.grades[subj];
  if (!items || !items[idx]) return;
  if (field === 'name') {
    items[idx].name = val;
  } else {
    items[idx][field] = val === '' ? '' : parseFloat(val);
  }
  saveStudyDataLocal();
  updateRowWeightedBadge(idx);
  updateGradeCalculations();
}

function computeRowWeightedInfo(item) {
  var w = parseFloat(item.weight) || 0;
  var hasEarned = !(item.earned === '' || item.earned === null || item.earned === undefined || isNaN(parseFloat(item.earned)));
  var maxScore = parseFloat(item.max) || 0;
  if (!hasEarned || maxScore <= 0) {
    return { graded: false, weighted: 0, weight: w, text: '— / ' + w + '%' };
  }
  var ratio = Math.max(0, Math.min(1.5, parseFloat(item.earned) / maxScore));
  var weighted = ratio * w;
  return {
    graded: true,
    weighted: weighted,
    weight: w,
    text: weighted.toFixed(2) + ' / ' + w + '%'
  };
}

function updateRowWeightedBadge(idx) {
  var subj = STATE.study.selectedSubject;
  var items = STATE.study.grades[subj] || [];
  var item = items[idx];
  var badge = $('gradeWeightedCol_' + idx);
  if (!item || !badge) return;
  var info = computeRowWeightedInfo(item);
  badge.textContent = info.text;
  badge.classList.toggle('is-graded', info.graded);
}

function onWhatIfChange(val) {
  var num = Math.max(0, Math.min(100, parseFloat(val) || 0));
  STATE.study.whatIfPct = num;
  var sl = $('whatIfSlider');
  var inp = $('whatIfInput');
  if (sl && document.activeElement !== sl) sl.value = num;
  if (inp && document.activeElement !== inp) inp.value = num;
  updateGradeCalculations();
}

function renderGradeTracker() {
  var subj = STATE.study.selectedSubject;
  ensureSubjectGradeInitialized(subj);
  var items = STATE.study.grades[subj] || [];
  var credEl = $('gradeSubjectCredits');
  if (credEl) credEl.value = getSubjectCredits(subj);

  var listEl = $('gradeItemsList');
  if (!listEl) return;

  listEl.innerHTML = items.map(function(item, idx) {
    var earnedVal = (item.earned === '' || item.earned === null || item.earned === undefined || isNaN(item.earned)) ? '' : item.earned;
    var info = computeRowWeightedInfo(item);
    return '<div class="grade-item-row">' +
      '<input type="text" class="form-input grade-input-name" value="' + escapeHtml(item.name || '') + '" placeholder="Component name" oninput="onGradeInputChange(' + idx + ', \'name\', this.value)" />' +
      '<input type="number" step="0.5" min="0" max="100" class="form-input grade-input-num" value="' + escapeHtml(item.weight) + '" placeholder="%" title="Weight (%)" oninput="onGradeInputChange(' + idx + ', \'weight\', this.value)" />' +
      '<input type="number" step="0.5" min="0" class="form-input grade-input-num" value="' + escapeHtml(earnedVal) + '" placeholder="—" title="Earned score" oninput="onGradeInputChange(' + idx + ', \'earned\', this.value)" />' +
      '<input type="number" step="0.5" min="1" class="form-input grade-input-num" value="' + escapeHtml(item.max || 100) + '" placeholder="Max" title="Max full score" oninput="onGradeInputChange(' + idx + ', \'max\', this.value)" />' +
      '<span class="grade-weighted-pill' + (info.graded ? ' is-graded' : '') + '" id="gradeWeightedCol_' + idx + '" title="Weighted score earned">' + escapeHtml(info.text) + '</span>' +
      '<button type="button" class="btn btn-secondary btn-icon btn-sm" onclick="removeGradeComponentRow(' + idx + ')" title="Remove row"><i class="fi fi-rr-trash"></i></button>' +
    '</div>';
  }).join('');

  updateGradeCalculations();
}

function computeSubjectSummary(subjectCode) {
  ensureSubjectGradeInitialized(subjectCode);
  var items = STATE.study.grades[subjectCode] || [];
  var totalWeight = 0;
  var gradedWeight = 0;
  var accumulatedWeightedPct = 0;

  items.forEach(function(item) {
    var w = parseFloat(item.weight) || 0;
    totalWeight += w;
    var hasEarned = !(item.earned === '' || item.earned === null || item.earned === undefined || isNaN(parseFloat(item.earned)));
    var maxScore = parseFloat(item.max) || 0;
    if (hasEarned && maxScore > 0 && w > 0) {
      var ratio = Math.max(0, Math.min(1.5, parseFloat(item.earned) / maxScore));
      gradedWeight += w;
      accumulatedWeightedPct += ratio * w;
    }
  });

  var remainingWeight = Math.max(0, totalWeight - gradedWeight);
  // Normalized current performance (% of graded weight so far)
  var currentPerformancePct = gradedWeight > 0 ? (accumulatedWeightedPct / gradedWeight) * 100 : 0;
  // Projected score if student maintains their current average (or whatIfPct if 0 graded)
  var projectedTotal = gradedWeight > 0
    ? accumulatedWeightedPct + (currentPerformancePct / 100) * remainingWeight
    : 0;
  var cutoffs = getSubjectCutoffs(subjectCode);
  var projectedGrade = gradedWeight > 0 ? scoreToLetterGrade(projectedTotal, cutoffs) : '—';

  return {
    totalWeight: totalWeight,
    gradedWeight: gradedWeight,
    remainingWeight: remainingWeight,
    accumulatedWeightedPct: accumulatedWeightedPct,
    currentPerformancePct: currentPerformancePct,
    projectedTotal: projectedTotal,
    projectedGrade: projectedGrade,
    cutoffs: cutoffs
  };
}

function updateGradeCalculations() {
  var subj = STATE.study.selectedSubject;
  var stats = computeSubjectSummary(subj);

  var accumEl = $('gradeAccumVal');
  var gradedEl = $('gradeGradedWeightVal');
  var remEl = $('gradeRemainingWeightVal');

  if (accumEl) accumEl.textContent = stats.accumulatedWeightedPct.toFixed(2) + '%';
  if (gradedEl) gradedEl.textContent = stats.gradedWeight.toFixed(1).replace(/\.0$/, '') + '% / ' + stats.totalWeight.toFixed(1).replace(/\.0$/, '') + '%';
  if (remEl) remEl.textContent = stats.remainingWeight.toFixed(1).replace(/\.0$/, '') + '%';

  // Weight balance banner
  var bannerEl = $('gradeWeightStatusBanner');
  if (bannerEl) {
    var diff = +(stats.totalWeight - 100).toFixed(1);
    if (Math.abs(diff) < 0.05) {
      bannerEl.className = 'grade-weight-banner ok';
      bannerEl.innerHTML = '<span><i class="fi fi-rr-check-circle"></i> Total Weight = <strong>100%</strong> (Balanced)</span>' +
        (stats.gradedWeight > 0 ? '<span>Current Avg on Graded Items: <strong>' + stats.currentPerformancePct.toFixed(1) + '%</strong></span>' : '');
    } else {
      var msg = diff < 0
        ? 'Total Weight is <strong>' + stats.totalWeight.toFixed(1) + '%</strong> (Missing <strong>' + Math.abs(diff).toFixed(1) + '%</strong> to reach 100%)'
        : 'Total Weight is <strong>' + stats.totalWeight.toFixed(1) + '%</strong> (Exceeds 100% by <strong>' + diff.toFixed(1) + '%</strong>)';
      bannerEl.className = 'grade-weight-banner warn';
      bannerEl.innerHTML = '<span><i class="fi fi-rr-exclamation"></i> ' + msg + '</span>' +
        '<button type="button" class="btn btn-sm btn-secondary" onclick="normalizeSubjectWeightsTo100()"><i class="fi fi-rr-magic-wand"></i> Scale to 100%</button>';
    }
  }

  // What-If Simulator calculation
  var whatIfPct = STATE.study.whatIfPct !== undefined ? STATE.study.whatIfPct : 75;
  var simTotal = stats.accumulatedWeightedPct + ((whatIfPct / 100) * stats.remainingWeight);
  var simGrade = scoreToLetterGrade(simTotal, stats.cutoffs);
  var simPoint = scoreToContinuousPoint(simTotal);
  var simBadge = $('whatIfResultBadge');
  if (simBadge) {
    simBadge.innerHTML = 'Projected Total: <strong>' + simTotal.toFixed(2) + '%</strong> → แต้มประจำ <strong>' + simPoint.toFixed(2) + '</strong> (เกรด <strong>' + simGrade + '</strong>)';
  }

  // Grade Target Cards (Matching Reference Cutoffs: A=87.75, B+=81.25, B=75.00, C+=62.50, C=50.00, D+=37.50, D=25.00)
  var c = stats.cutoffs;
  var targets = [
    { grade: 'A',  cutoff: c['A'],  ptRange: '3.51–4.00', color: '#10b981' },
    { grade: 'B+', cutoff: c['B+'], ptRange: '3.25–3.50', color: '#10b981' },
    { grade: 'B',  cutoff: c['B'],  ptRange: '3.00–3.24', color: '#10b981' },
    { grade: 'C+', cutoff: c['C+'], ptRange: '2.50–2.99', color: '#10b981' },
    { grade: 'C',  cutoff: c['C'],  ptRange: '2.00–2.49', color: '#10b981' },
    { grade: 'D+', cutoff: c['D+'], ptRange: '1.50–1.99', color: '#ef4444' },
    { grade: 'D',  cutoff: c['D'],  ptRange: '1.00–1.49', color: '#ef4444' }
  ];

  var gridEl = $('gradeTargetGrid');
  if (gridEl) {
    gridEl.innerHTML = targets.map(function(t) {
      var neededWeighted = t.cutoff - stats.accumulatedWeightedPct;
      var statusText = '';
      var badgeClass = '';

      if (neededWeighted <= 0) {
        statusText = 'ถึงเกณฑ์แล้ว! (≥ ' + t.cutoff.toFixed(2) + '%)';
        badgeClass = 'secured';
      } else if (stats.remainingWeight <= 0) {
        statusText = 'ไม่ถึงเกณฑ์ (ครบ 100% แล้ว)';
        badgeClass = 'impossible';
      } else {
        var reqPctOnRemaining = (neededWeighted / stats.remainingWeight) * 100;
        if (reqPctOnRemaining > 100) {
          statusText = 'ต้องได้ +' + neededWeighted.toFixed(2) + '% (เกินคะแนนที่เหลือ)';
          badgeClass = 'impossible';
        } else {
          statusText = 'ต้องทำเพิ่ม +' + neededWeighted.toFixed(2) + '% (' + reqPctOnRemaining.toFixed(1) + '% ของที่เหลือ)';
          badgeClass = reqPctOnRemaining >= 85 ? 'challenging' : 'achievable';
        }
      }

      return '<div class="grade-target-card ' + badgeClass + '">' +
        '<div class="gt-grade" style="color:' + t.color + '">' + t.grade + ' <span class="gt-cut">(≥' + t.cutoff.toFixed(2) + '% • แต้ม ' + t.ptRange + ')</span></div>' +
        '<div class="gt-need">' + escapeHtml(statusText) + '</div>' +
      '</div>';
    }).join('');
  }

  renderGpaOverviewTable();
}

function onMatrixCellScoreInput(subjectCode, itemIdx, val) {
  ensureSubjectGradeInitialized(subjectCode);
  var items = STATE.study.grades[subjectCode] || [];
  var it = items[itemIdx];
  if (!it) return;
  it.earned = val === '' ? '' : parseFloat(val);
  // If user is editing the currently selected subject in the matrix, sync the top input too
  if (subjectCode === STATE.study.selectedSubject) {
    renderGradeTracker();
    return;
  }
  saveStudyDataLocal();
  updateGradeCalculations();
}

function renderMatrixFilterPills(allSubjects) {
  var bar = $('matrixFilterPills');
  if (!bar) return;
  var isOnly = !!STATE.study.matrixFilterOnlySelected;
  var selCode = STATE.study.selectedSubject;
  var html = '<button type="button" class="matrix-filter-pill' + (!isOnly ? ' active' : '') + '" onclick="setMatrixFilter(false)">' +
    '<i class="fi fi-rr-apps"></i> แสดงทุกวิชา (' + allSubjects.length + ')' +
  '</button>' +
  '<button type="button" class="matrix-filter-pill' + (isOnly ? ' active' : '') + '" onclick="setMatrixFilter(true)">' +
    '<i class="fi fi-rr-crosshairs"></i> แสดงเฉพาะวิชาที่เลือก (' + escapeHtml(selCode) + ')' +
  '</button>';
  bar.innerHTML = html;
}

function setMatrixFilter(onlySelected) {
  STATE.study.matrixFilterOnlySelected = onlySelected;
  renderScoreMatrixSheet();
}

function renderScoreMatrixSheet() {
  var wrap = $('scoreMatrixContainer');
  if (!wrap) return;
  var allSubjects = getAllStudySubjects();
  var filterOnlySelected = !!STATE.study.matrixFilterOnlySelected;
  var subjects = filterOnlySelected
    ? allSubjects.filter(function(s) { return s.code === STATE.study.selectedSubject; })
    : allSubjects;

  if (subjects.length === 0) subjects = allSubjects;

  renderMatrixFilterPills(allSubjects);

  wrap.innerHTML = subjects.map(function(s) {
    ensureSubjectGradeInitialized(s.code);
    var items = STATE.study.grades[s.code] || [];
    var st = computeSubjectSummary(s.code);
    var currentGrade = scoreToLetterGrade(st.accumulatedWeightedPct, st.cutoffs);
    var isSelected = s.code === STATE.study.selectedSubject;

    var headerCells = items.map(function(it) {
      return '<th>' + escapeHtml(it.name) + '</th>';
    }).join('');

    var weightCells = items.map(function(it) {
      var w = parseFloat(it.weight) || 0;
      var m = parseFloat(it.max) || w;
      var lbl = (m === w) ? (w + '% (' + w + ' คะแนน)') : (w + '% (เต็ม ' + m + ')');
      return '<td class="matrix-weight-cell">' + escapeHtml(lbl) + '</td>';
    }).join('');

    var scoreCells = items.map(function(it, idx) {
      var eVal = (it.earned === '' || it.earned === null || it.earned === undefined || isNaN(it.earned)) ? '' : it.earned;
      var maxVal = parseFloat(it.max) || parseFloat(it.weight) || 100;
      return '<td class="matrix-score-cell">' +
        '<input type="number" step="0.1" min="0" max="' + maxVal + '" class="matrix-score-input" value="' + escapeHtml(eVal) + '" placeholder="—" ' +
          'oninput="onMatrixCellScoreInput(' + arg(s.code) + ', ' + idx + ', this.value)" />' +
      '</td>';
    }).join('');

    var activeBadge = isSelected ? '<span class="matrix-active-badge"><i class="fi fi-rr-check-circle"></i> วิชาที่กำลังเลือกดู</span>' : '';

    return '<div class="matrix-subject-block' + (isSelected ? ' active' : '') + '" id="matrixBlock_' + escapeId(s.code) + '">' +
      '<div class="matrix-scroll">' +
        '<table class="matrix-table">' +
          '<thead>' +
            '<tr>' +
              '<th class="matrix-subj-th" onclick="selectStudySubject(' + arg(s.code) + ', true)" title="คลิกเพื่อเลือกวิชานี้">' +
                '<span class="matrix-tag">รายวิชา</span> ' + escapeHtml(s.code + ': ' + s.name) + activeBadge +
                ' <button type="button" class="btn btn-secondary btn-icon btn-sm" style="margin-left:6px;width:24px;height:24px;display:inline-flex;vertical-align:middle;" onclick="event.stopPropagation();editStudySubjectPrompt(' + arg(s.code) + ')" title="แก้ไขชื่อ/รหัสวิชา"><i class="fi fi-rr-edit" style="font-size:11px;"></i></button>' +
              '</th>' +
              headerCells +
              '<th class="matrix-total-th">คะแนนรวมสุทธิ (100%)</th>' +
              '<th class="matrix-grade-th">เกรด</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            '<tr>' +
              '<td class="matrix-row-label">สัดส่วนน้ำหนักคะแนน</td>' +
              weightCells +
              '<td class="matrix-total-weight">' + st.totalWeight.toFixed(0) + '%</td>' +
              '<td class="matrix-grade-cell" rowspan="2">' +
                '<span class="matrix-grade-badge ' + (isPassingGradeLetter(currentGrade) ? 'grade-pass' : 'grade-f') + '">' + escapeHtml(currentGrade) + '</span>' +
                (st.gradedWeight > 0 && st.remainingWeight > 0 ? '<div class="matrix-proj-hint" title="เกรดแนวโน้มหากรักษาค่าเฉลี่ยเดิม">แนวโน้ม: ' + escapeHtml(st.projectedGrade) + '</div>' : '') +
              '</td>' +
            '</tr>' +
            '<tr>' +
              '<td class="matrix-row-label">คะแนนที่ได้</td>' +
              scoreCells +
              '<td class="matrix-total-score">' + st.accumulatedWeightedPct.toFixed(1).replace(/\.0$/, '') + '</td>' +
            '</tr>' +
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
  }).join('');
}

function renderGpaOverviewTable() {
  renderScoreMatrixSheet();
  var tbody = $('gpaOverviewTableBody');
  if (!tbody) return;

  var subjects = getAllStudySubjects();
  var totalCredits = 0;
  var gradedCredits = 0;
  var weightedGradePointsSum = 0;
  var weightedScoreSum = 0;

  var rowsHtml = subjects.map(function(s) {
    var cred = getSubjectCredits(s.code);
    var st = computeSubjectSummary(s.code);
    var isSelected = s.code === STATE.study.selectedSubject;

    totalCredits += cred;
    var hasScores = st.gradedWeight > 0;
    var currentLetter = scoreToLetterGrade(st.accumulatedWeightedPct, st.cutoffs);
    var projLetter = hasScores ? st.projectedGrade : '—';
    var gp = (hasScores && GRADE_POINTS_MAP[projLetter] !== undefined) ? GRADE_POINTS_MAP[projLetter] : null;

    if (hasScores && cred > 0 && gp !== null) {
      gradedCredits += cred;
      weightedGradePointsSum += gp * cred;
      weightedScoreSum += st.projectedTotal * cred;
    }

    var passCut = st.cutoffs['C'] !== undefined ? st.cutoffs['C'] : 50;
    var needForPass = Math.max(0, passCut - st.accumulatedWeightedPct);
    var passText = needForPass <= 0
      ? 'ผ่านเกณฑ์ C (≥' + passCut.toFixed(2) + '%) แล้ว!'
      : 'ต้องการอีก +' + needForPass.toFixed(2) + '% (จาก ' + st.remainingWeight.toFixed(0) + '% ที่เหลือ)';

    var curPoint = scoreToContinuousPoint(st.accumulatedWeightedPct);

    return '<tr class="gpa-row' + (isSelected ? ' active' : '') + '" onclick="selectGradeSubjectFromTable(' + arg(s.code) + ')">' +
      '<td><div class="gpa-subj-code" style="display:flex;align-items:center;gap:6px;">' + escapeHtml(s.code) +
        '<button type="button" class="btn btn-secondary btn-icon btn-sm" style="width:22px;height:22px;" onclick="event.stopPropagation();editStudySubjectPrompt(' + arg(s.code) + ')" title="แก้ไขรายวิชา"><i class="fi fi-rr-edit" style="font-size:10px;"></i></button>' +
      '</div><div class="gpa-subj-name">' + escapeHtml(s.name) + '</div></td>' +
      '<td onclick="event.stopPropagation();"><input type="number" step="0.5" min="0" max="12" class="form-input gpa-cred-input" value="' + escapeHtml(cred) + '" oninput="onSubjectCreditsChange(this.value, ' + arg(s.code) + ')" /></td>' +
      '<td>' + st.gradedWeight.toFixed(0) + '% / ' + st.totalWeight.toFixed(0) + '%</td>' +
      '<td><strong style="font-size:15px;">' + st.accumulatedWeightedPct.toFixed(2).replace(/\.00$/, '') + '%</strong></td>' +
      '<td><span class="gpa-grade-pill ' + (isPassingGradeLetter(currentLetter) ? 'has-grade' : 'is-fail') + '">' + escapeHtml(currentLetter) + ' (' + curPoint.toFixed(2) + ')</span></td>' +
      '<td><span class="gpa-grade-pill ' + (hasScores && isPassingGradeLetter(projLetter) ? 'has-grade' : (hasScores ? 'is-fail' : '')) + '">' + escapeHtml(projLetter) + (gp !== null ? ' (' + gp.toFixed(2) + ')' : '') + '</span></td>' +
      '<td style="font-size:12px;color:var(--text-secondary);">' + escapeHtml(passText) + '</td>' +
    '</tr>';
  }).join('');

  tbody.innerHTML = rowsHtml;

  var totCredEl = $('gpaTotalCreditsVal');
  var avgScoreEl = $('gpaAvgScoreVal');
  var estGpaEl = $('gpaEstVal');

  if (totCredEl) totCredEl.textContent = totalCredits.toFixed(1).replace(/\.0$/, '');
  if (avgScoreEl) avgScoreEl.textContent = gradedCredits > 0 ? (weightedScoreSum / gradedCredits).toFixed(1) + '%' : '—';
  if (estGpaEl) estGpaEl.textContent = gradedCredits > 0 ? (weightedGradePointsSum / gradedCredits).toFixed(2) : '0.00';
}
</script>
