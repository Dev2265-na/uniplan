// _JavaScript.html — UniPlan frontend (Vanilla JS)
//   Sections: 0 Core  ·  1 Tasks  ·  2 Duty  ·  3 Classes
// ============================================================

// ── CONFIG ────────────────────────────────────────────────
var CONFIG = {
  GRID_START: 8,   // first visible hour in the class timetable
  GRID_END:   16,  // last visible hour (exclusive end)
  CLASS_DAYS: [
    { key: 'monday',    label: 'Mon' },
    { key: 'tuesday',   label: 'Tue' },
    { key: 'wednesday', label: 'Wed' },
    { key: 'thursday',  label: 'Thu' },
    { key: 'friday',    label: 'Fri' },
    { key: 'saturday',  label: 'Sat' },
    { key: 'sunday',    label: 'Sun' }
  ],
  DAYS: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
  DAY_KEYS: ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'],
  DUTY_DAYS: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
  DUTY_DEFAULT_SLOTS: [

var STATE = {
  currentModule: 'task',

  // Tasks
  currentDate: new Date(),
  viewMode: 'list',          // list | day | week | month
  tasks: [],
  tasksKey: null,            // cache key of the loaded range
  taskReq: 0,                // request counter (ignore stale responses)
  statsLoaded: false,
  sortedByPriority: false,
  dayModalDate: null,        // ISO date shown in the day modal

  // Duty
  duty: {
    loaded: false, editMode: false, dirty: false, saving: false,
    slots: [], members: [],
    allAssignments: [],
    assignments: [],

    selected: null           // { type: 'member'|'assign', id }
  },

document.addEventListener('DOMContentLoaded', function() {
  initApp();
});

function initApp() {
  loadUserEmail();
  initTheme();
  initSidebar();
  initOverviewHub();
  initSpreadsheetUrl();
  initDateTimeSync();
  initGlobalHandlers();
  initPullToRefresh();
  initDutyEvents();
  initClassEvents();
  setDatePickerToday();
  requestNotificationPermission();

function refreshAppOnDevice() {
  var btn = $('topbarRefreshBtn');
  if (btn) btn.classList.add('is-spinning');

  // 1. Check if a newer frontend bundle is deployed on Vercel/GitHub (fixes iPad Home Screen / Safari cache)
  if (!STATE.duty.dirty && !STATE.classDirty && typeof window !== 'undefined' && window.location && window.location.protocol.indexOf('http') === 0 && typeof google === 'undefined') {
    fetch(window.location.pathname + '?_t=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.text() : null; })
      .then(function(latestHtml) {
        if (latestHtml && latestHtml.indexOf('refreshAppOnDevice') !== -1) {
          // Compare script length to detect if a new deployment occurred
          var curLen = document.documentElement.innerHTML.length;
          if (Math.abs(latestHtml.length - curLen) > 150) {
            window.location.replace(window.location.pathname + '?_v=' + Date.now());
          }
        }
      })
      .catch(function() {});
  }

  // 2. Force-reload all live data from Google Calendar & Google Sheets
  invalidateTaskCache();
  STATE.duty.loaded = false;
  STATE.classesLoaded = false;
  STATE.study.loaded = false;

  initOverviewHub(true);
  syncStudyWithGoogleSheet(false);

  if (STATE.currentModule === 'task') loadTaskModule(true);
  else if (STATE.currentModule === 'duty') loadDutyModule(true);
  else if (STATE.currentModule === 'class') loadClassModule(true);
  else if (STATE.currentModule === 'study') loadStudyModule();

  setTimeout(function() {
    if (btn) btn.classList.remove('is-spinning');
    showSuccess('รีเฟรชข้อมูลล่าสุดเรียบร้อย!');
  }, 900);
}

function initPullToRefresh() {
  var startY = 0;
  var startX = 0;
  var pulling = false;
  var readyToRefresh = false;

  document.addEventListener('touchstart', function(e) {
    if (!e.touches || e.touches.length !== 1) return;
    if ((window.scrollY || document.documentElement.scrollTop || 0) > 2) return;
    if (STATE.drag || STATE.dragTask) return;
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    pulling = true;
    readyToRefresh = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!pulling || !e.touches || e.touches.length !== 1) return;
    if ((window.scrollY || document.documentElement.scrollTop || 0) > 2) {
      pulling = false;
      return;
    }
    var dy = e.touches[0].clientY - startY;
    var dx = e.touches[0].clientX - startX;
    var ind = $('pullRefreshIndicator');
    var txt = $('pullRefreshText');
    if (dy > 35 && Math.abs(dy) > Math.abs(dx) * 1.5) {
      if (ind) ind.classList.remove('hidden');
      if (dy > 90) {
        readyToRefresh = true;
        if (ind) ind.classList.add('ready');
        if (txt) txt.textContent = 'ปล่อยนิ้วเพื่อรีเฟรชทันที (Release to refresh)!';
      } else {
        readyToRefresh = false;
        if (ind) ind.classList.remove('ready');
        if (txt) txt.textContent = 'ดึงลงเพื่อรีเฟรชข้อมูล (Pull down to refresh)...';
      }
    }
  }, { passive: true });

  function endPull() {
    if (!pulling) return;
    pulling = false;
    var ind = $('pullRefreshIndicator');
    if (ind) {
      ind.classList.add('hidden');
      ind.classList.remove('ready');
    }
    if (readyToRefresh) {
      readyToRefresh = false;
      refreshAppOnDevice();
    }
  }

  document.addEventListener('touchend', endPull, { passive: true });
  document.addEventListener('touchcancel', endPull, { passive: true });
}

function loadUserEmail() {
  runServer('getCurrentUser', [], function(email) {
    var el = document.getElementById('userEmail');
    if (el && email) el.textContent = email;
    var av = document.getElementById('userAvatar');
    if (av && email) av.textContent = email.charAt(0).toUpperCase();
  }, function() {});
}

function initSpreadsheetUrl() {
  runServer('getSpreadsheetUrl', [], function(res) {
    if (res && res.success && res.url) {
      var dBtn = document.getElementById('dutyOpenSheetBtn');
      if (dBtn) dBtn.href = res.url;
      var cBtn = document.getElementById('classOpenSheetBtn');
      if (cBtn) cBtn.href = res.url;
      var sBtn = document.getElementById('studyOpenSheetBtn');
      if (sBtn) sBtn.href = res.url;
    }
  }, function() {});
}

function seedSampleDataPrompt() {
  confirmDialog(
    'Load sample template?',
    'This will populate your Google Sheet with sample subjects, classes, duty slots, and rota assignments.',
    'Load sample data'
  ).then(function(confirmed) {
    if (!confirmed) return;
    showLoading();
    runServer('seedSampleData', [true], function(res) {
      hideLoading();
      if (!isOk(res)) return;
      showSuccess('Sample data created in Google Sheet!');
      if (res.url) {
        var dBtn = document.getElementById('dutyOpenSheetBtn');
        if (dBtn) dBtn.href = res.url;
        var cBtn = document.getElementById('classOpenSheetBtn');
        if (cBtn) cBtn.href = res.url;
        var sBtn = document.getElementById('studyOpenSheetBtn');
        if (sBtn) sBtn.href = res.url;
      }
      STATE.duty.loaded = false;
      STATE.classesLoaded = false;
      initOverviewHub(true);
      if (STATE.currentModule === 'duty') loadDutyModule(true);
      if (STATE.currentModule === 'class') loadClassModule(true);
      if (STATE.currentModule === 'study') syncStudyWithGoogleSheet(false);
    }, function(e) { hideLoading(); handleError(e); });
  });
}

// Google Apps Script Backend URL (used when hosted on Vercel / outside GAS iframe)
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw2lkjIzii6tYC-G_5q-4fbsN9dr3vG8SEcygSveb3N2n9tq7LV40_-vLdQM2kk6ATIgw/exec';

/**
 * Call a server function (google.script.run or fetch REST API on Vercel) with unified error handling.
 * onOk receives the raw server response.
 */
function runServer(name, args, onOk, onFail) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    var runner = google.script.run
      .withSuccessHandler(function(res) {
        try { if (onOk) onOk(res); }
        catch (err) { console.error(err); hideLoading(); showError(err.message); }
      })
      .withFailureHandler(function(err) {
        if (onFail) onFail(err); else handleError(err);
      });
    runner[name].apply(runner, args || []);
    return;
  }

  // External host (Vercel / GitHub Pages / localhost)
  var payloadStr = JSON.stringify({ action: name, args: args || [] });

  function callDirectGas() {
    // IMPORTANT: credentials: 'omit' prevents the browser from sending multi-account
    // Google cookies to script.google.com, which otherwise triggers a non-CORS redirect
    // to accounts.google.com and causes "TypeError: Failed to fetch".
    var argsJson = JSON.stringify(args || []);
    if (argsJson.length < 1200) {
      var getUrl = GAS_API_URL + '?action=' + encodeURIComponent(name) + '&args=' + encodeURIComponent(argsJson) + '&_t=' + Date.now();
      return fetch(getUrl, {
        method: 'GET',
        mode: 'cors',
        credentials: 'omit',
        redirect: 'follow'
      }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }
    return fetch(GAS_API_URL, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      body: payloadStr,
      redirect: 'follow'
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  var useVercelProxy = (typeof window !== 'undefined' && window.location && window.location.hostname.indexOf('github.io') === -1 && window.location.protocol.indexOf('http') === 0);

  var reqPromise = useVercelProxy
    ? fetch('/api/gas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payloadStr
      }).then(function(r) {
        if (!r.ok) return callDirectGas();
        return r.json();
      }).catch(function() {
        return callDirectGas();
      })
    : callDirectGas();

  reqPromise
    .then(function(res) {
      try { if (onOk) onOk(res); }
      catch (err) { console.error(err); hideLoading(); showError(err.message); }
    })
    .catch(function(err) {
      if (onFail) onFail(err); else handleError(err);
    });
}

/** Validate a {success, error} server response; shows an error dialog when it failed */
function isOk(res) {
  if (res && res.success) return true;
  hideLoading();
  showError(res && res.error ? res.error : 'Unexpected server response');
  return false;
}

// ── Escaping helpers ──────────────────────────────────────
function $(id) { return document.getElementById(id); }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/** Safe argument for inline handlers: onclick="fn(<arg>)" */
function arg(value) { return escapeHtml(JSON.stringify(String(value))); }

function escapeId(str) {
  if (!str) return '';
  return String(str).replace(/[^a-zA-Z0-9_-]/g,'_');
}

// ── Dialogs ───────────────────────────────────────────────
function showError(msg) {
  Swal.fire({ icon: 'error', title: 'Something went wrong', text: msg || 'Please try again.' });
}
function showWarning(msg, text) {
  Swal.fire({ icon: 'warning', title: msg, text: text || '', timer: text ? 3500 : 2200, showConfirmButton: false });
}
function showSuccess(msg) {
  Swal.fire({ icon: 'success', title: msg, timer: 1400, showConfirmButton: false });
}
function handleError(e) {
  hideLoading();
  showError(e ? (e.message || String(e)) : 'Unknown error');
}
/** Resolves to true when the user confirms */
function confirmDialog(title, text, confirmText) {
  return Swal.fire({
    title: title, text: text || '', icon: 'warning',
    showCancelButton: true, confirmButtonText: confirmText || 'Confirm',
    cancelButtonText: 'Cancel', confirmButtonColor: '#ef4444'
  }).then(function(r) { return r.isConfirmed; });
}

// ── Loading overlay ───────────────────────────────────────
var _loadingTimer = null;
function showLoading() {
  var el = $('loadingOverlay');
  if (el) el.classList.remove('hidden');
  // Safety: auto-hide after 15s to prevent a stuck overlay
  clearTimeout(_loadingTimer);
  _loadingTimer = setTimeout(hideLoading, 15000);
}
function hideLoading() {
  clearTimeout(_loadingTimer);
  var el = $('loadingOverlay');
  if (el) el.classList.add('hidden');
}
function skeletonHtml(count) {
  var h = '';
  for (var i = 0; i < (count || 3); i++) h += '<div class="inline-skeleton"></div>';
  return h;
}

// ── Date / time helpers ───────────────────────────────────
function pad2(n) { return n < 10 ? '0' + n : String(n); }

function formatDateISO(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parseDateISO(s) {
  var p = String(s).split('-');
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
}
function startOfDay(d) { var n = new Date(d); n.setHours(0, 0, 0, 0); return n; }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
function daysBetween(a, b) {
  return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) -
                     Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
}
function formatDateLong(d) {
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function formatDateShort(d) {
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function formatTimeHHMM(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function getWeekStart(d) {
  var day = d.getDay(); // 0 = Sun
  var diff = (day === 0) ? -6 : 1 - day; // week starts on Monday
  return startOfDay(addDays(d, diff));
}

/** "HH:MM" (or ISO / Date text) → decimal hours */
function parseTimeToDecimal(timeStr) {
  if (!timeStr) return 0;
  if (typeof timeStr !== 'string') timeStr = String(timeStr);
  if (timeStr.indexOf('T') !== -1) {
    var d = new Date(timeStr);
    if (!isNaN(d.getTime())) return d.getHours() + (d.getMinutes() / 60);
  }
  var parts = timeStr.split(':');
  return (parseInt(parts[0], 10) || 0) + ((parseInt(parts[1], 10) || 0) / 60);
}
function decimalToTime(decimal) {
  var h = Math.floor(decimal);
  var m = Math.round((decimal - h) * 60);
  if (m === 60) { h++; m = 0; }
  return pad2(h) + ':' + pad2(m);
}
function timeToMin(hhmm) { return Math.round(parseTimeToDecimal(hhmm) * 60); }

// ── Theme ─────────────────────────────────────────────────
function initTheme() {
  var saved = localStorage.getItem('calendar_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
}
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  var next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('calendar_theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(theme) {
  var btn = $('themeToggleBtn');
  if (btn) btn.innerHTML = theme === 'dark' ? '<i class="fi fi-rr-sun"></i>' : '<i class="fi fi-rr-moon"></i>';
}

// ── Notifications ─────────────────────────────────────────
function requestNotificationPermission() {
  try {
    if ('Notification' in window &&
        Notification.permission !== 'granted' && Notification.permission !== 'denied') {
      Notification.requestPermission().catch(function() {});
    }
  } catch (e) {
    console.warn('Notifications blocked in iframe:', e);
  }
}
function sendNotification(title, body) {
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body: body });
    }
  } catch (e) {}
}

// ── Sidebar ───────────────────────────────────────────────
function initSidebar() {
  var collapsed = localStorage.getItem('sidebar_collapsed') === 'true';
  if (collapsed && window.innerWidth > 900) {
    $('sidebar').classList.add('collapsed');
    $('mainContent').classList.add('sidebar-collapsed');
  }
}
function toggleSidebar() {
  var sidebar = $('sidebar');
  var main = $('mainContent');
  if (window.innerWidth > 900) {
    sidebar.classList.toggle('collapsed');
    main.classList.toggle('sidebar-collapsed');
    localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
  }
}

// ── Overview Hub: Today at a Glance & Exam Countdown ──────
function initOverviewHub(forceFetch) {
  var hub = $('overviewHub');
  var btn = $('overviewToggleBtn');
  if (hub) {
    var collapsed = localStorage.getItem('overview_collapsed') === 'true';
    hub.classList.toggle('collapsed', collapsed);
    if (btn) {
      btn.innerHTML = collapsed ? '<i class="fi fi-rr-angle-small-down"></i>' : '<i class="fi fi-rr-angle-small-up"></i>';
    }
  }
  renderOverviewHub();

  // Background prefetch of Classes & Duty so Today at a glance is always populated
  if (!STATE.classesLoaded || forceFetch) {
    runServer('getAllClasses', [], function(res) {
      if (res && res.success) {
        STATE.allClasses = mergeLocalClassMaterials(res.data || []);
        var currentWeekKey = formatDateISO(STATE.classWeekStart);
        STATE.classes = STATE.allClasses.filter(function(c) {
          return c.week_start === currentWeekKey || (!c.week_start && currentWeekKey === formatDateISO(getWeekStart(new Date())));
        });
        renderOverviewHub();
      }
    }, function() {});
    runServer('getSubjectPool', [], function(res) {
      if (res && res.success) {
        ingestSubjectPoolResponse(res.data || []);
        STATE.classesLoaded = true;
      }
    }, function() {});
  }

  if (!STATE.duty.loaded || forceFetch) {
    runServer('getDutyData', [], function(res) {
      if (res && res.success && res.data) {
        var data = res.data;
        STATE.duty.slots = (data.slots && data.slots.length) ? data.slots : CONFIG.DUTY_DEFAULT_SLOTS.map(function(s) { return { start: s.start, end: s.end }; });
        sortSlots(STATE.duty.slots);
        STATE.duty.members = data.members || [];
        STATE.duty.allAssignments = (data.assignments || []).map(function(a) {
          return { id: newDutyId(), week_start: a.week_start || '', day: a.day, start: a.start, end: a.end, duty_name: a.duty_name || '', person: a.person, notes: a.notes || '' };
        });
        var currentWeekKey = formatDateISO(STATE.duty.weekStart);
        STATE.duty.assignments = STATE.duty.allAssignments.filter(function(a) {
          return a.week_start === currentWeekKey || (!a.week_start && currentWeekKey === formatDateISO(getWeekStart(new Date())));
        });
        STATE.duty.loaded = true;
        renderOverviewHub();
      }
    }, function() {});
  }
}

function toggleOverviewHub() {
  var hub = $('overviewHub');
  var btn = $('overviewToggleBtn');
  if (!hub) return;
  var collapsed = hub.classList.toggle('collapsed');
  localStorage.setItem('overview_collapsed', collapsed ? 'true' : 'false');
  if (btn) {
    btn.innerHTML = collapsed ? '<i class="fi fi-rr-angle-small-down"></i>' : '<i class="fi fi-rr-angle-small-up"></i>';
  }
}

function getEffectiveAllClasses() {
  var activeWeekKey = formatDateISO(STATE.classWeekStart);
  var list = (STATE.allClasses || []).filter(function(c) {
    return c.week_start !== activeWeekKey;
  });
  (STATE.classes || []).forEach(function(c) {
    list.push({
      id: c.id,
      subject_code: c.subject_code,
      subject_name: c.subject_name,
      week_start: c.week_start || activeWeekKey,
      day: c.day,
      start_time: c.start_time,
      end_time: c.end_time,
      room: c.room,
      color: c.color,
      slide_url: c.slide_url || '',
      meeting_url: c.meeting_url || '',
      session_notes: c.session_notes || ''
    });
  });
  return list;
}

function getEffectiveAllDuty() {
  var activeWeekKey = formatDateISO(STATE.duty.weekStart);
  var list = (STATE.duty.allAssignments || []).filter(function(a) {
    return a.week_start !== activeWeekKey;
  });
  (STATE.duty.assignments || []).forEach(function(a) {
    list.push({
      id: a.id,
      week_start: a.week_start || activeWeekKey,
      day: a.day,
      start: a.start,
      end: a.end,
      duty_name: a.duty_name,
      person: a.person,
      notes: a.notes
    });
  });
  return list;
}

function jumpToExamWeek(weekStartStr) {
  switchModule('class');
  if (weekStartStr && /^\d{4}-\d{2}-\d{2}$/.test(weekStartStr)) {
    switchClassWeek(parseDateISO(weekStartStr));
  }
}

function renderOverviewHub() {
  var now = new Date();
  var todayISO = formatDateISO(now);
  var todayWeekKey = formatDateISO(getWeekStart(now));
  var todayDayIdx = (now.getDay() + 6) % 7; // Mon=0..Sun=6
  var todayClassDay = CONFIG.DAY_KEYS[todayDayIdx];
  var todayDutyDay = CONFIG.DUTY_DAYS[todayDayIdx];

  var dateEl = $('overviewTodayDate');
  if (dateEl) dateEl.textContent = formatDateLong(now);

  // 1. Today's Classes
  var allCls = getEffectiveAllClasses();
  var todayClasses = allCls.filter(function(c) {
    var wk = c.week_start || todayWeekKey;
    return wk === todayWeekKey && c.day === todayClassDay;
  }).sort(function(a, b) {
    return timeToMin(a.start_time) - timeToMin(b.start_time);
  });

  var clsCountEl = $('glanceClassCount');
  var clsListEl = $('glanceClassList');
  if (clsCountEl) clsCountEl.textContent = todayClasses.length;
  if (clsListEl) {
    if (todayClasses.length === 0) {
      clsListEl.innerHTML = '<div class="glance-empty">No classes scheduled today</div>';
    } else {
      clsListEl.innerHTML = todayClasses.map(function(c) {
        var badges = '';
        if (c.slide_url) {
          badges += '<a class="glance-link-badge" href="' + escapeHtml(c.slide_url) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" title="Open Slides"><i class="fi fi-rr-file-pdf"></i></a>';
        }
        if (c.meeting_url) {
          badges += '<a class="glance-link-badge" href="' + escapeHtml(c.meeting_url) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" title="Join Online"><i class="fi fi-rr-video-camera-alt"></i></a>';
        }
        return '<div class="glance-item" style="border-left-color:' + escapeHtml(c.color || '#6366f1') + '">' +
          '<span class="glance-time">' + escapeHtml(c.start_time) + '–' + escapeHtml(c.end_time) + '</span>' +
          '<span class="glance-main" title="' + escapeHtml(c.subject_code + ' ' + c.subject_name + (c.session_notes ? ' • ' + c.session_notes : '')) + '">' +
            escapeHtml(c.subject_code) + (c.subject_name ? ' • ' + escapeHtml(c.subject_name) : '') +
          '</span>' +
          badges +
          (c.room ? '<span class="glance-tag">' + escapeHtml(c.room) + '</span>' : '') +
        '</div>';
      }).join('');
    }
  }

  // 2. Today's Duty
  var allDuty = getEffectiveAllDuty();
  var todayDuties = allDuty.filter(function(a) {
    var wk = a.week_start || todayWeekKey;
    return wk === todayWeekKey && a.day === todayDutyDay;
  }).sort(function(a, b) {
    return timeToMin(a.start) - timeToMin(b.start);
  });

  var dutyCountEl = $('glanceDutyCount');
  var dutyListEl = $('glanceDutyList');
  if (dutyCountEl) dutyCountEl.textContent = todayDuties.length;
  if (dutyListEl) {
    if (todayDuties.length === 0) {
      dutyListEl.innerHTML = '<div class="glance-empty">No duty shifts today</div>';
    } else {
      dutyListEl.innerHTML = todayDuties.map(function(a) {
        var col = memberColor(a.person);
        return '<div class="glance-item" style="border-left-color:' + escapeHtml(col) + '">' +
          '<span class="glance-time">' + escapeHtml(a.start) + '–' + escapeHtml(a.end) + '</span>' +
          '<span class="glance-main">' + escapeHtml(a.person) + (a.duty_name ? ' • ' + escapeHtml(a.duty_name) : '') + '</span>' +
          (a.notes ? '<span class="glance-tag">' + escapeHtml(a.notes) + '</span>' : '') +
        '</div>';
      }).join('');
    }
  }

  // 3. Today's Tasks (with fallback to upcoming/active tasks if none today)
  var activeTasks = (STATE.tasks || []).filter(function(t) {
    return t.priority !== 'holiday' && !t.isDone;
  });
  var todayTasks = activeTasks.filter(function(t) {
    var s = formatDateISO(new Date(t.startTime));
    var e = formatDateISO(new Date(t.endTime));
    return s <= todayISO && e >= todayISO;
  });

  var displayTasks = todayTasks.length > 0 ? todayTasks : activeTasks;
  var showingUpcomingFallback = todayTasks.length === 0 && activeTasks.length > 0;

  var taskCountEl = $('glanceTaskCount');
  var taskListEl = $('glanceTaskList');
  if (taskCountEl) taskCountEl.textContent = displayTasks.length;
  if (taskListEl) {
    if (displayTasks.length === 0) {
      taskListEl.innerHTML = '<div class="glance-empty">No active tasks for today</div>';
    } else {
      taskListEl.innerHTML = displayTasks.slice(0, 4).map(function(t) {
        var pColor = { urgent: '#ef4444', high: '#f59e0b', normal: '#06b6d4', low: '#10b981' }[t.priority] || '#6366f1';
        var startD = new Date(t.startTime);
        var timeTxt = showingUpcomingFallback
          ? formatDateShort(startD)
          : (t.allDay ? 'All day' : formatTimeHHMM(startD));
        return '<div class="glance-item" style="border-left-color:' + pColor + '">' +
          '<span class="glance-time">' + escapeHtml(timeTxt) + '</span>' +
          '<span class="glance-main">' + escapeHtml(t.title) + '</span>' +
          '<span class="glance-tag">' + escapeHtml((t.priority || 'normal').toUpperCase()) + '</span>' +
        '</div>';
      }).join('');
    }
  }

  // 4. Exam & OSCE Countdown Strip
  var stripEl = $('examCountdownStrip');
  if (stripEl) {
    var examRegex = /สอบ|OSCE|SAQ|Quiz|Exam|Final|Midterm/i;
    var exams = [];

    allCls.forEach(function(c) {
      var text = (c.subject_code || '') + ' ' + (c.subject_name || '');
      if (!examRegex.test(text)) return;
      var wk = c.week_start;
      if (!wk || !/^\d{4}-\d{2}-\d{2}$/.test(wk)) return;
      var dIdx = CONFIG.DAY_KEYS.indexOf(c.day);
      if (dIdx === -1) dIdx = 0;
      var examDate = addDays(parseDateISO(wk), dIdx);
      var diffDays = daysBetween(startOfDay(now), startOfDay(examDate));
      if (diffDays < 0) return;
      exams.push({
        label: (c.subject_code ? c.subject_code + ': ' : '') + (c.subject_name || 'Exam'),
        date: examDate,
        dateISO: formatDateISO(examDate),
        weekStart: wk,
        daysLeft: diffDays
      });
    });

    exams.sort(function(a, b) {
      return a.daysLeft - b.daysLeft || a.label.localeCompare(b.label);
    });

    if (exams.length === 0) {
      stripEl.innerHTML = '';
    } else {
      stripEl.innerHTML = exams.slice(0, 4).map(function(ex) {
        var soon = ex.daysLeft <= 7;
        var dayBadge = ex.daysLeft === 0 ? 'Today!' : (ex.daysLeft === 1 ? 'Tomorrow' : ('in ' + ex.daysLeft + 'd'));
        var dateStr = formatDateShort(ex.date);
        return '<span class="countdown-pill' + (soon ? ' soon' : '') + '" ' +
          'onclick="jumpToExamWeek(' + arg(ex.weekStart) + ')" ' +
          'title="' + escapeHtml(ex.label + ' • ' + dateStr + ' (Click to view in timetable)') + '">' +
          '<i class="fi fi-rr-hourglass-end"></i>' +
          '<span>' + escapeHtml(ex.label) + '</span>' +
          '<span class="cd-days">' + escapeHtml(dayBadge) + '</span>' +
        '</span>';
      }).join('');
    }
  }
}

// ── Module switching ──────────────────────────────────────
function switchModule(mod) {
  STATE.currentModule = mod;
  ['task', 'duty', 'class', 'study'].forEach(function(m) {
    var cap = m.charAt(0).toUpperCase() + m.slice(1);
    var modEl = $('module' + cap);
    var navEl = $('nav' + cap);
    if (modEl) modEl.classList.toggle('hidden', mod !== m);
    if (navEl) navEl.classList.toggle('active', mod === m);
  });

  var titles = { task: 'Tasks', duty: 'Duty', 'class': 'Classes', study: 'Study Hub' };
  $('topbarTitle').textContent = titles[mod] || '';

  clearSelections();
  refreshSyncIndicator();

  if (mod === 'task') loadTaskModule();
  else if (mod === 'duty') loadDutyModule();
  else if (mod === 'class') loadClassModule();
  else if (mod === 'study') loadStudyModule();
}

// ── Save status (Duty + Classes) ──────────────────────────
function refreshSyncIndicator(forceState, forceText) {
  var ind = $('syncIndicator');
  if (!ind) return;
  var mod = STATE.currentModule;
  if (mod === 'task' || mod === 'study') { ind.style.display = 'none'; return; }
  ind.style.display = 'flex';

  var dirty = mod === 'duty' ? STATE.duty.dirty : STATE.classDirty;
  var saving = mod === 'duty' ? STATE.duty.saving : STATE.classSaving;
  var state = forceState || (saving ? 'syncing' : (dirty ? 'dirty' : 'saved'));
  var text = forceText || (saving ? 'Saving...' : (dirty ? 'Unsaved changes' : 'All changes saved'));

  $('syncDot').className = 'sync-dot ' + state;
  $('syncText').textContent = text;

  var dutyNote = $('dutyDirtyNote'), classNote = $('classDirtyNote');
  if (dutyNote) dutyNote.classList.toggle('hidden', !STATE.duty.dirty);
  if (classNote) classNote.classList.toggle('hidden', !STATE.classDirty);
}

function setDutyDirty(v) { STATE.duty.dirty = v; refreshSyncIndicator(); }
function setClassDirty(v) { STATE.classDirty = v; refreshSyncIndicator(); }

// ── Global handlers (modals, ESC, unsaved changes) ────────
function initGlobalHandlers() {
  document.addEventListener('click', function(e) {
    if (e.target.id === 'taskModal')       closeTaskModal();
    if (e.target.id === 'subjectModal')    closeSubjectModal();
    if (e.target.id === 'dutyModal')       closeDutyModal();
    if (e.target.id === 'classBlockModal') closeClassBlockModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeTaskModal(); closeSubjectModal(); closeDutyModal(); closeClassBlockModal(); closeDayTasksModal();
      clearSelections();
    }
  });

  window.addEventListener('beforeunload', function(e) {
    if (STATE.duty.dirty || STATE.classDirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

// ── Tap-to-select hint ────────────────────────────────────
function showHint(msg) {
  var hint = $('touchHint');
  if (!hint) {
    hint = document.createElement('div');
    hint.id = 'touchHint';
    hint.className = 'touch-hint';
    document.body.appendChild(hint);
  }
  hint.textContent = msg;
  hint.style.display = 'block';
}
function hideHint() {
  var hint = $('touchHint');
  if (hint) hint.style.display = 'none';
}
function clearSelections() {
  STATE.duty.selected = null;
  STATE.classSelected = null;
  document.querySelectorAll('.touch-selected').forEach(function(el) { el.classList.remove('touch-selected'); });
  hideHint();
}

function setDatePickerToday() {
  var dp = $('datePicker');
  if (dp) dp.value = formatDateISO(STATE.currentDate);
}

/** Keep start/end date & time inputs consistent in the task form */
function initDateTimeSync() {
  var startDate = $('taskStartDate'), endDate = $('taskEndDate');
  var startTime = $('taskStartTime'), endTime = $('taskEndTime');

  if (startDate && endDate) {
    startDate.addEventListener('change', function() {
      if (endDate.value && endDate.value < startDate.value) endDate.value = startDate.value;
      endDate.min = startDate.value;
    });
    endDate.addEventListener('change', function() {
      if (startDate.value && startDate.value > endDate.value) startDate.value = endDate.value;
    });
  }

  if (startTime && endTime) {
    startTime.addEventListener('change', function() {
      if (startDate.value === endDate.value && endTime.value && endTime.value <= startTime.value) {
        var parts = startTime.value.split(':');
        var h = Math.min(23, parseInt(parts[0], 10) + 1);
        endTime.value = pad2(h) + ':' + parts[1];
      }
    });
    endTime.addEventListener('change', function() {
      if (startDate.value === endDate.value && startTime.value && startTime.value >= endTime.value) {
        var parts = endTime.value.split(':');
        var h = Math.max(0, parseInt(parts[0], 10) - 1);
        startTime.value = pad2(h) + ':' + parts[1];
      }
    });
  }
}

// ── Navigation / views ────────────────────────────────────
function navigateDate(delta) {
  var d = new Date(STATE.currentDate);
  if (STATE.viewMode === 'month') {
    d.setDate(1); // avoid month-end overflow
    d.setMonth(d.getMonth() + delta);
  } else if (STATE.viewMode === 'week') {
    d = addDays(d, delta * 7);
  } else {
    d = addDays(d, delta);
  }
  STATE.currentDate = d;
  setDatePickerToday();
  loadTaskModule();
}

function goToday() {
  STATE.currentDate = new Date();
  setDatePickerToday();
  loadTaskModule();
}

function onDateChange() {
  var val = $('datePicker').value;
  if (val) {
    STATE.currentDate = parseDateISO(val);
    loadTaskModule();
  }
}

function setView(v) {
  STATE.viewMode = v;
  ['List', 'Day', 'Week', 'Month'].forEach(function(name) {
    $('view' + name).classList.toggle('active', v === name.toLowerCase());
  });
  loadTaskModule();
}

function updateTaskNavVisibility() {
  var nav = $('dateNav');
  if (nav) nav.style.display = STATE.viewMode === 'list' ? 'none' : 'flex';
  var sortBtn = $('sortBtn');
  if (sortBtn) sortBtn.style.display = (STATE.viewMode === 'list' || STATE.viewMode === 'day') ? '' : 'none';
}

function invalidateTaskCache() {
  STATE.tasksKey = null;
  STATE.statsLoaded = false;
}

/** The inclusive date range (local midnight) for the current view */
function getTaskRange() {
  var d = STATE.currentDate, s, e;
  if (STATE.viewMode === 'week') {
    s = getWeekStart(d); e = addDays(s, 6);
  } else if (STATE.viewMode === 'month') {
    s = new Date(d.getFullYear(), d.getMonth(), 1);
    e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  } else if (STATE.viewMode === 'day') {
    s = startOfDay(d); e = startOfDay(d);
  } else {
    var today = startOfDay(new Date());
    s = addDays(today, -180); e = addDays(today, 365);
  }
  return { start: s, end: e };
}

function updateDateRangeLabel(range) {
  var el = $('dateRangeLabel');
  if (!el) return;
  if (STATE.viewMode === 'list') {
    el.textContent = 'Overdue and upcoming tasks';
  } else if (STATE.viewMode === 'month') {
    el.textContent = STATE.currentDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  } else if (STATE.viewMode === 'day') {
    el.textContent = formatDateLong(STATE.currentDate);
  } else {
    el.textContent = formatDateShort(range.start) + ' – ' + formatDateShort(range.end) + ' ' + range.end.getFullYear();
  }
}

// ── Load ──────────────────────────────────────────────────
function loadTaskModule(force) {
  var range = getTaskRange();
  var key = STATE.viewMode + '|' + formatDateISO(range.start) + '|' + formatDateISO(range.end);
  updateDateRangeLabel(range);
  updateTaskNavVisibility();

  if (!STATE.statsLoaded || force) loadWeeklyStats();

  if (!force && STATE.tasksKey === key) { renderTaskList(); return; }

  var wrap = $('taskListWrap');
  if (wrap) wrap.innerHTML = skeletonHtml(4);

  var token = ++STATE.taskReq;
  runServer('getTasksByDateRange', [range.start.toISOString(), range.end.toISOString()], function(res) {
    if (token !== STATE.taskReq) return; // a newer request superseded this one
    if (!res || !res.success) {
      if (wrap) wrap.innerHTML = renderLoadError(res && res.error);
      return;
    }
    STATE.tasks = res.data || [];
    STATE.tasksKey = key;
    renderTaskList();
    renderOverviewHub();
  }, function(err) {
    if (token !== STATE.taskReq) return;
    if (wrap) wrap.innerHTML = renderLoadError(err && err.message);
  });
}

function renderLoadError(msg) {
  return '<div class="empty-state"><div class="empty-icon"><i class="fi fi-rr-exclamation"></i></div>' +
    '<div class="empty-title">Could not load tasks</div>' +
    '<div class="empty-sub">' + escapeHtml(msg || 'Please check your connection and try again.') + '</div>' +
    '<button class="btn btn-secondary" style="margin-top:14px" onclick="loadTaskModule(true)"><i class="fi fi-rr-refresh"></i> Retry</button></div>';
}

function loadWeeklyStats() {
  runServer('getWeeklyStats', [getWeekStart(new Date()).toISOString()], function(res) {
    if (res && res.success) {
      STATE.statsLoaded = true;
      renderWeeklyStats(res.data);
    }
  }, function() {});
}

function renderWeeklyStats(stats) {
  setText('statTotal', stats.total);
  setText('statUrgent', stats.urgent);
  setText('statHigh', stats.high);
  setText('statDone', stats.done);
  setText('statRemaining', stats.remaining + (stats.remaining === 1 ? ' task' : ' tasks'));
  var bar = $('progressBar'), label = $('progressLabel');
  if (bar) bar.style.width = stats.progress + '%';
  if (label) label.textContent = stats.progress + '% done (' + stats.done + '/' + stats.total + ')';
}

function setText(id, value) {
  var el = $(id);
  if (el) el.textContent = value;
}

// ── Filters & sorting ─────────────────────────────────────
function onTaskFilterChange() { renderTaskList(); }

function taskFiltersActive() {
  return !!($('taskSearch').value.trim()) || $('filterPriority').value !== 'all' || $('filterStatus').value !== 'all';
}

function applyTaskFilters(tasks) {
  var q = $('taskSearch').value.trim().toLowerCase();
  var prio = $('filterPriority').value;
  var status = $('filterStatus').value;
  return (tasks || []).filter(function(t) {
    var isHoliday = t.priority === 'holiday';
    if (q && (t.title || '').toLowerCase().indexOf(q) === -1 &&
             (t.description || '').toLowerCase().indexOf(q) === -1) return false;
    if (prio !== 'all' && (t.isDone || t.priority !== prio)) return false;
    if (status === 'active' && (t.isDone || isHoliday)) return false;
    if (status === 'done' && !t.isDone) return false;
    if (status === 'holiday' && !isHoliday) return false;
    return true;
  });
}

function priorityRank(t) {
  var key = t.isDone ? 'done' : (t.priority || 'normal');
  var r = CONFIG.PRIORITY_ORDER[key];
  return r === undefined ? 2 : r;
}

function sortTasks(tasks) {
  var list = tasks.slice();
  list.sort(function(a, b) {
    if (STATE.sortedByPriority) {
      var d = priorityRank(a) - priorityRank(b);
      if (d !== 0) return d;
    }
    return new Date(a.startTime) - new Date(b.startTime);
  });
  return list;
}

function sortByPriority() {
  STATE.sortedByPriority = !STATE.sortedByPriority;
  $('sortBtn').innerHTML = STATE.sortedByPriority
    ? '<i class="fi fi-rr-sort-amount-down"></i> Sort by time'
    : '<i class="fi fi-rr-sort-amount-up"></i> Sort by priority';
  renderTaskList();
}

/** Tasks (incl. multi-day) that touch the given day */
function tasksOnDay(tasks, day) {
  var dayStart = startOfDay(day).getTime();
  var dayEnd = dayStart + 86400000 - 1;
  return tasks.filter(function(t) {
    return new Date(t.startTime).getTime() <= dayEnd && new Date(t.endTime).getTime() >= dayStart;
  });
}

/** Map "YYYY-MM-DD" → tasks, limited to [rangeStart, rangeEnd] */
function buildTaskDayMap(tasks, rangeStart, rangeEnd) {
  var map = {};
  tasks.forEach(function(t) {
    var s = startOfDay(new Date(t.startTime));
    var e = startOfDay(new Date(t.endTime));
    if (s < rangeStart) s = rangeStart;
    if (e > rangeEnd) e = rangeEnd;
    for (var cur = new Date(s); cur <= e; cur = addDays(cur, 1)) {
      var key = formatDateISO(cur);
      (map[key] = map[key] || []).push(t);
    }
  });
  return map;
}

// ── Render ────────────────────────────────────────────────
function renderTaskList() {
  var wrap = $('taskListWrap');
  if (!wrap) return;
  var tasks = applyTaskFilters(STATE.tasks);

  if (STATE.viewMode === 'month') { renderMonthView(tasks); return; }
  if (STATE.viewMode === 'week')  { renderTaskWeekView(tasks); return; }

  if (STATE.viewMode === 'day') tasks = tasksOnDay(tasks, STATE.currentDate);
  tasks = sortTasks(tasks);

  if (tasks.length === 0) { wrap.innerHTML = renderEmptyState(); return; }

  if (STATE.viewMode === 'list') {
    var today = startOfDay(new Date());
    var overdue = tasks.filter(function(t) {
      return !t.isDone && t.priority !== 'holiday' && startOfDay(new Date(t.endTime)) < today;
    });
    var upcoming = tasks.filter(function(t) {
      return !t.isDone && overdue.indexOf(t) === -1;
    });
    var done = tasks.filter(function(t) { return t.isDone; });

    var html = '<div class="task-list">';
    if (overdue.length) {
      html += '<div class="task-group-title overdue"><i class="fi fi-rr-exclamation"></i> Overdue (' + overdue.length + ')</div>';
      html += overdue.map(renderTaskItem).join('');
    }
    if (upcoming.length) {
      html += '<div class="task-group-title"><i class="fi fi-rr-calendar"></i> Current and upcoming (' + upcoming.length + ')</div>';
      html += upcoming.map(renderTaskItem).join('');
    }
    if (done.length) {
      html += '<div class="task-group-title"><i class="fi fi-rr-checkbox"></i> Completed (' + done.length + ')</div>';
      html += done.map(renderTaskItem).join('');
    }
    wrap.innerHTML = html + '</div>';
  } else {
    wrap.innerHTML = '<div class="task-list">' + tasks.map(renderTaskItem).join('') + '</div>';
  }
}

function renderEmptyState() {
  if (taskFiltersActive()) {
    return '<div class="empty-state"><div class="empty-icon"><i class="fi fi-rr-search"></i></div>' +
      '<div class="empty-title">No matching tasks</div><div class="empty-sub">Try changing or clearing your filters.</div></div>';
  }
  var msgs = [
    { icon: 'fi-rr-trees',    title: 'Nothing on the list!', sub: 'Take a break, you have earned it.' },
    { icon: 'fi-rr-sun',      title: 'All clear!',           sub: 'Use the free time for something you enjoy.' },
    { icon: 'fi-rr-bullseye', title: 'No tasks in this period', sub: 'Add one with the "New task" button.' }
  ];
  var m = msgs[Math.floor(Math.random() * msgs.length)];
  return '<div class="empty-state"><div class="empty-icon"><i class="fi ' + m.icon + '"></i></div>' +
    '<div class="empty-title">' + m.title + '</div><div class="empty-sub">' + m.sub + '</div></div>';
}

/** Readable date/time range of a task */
function formatTaskWhen(task) {
  var start = new Date(task.startTime), end = new Date(task.endTime);
  var sameDay = start.toDateString() === end.toDateString();
  var dateStr = sameDay ? formatDateShort(start) : formatDateShort(start) + ' – ' + formatDateShort(end);
  if (task.allDay) return dateStr;
  if (sameDay) return dateStr + ', ' + formatTimeHHMM(start) + ' – ' + formatTimeHHMM(end);
  return dateStr + ' (' + formatTimeHHMM(start) + ' – ' + formatTimeHHMM(end) + ')';
}

var PRIORITY_BADGES = {
  urgent:  '<i class="fi fi-rr-flame"></i> Urgent',
  high:    '<i class="fi fi-rr-exclamation"></i> High',
  normal:  '<i class="fi fi-rr-circle"></i> Normal',
  low:     '<i class="fi fi-rr-circle"></i> Low',
  done:    '<i class="fi fi-rr-checkbox"></i> Done',
  holiday: '<i class="fi fi-rr-sun"></i> Holiday'
};

function renderTaskItem(task) {
  var isHoliday = task.priority === 'holiday';
  var priority = task.isDone ? 'done' : (task.priority || 'normal');
  var domId = escapeId(task.id);

  // ── Description with read-more ──
  var descHtml = '';
  var DESC_LIMIT = 100;
  if (task.description) {
    if (task.description.length > DESC_LIMIT) {
      descHtml =
        '<div class="task-desc">' +
          '<span id="desc-' + domId + '-short">' + escapeHtml(task.description.substring(0, DESC_LIMIT)) + '…</span>' +
          '<span id="desc-' + domId + '-full" style="display:none;">' + escapeHtml(task.description) + '</span><br>' +
          '<button class="read-more-btn" id="descBtn-' + domId + '" onclick="toggleTaskDesc(' + arg(domId) + ')">' +
            '<i class="fi fi-rr-angle-small-down"></i> Read more</button>' +
        '</div>';
    } else {
      descHtml = '<div class="task-desc">' + escapeHtml(task.description) + '</div>';
    }
  }

  var lead = isHoliday
    ? '<span class="task-holiday-icon"><i class="fi fi-rr-umbrella-beach"></i></span>'
    : '<input type="checkbox" class="task-checkbox" aria-label="Mark as done"' + (task.isDone ? ' checked' : '') +
      ' onchange="toggleTaskDone(' + arg(task.id) + ', this)" />';

  var actions = isHoliday ? '' :
    '<div class="task-actions">' +
      '<button class="action-btn edit" onclick="openEditTaskModal(' + arg(task.id) + ')" title="Edit"><i class="fi fi-rr-pencil"></i></button>' +
      '<button class="action-btn delete" onclick="confirmDeleteTask(' + arg(task.id) + ')" title="Delete"><i class="fi fi-rr-trash"></i></button>' +
    '</div>';

  return '<div class="task-item priority-' + priority + (task.isDone ? ' done' : '') + '" id="task-' + domId + '">' +
    lead +
    '<div class="task-body">' +
      '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
      '<div class="task-meta">' +
        '<span class="task-time"><i class="fi fi-rr-time-fast"></i> ' + escapeHtml(formatTaskWhen(task)) + '</span>' +
        '<span class="task-badge badge-' + priority + '">' + (PRIORITY_BADGES[priority] || priority) + '</span>' +
      '</div>' +
      descHtml +
    '</div>' +
    actions +
  '</div>';
}

function toggleTaskDesc(domId) {
  var shortEl = $('desc-' + domId + '-short');
  var fullEl = $('desc-' + domId + '-full');
  var btn = $('descBtn-' + domId);
  if (!shortEl || !fullEl || !btn) return;
  var expanded = fullEl.style.display !== 'none';
  fullEl.style.display = expanded ? 'none' : '';
  shortEl.style.display = expanded ? '' : 'none';
  btn.innerHTML = expanded
    ? '<i class="fi fi-rr-angle-small-down"></i> Read more'
    : '<i class="fi fi-rr-angle-small-up"></i> Show less';
}

// ── Month view ────────────────────────────────────────────
var PILL_COLORS = { urgent: '#ef4444', high: '#f59e0b', normal: '#06b6d4', low: '#10b981', done: '#475569', holiday: '#8b5cf6' };

function renderMonthView(tasks) {
  var wrap = $('taskListWrap');
  var year = STATE.currentDate.getFullYear();
  var month = STATE.currentDate.getMonth();
  var first = new Date(year, month, 1);
  var last = new Date(year, month + 1, 0);
  var taskMap = buildTaskDayMap(tasks, first, last);
  var todayKey = formatDateISO(new Date());
  var startDow = (first.getDay() + 6) % 7; // Mon = 0 … Sun = 6

  var html = '<div class="month-grid-wrap"><div class="month-grid">';
  html += '<div class="month-day-headers">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d, i) {
    html += '<div class="month-day-hdr' + (i >= 5 ? ' weekend' : '') + '">' + d + '</div>';
  });
  html += '</div><div class="month-body">';

  for (var i = 0; i < startDow; i++) html += '<div class="month-cell empty"></div>';

  for (var day = 1; day <= last.getDate(); day++) {
    var date = new Date(year, month, day);
    var key = formatDateISO(date);
    var dayTasks = taskMap[key] || [];
    var dow = (date.getDay() + 6) % 7;

    html += '<div class="month-cell' + (key === todayKey ? ' today-cell' : '') + '" onclick="openDayTasksModal(' + arg(key) + ')">';
    html += '<div class="month-day-num' + (key === todayKey ? ' today-num' : '') + (dow >= 5 ? ' weekend-num' : '') + '">' + day + '</div>';
    dayTasks.slice(0, 3).forEach(function(task) {
      var p = task.isDone ? 'done' : (task.priority || 'normal');
      html += '<div class="month-task-pill' + (task.isDone ? ' pill-done' : '') + '" style="background:' + (PILL_COLORS[p] || '#6366f1') +
        ';" title="' + escapeHtml(task.title) + '">' + escapeHtml(task.title) + '</div>';
    });
    if (dayTasks.length > 3) html += '<div class="month-more">+' + (dayTasks.length - 3) + ' more</div>';
    html += '</div>';
  }

  var remainder = (7 - ((startDow + last.getDate()) % 7)) % 7;
  for (var j = 0; j < remainder; j++) html += '<div class="month-cell empty"></div>';

  wrap.innerHTML = html + '</div></div></div>';
}

// ── Week view (kanban, drag to reschedule) ────────────────
function renderTaskWeekView(tasks) {
  var wrap = $('taskListWrap');
  var weekStart = getWeekStart(STATE.currentDate);
  var weekEnd = addDays(weekStart, 6);
  var taskMap = buildTaskDayMap(tasks, weekStart, weekEnd);
  var todayKey = formatDateISO(new Date());
  var html = '<div class="kanban-week-wrap">';

  for (var i = 0; i < 7; i++) {
    var d = addDays(weekStart, i);
    var key = formatDateISO(d);
    var dayTasks = sortTasks(taskMap[key] || []);

    html += '<div class="kanban-day-col' + (key === todayKey ? ' today' : '') + '" data-day="' + key + '"' +
      ' ondragover="onWeekDragOver(event)" ondragleave="onWeekDragLeave(event)" ondrop="onWeekDrop(event,' + arg(key) + ')">';
    html += '<div class="kanban-day-header"><span>' +
      d.toLocaleDateString('en-GB', { weekday: 'long' }) + ' ' + d.getDate() + '</span>' +
      '<button class="action-btn" onclick="openAddTaskModal(' + arg(key) + ')" title="Add task"><i class="fi fi-rr-plus"></i></button></div>';
    html += '<div class="kanban-day-body">';

    if (dayTasks.length === 0) {
      html += '<div class="kanban-empty">No tasks</div>';
    } else {
      dayTasks.forEach(function(task) {
        var p = task.isDone ? 'done' : (task.priority || 'normal');
        var isHoliday = task.priority === 'holiday';
        var drag = isHoliday ? '' : ' draggable="true" ondragstart="onWeekDragStart(event,' + arg(task.id) + ',' + arg(key) + ')" ondragend="onWeekDragEnd(event)"';
        var click = isHoliday ? '' : ' onclick="openEditTaskModal(' + arg(task.id) + ')"';
        html += '<div class="kanban-task' + (task.isDone ? ' done' : '') + '" style="border-left-color:' + (PILL_COLORS[p] || '#6366f1') + ';"' + drag + click + '>';
        html += '<div class="kanban-task-title">' + escapeHtml(task.title) + '</div>';
        if (!task.allDay) {
          html += '<div class="kanban-task-time"><i class="fi fi-rr-clock"></i> ' + formatTimeHHMM(new Date(task.startTime)) + '</div>';
        } else if (isHoliday) {
          html += '<div class="kanban-task-time"><i class="fi fi-rr-sun"></i> Holiday</div>';
        }
        html += '</div>';
      });
    }
    html += '</div></div>';
  }
  wrap.innerHTML = html + '</div>';
}

function onWeekDragStart(e, taskId, dayKey) {
  STATE.dragTask = { id: taskId, from: dayKey };
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', taskId); } catch (err) {}
  e.currentTarget.classList.add('dragging');
}
function onWeekDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.kanban-day-col.drag-over').forEach(function(c) { c.classList.remove('drag-over'); });
}
function onWeekDragOver(e) {
  if (!STATE.dragTask) return;
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onWeekDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function onWeekDrop(e, toKey) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  var drag = STATE.dragTask;
  STATE.dragTask = null;
  if (!drag) return;
  var delta = daysBetween(parseDateISO(drag.from), parseDateISO(toKey));
  if (delta === 0) return;

  // Optimistic update, rolled back by reloading on failure
  var task = STATE.tasks.find(function(t) { return t.id === drag.id; });
  if (task) {
    task.startTime = addDays(new Date(task.startTime), delta).toISOString();
    task.endTime = addDays(new Date(task.endTime), delta).toISOString();
    renderTaskList();
  }
  runServer('moveTask', [drag.id, delta], function(res) {
    invalidateTaskCache();
    if (!res || !res.success) { showError(res && res.error); }
    loadTaskModule(true);
  }, function(err) { handleError(err); invalidateTaskCache(); loadTaskModule(true); });
}

// ── Day modal (month view) ────────────────────────────────
function openDayTasksModal(isoDate) {
  var d = parseDateISO(isoDate);
  STATE.dayModalDate = isoDate;
  var dayTasks = sortTasks(tasksOnDay(applyTaskFilters(STATE.tasks), d));

  if (dayTasks.length === 0) { openAddTaskModal(isoDate); return; }

  $('dayTasksModalTitle').textContent = formatDateLong(d);
  $('dayTasksModalContent').innerHTML = dayTasks.map(renderTaskItem).join('');
  $('dayTasksModal').classList.remove('hidden');
}

function closeDayTasksModal() {
  var m = $('dayTasksModal');
  if (m) m.classList.add('hidden');
}

function openAddTaskModalFromDay() {
  var iso = STATE.dayModalDate;
  closeDayTasksModal();
  openAddTaskModal(iso);
}

// ── Toggle done ───────────────────────────────────────────
function toggleTaskDone(eventId, checkbox) {
  var task = STATE.tasks.find(function(t) { return t.id === eventId; });
  var markDone = checkbox.checked;

  function afterChange(res) {
    if (!res || !res.success) {
      checkbox.checked = !markDone;
      showError(res && res.error);
      return;
    }
    invalidateTaskCache();
    loadTaskModule(true);
    closeDayTasksModal();
  }

  if (!markDone) {
    runServer('markTaskUndone', [eventId, 'normal'], afterChange, function(e) { checkbox.checked = true; handleError(e); });
    return;
  }

  Swal.fire({
    title: 'Mark as done?',
    text: task ? task.title : '',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Yes, it is done',
    cancelButtonText: 'Not yet',
    confirmButtonColor: '#10b981'
  }).then(function(r) {
    if (!r.isConfirmed) { checkbox.checked = false; return; }
    runServer('markTaskDone', [eventId], afterChange, function(e) { checkbox.checked = false; handleError(e); });
  });
}

// ── Add / Edit task modal ─────────────────────────────────
function openAddTaskModal(isoDate) {
  closeDayTasksModal();
  var date = isoDate ? parseDateISO(isoDate) : (STATE.viewMode === 'list' ? new Date() : STATE.currentDate);
  var iso = formatDateISO(date);
  $('taskModalTitle').textContent = 'New task';
  $('editEventId').value = '';
  $('editEventDone').value = '';
  $('taskTitle').value = '';
  $('taskDesc').value = '';
  $('taskStartDate').value = iso;
  $('taskEndDate').value = iso;
  $('taskEndDate').min = iso;
  $('taskStartTime').value = '09:00';
  $('taskEndTime').value = '10:00';
  $('pNormal').checked = true;
  $('taskModal').classList.remove('hidden');
  setTimeout(function() { $('taskTitle').focus(); }, 100);
}

function openEditTaskModal(eventId) {
  var task = STATE.tasks.find(function(t) { return t.id === eventId; });
  if (!task || task.priority === 'holiday') return;
  closeDayTasksModal();
  $('taskModalTitle').textContent = 'Edit task';
  $('editEventId').value = eventId;
  $('editEventDone').value = task.isDone ? 'true' : '';
  $('taskTitle').value = task.title;
  $('taskDesc').value = task.description || '';
  var start = new Date(task.startTime), end = new Date(task.endTime);
  $('taskStartDate').value = formatDateISO(start);
  $('taskEndDate').value = formatDateISO(end);
  $('taskEndDate').min = formatDateISO(start);
  $('taskStartTime').value = formatTimeHHMM(start);
  $('taskEndTime').value = formatTimeHHMM(end);
  var p = task.isDone ? 'normal' : (task.priority || 'normal');
  var radio = $('p' + p.charAt(0).toUpperCase() + p.slice(1));
  if (radio) radio.checked = true;
  $('taskModal').classList.remove('hidden');
}

function closeTaskModal() {
  var m = $('taskModal');
  if (m) m.classList.add('hidden');
}

function submitTask() {
  var title = $('taskTitle').value.trim();
  if (!title) { showWarning('Please enter a task title'); return; }

  var startDate = $('taskStartDate').value, endDate = $('taskEndDate').value;
  if (!startDate || !endDate) { showWarning('Please choose the start and due dates'); return; }

  // Empty time fields default to 00:00
  var startISO = startDate + 'T' + ($('taskStartTime').value || '00:00') + ':00';
  var endISO   = endDate   + 'T' + ($('taskEndTime').value   || '00:00') + ':00';

  // Only block when the end is strictly BEFORE the start. The same time on
  // different days is valid; identical start/end gets +1 hour.
  var startD = new Date(startISO), endD = new Date(endISO);
  if (endD < startD) { showWarning('End time must be after start time'); return; }
  if (endD.getTime() === startD.getTime()) endD = new Date(startD.getTime() + 3600000);

  var priority = document.querySelector('input[name="taskPriority"]:checked');
  var editId = $('editEventId').value;
  var taskData = {
    title:       title,
    startTime:   startD.toISOString(),
    endTime:     endD.toISOString(),
    description: $('taskDesc').value.trim(),
    priority:    priority ? priority.value : 'normal',
    isDone:      $('editEventDone').value === 'true'
  };

  var btn = $('taskSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = 'Saving...';
  function resetBtn() { btn.disabled = false; btn.innerHTML = '<i class="fi fi-rr-disk"></i> Save task'; }

  runServer(editId ? 'updateTask' : 'createTask', editId ? [editId, taskData] : [taskData], function(res) {
    resetBtn();
    if (!isOk(res)) return;
    closeTaskModal();
    showSuccess(editId ? 'Task updated' : 'Task added');
    invalidateTaskCache();
    loadTaskModule(true);
  }, function(e) { resetBtn(); handleError(e); });
}

function confirmDeleteTask(eventId) {
  confirmDialog('Delete this task?', 'This cannot be undone.', 'Delete').then(function(ok) {
    if (!ok) return;
    runServer('deleteTask', [eventId], function(res) {
      if (!isOk(res)) return;
      closeDayTasksModal();
      showSuccess('Task deleted');
      invalidateTaskCache();
      loadTaskModule(true);
    });
  });
}

// SECTION 2: DUTY / ROTA (Google Sheets)

var dutyIdCounter = 0;
function newDutyId() { return 'duty_' + Date.now() + '_' + (++dutyIdCounter); }

function slotKey(slot) { return slot.start + '-' + slot.end; }
function slotLabel(slot) { return slot.start + ' – ' + slot.end; }
function timesOverlap(aStart, aEnd, bStart, bEnd) {
  return timeToMin(aStart) < timeToMin(bEnd) && timeToMin(aEnd) > timeToMin(bStart);
}
function sortSlots(slots) {
  slots.sort(function(a, b) { return timeToMin(a.start) - timeToMin(b.start) || timeToMin(a.end) - timeToMin(b.end); });
}

function loadDutyModule(force) {
  if (STATE.duty.loaded && !force) { renderDuty(); return; }
  showLoading();
  runServer('getDutyData', [], function(res) {
    hideLoading();
    if (!isOk(res)) return;
    var data = res.data || {};
    STATE.duty.slots = (data.slots && data.slots.length) ? data.slots : CONFIG.DUTY_DEFAULT_SLOTS.map(function(s) { return { start: s.start, end: s.end }; });
    sortSlots(STATE.duty.slots);
    STATE.duty.members = data.members || [];
    STATE.duty.allAssignments = (data.assignments || []).map(function(a) {
      return { id: newDutyId(), week_start: a.week_start || '', day: a.day, start: a.start, end: a.end, duty_name: a.duty_name || '', person: a.person, notes: a.notes || '' };
    });
    var currentWeekKey = formatDateISO(STATE.duty.weekStart);
    STATE.duty.assignments = STATE.duty.allAssignments.filter(function(a) {
      return a.week_start === currentWeekKey || (!a.week_start && currentWeekKey === formatDateISO(getWeekStart(new Date())));
    });
    STATE.duty.loaded = true;
    STATE.duty.dirty = false;
    renderDuty();
    refreshSyncIndicator();
  }, function(e) { hideLoading(); handleError(e); });
}

function renderDuty() {
  renderDutyWeekNav();
  renderMemberPool();
  renderDutyGrid();
  refreshSyncIndicator();
  renderOverviewHub();
}

// ── Duty Week navigation ──────────────────────────────────
function renderDutyWeekNav() {
  var lbl = $('dutyWeekRangeLabel');
  if (!lbl) return;
  var start = STATE.duty.weekStart;
  var end = addDays(start, 6);
  lbl.textContent = formatDateShort(start) + ' – ' + formatDateShort(end) + ' ' + end.getFullYear();
  var todayBtn = $('dutyTodayBtn');
  var isCurrent = formatDateISO(start) === formatDateISO(getWeekStart(new Date()));
  if (todayBtn) {
    todayBtn.classList.toggle('btn-primary', isCurrent);
    todayBtn.classList.toggle('btn-secondary', !isCurrent);
  }
}

function switchDutyWeek(newWeekStart) {
  var oldWeekKey = formatDateISO(STATE.duty.weekStart);
  STATE.duty.allAssignments = (STATE.duty.allAssignments || []).filter(function(a) {
    return a.week_start !== oldWeekKey && (a.week_start || oldWeekKey !== formatDateISO(getWeekStart(new Date())));
  });
  (STATE.duty.assignments || []).forEach(function(a) {
    a.week_start = oldWeekKey;
    STATE.duty.allAssignments.push(a);
  });

  STATE.duty.weekStart = newWeekStart;
  var newWeekKey = formatDateISO(newWeekStart);
  STATE.duty.assignments = STATE.duty.allAssignments.filter(function(a) {
    return a.week_start === newWeekKey || (!a.week_start && newWeekKey === formatDateISO(getWeekStart(new Date())));
  });

  renderDutyWeekNav();
  renderDuty();
}

function prevDutyWeek() {
  switchDutyWeek(addDays(STATE.duty.weekStart, -7));
}

function nextDutyWeek() {
  switchDutyWeek(addDays(STATE.duty.weekStart, 7));
}

function todayDutyWeek() {
  switchDutyWeek(getWeekStart(new Date()));
}

function copyFromPrevDutyWeek() {
  var prevWeekKey = formatDateISO(addDays(STATE.duty.weekStart, -7));
  var currentWeekKey = formatDateISO(STATE.duty.weekStart);

  var prevAssignments = (STATE.duty.allAssignments || []).filter(function(a) {
    return a.week_start === prevWeekKey;
  });

  if (prevAssignments.length === 0) {
    prevAssignments = (STATE.duty.allAssignments || []).filter(function(a) { return !a.week_start; });
  }

  if (prevAssignments.length === 0) {
    Swal.fire({
      icon: 'info',
      title: 'No rota found',
      text: 'There are no duty assignments in the previous week (' + prevWeekKey + ') to copy.',
      timer: 2500,
      showConfirmButton: false
    });
    return;
  }

  function doCopy() {
    var cloned = prevAssignments.map(function(a) {
      return {
        id: newDutyId(),
        week_start: currentWeekKey,
        day: a.day,
        start: a.start,
        end: a.end,
        duty_name: a.duty_name,
        person: a.person,
        notes: a.notes
      };
    });
    STATE.duty.assignments = cloned;
    setDutyDirty(true);
    renderDuty();
    Swal.fire({
      icon: 'success',
      title: 'Rota copied!',
      text: 'Copied ' + cloned.length + ' shift(s) from last week. Click "Save Rota" to save.',
      timer: 2200,
      showConfirmButton: false
    });
  }

  if (STATE.duty.assignments && STATE.duty.assignments.length > 0) {
    confirmDialog(
      'Replace this week\'s rota?',
      'This will replace the ' + STATE.duty.assignments.length + ' assignment(s) in this week with ' + prevAssignments.length + ' from last week.',
      'Replace'
    ).then(function(confirmed) {
      if (confirmed) doCopy();
    });
  } else {
    doCopy();
  }
}

function memberColor(name) {
  var m = STATE.duty.members.find(function(x) { return x.name === name; });
  return m ? m.color : '#64748b';
}

// ── Edit / View mode ──────────────────────────────────────

  $('dutyControls').classList.toggle('is-editing', STATE.duty.editMode);
  $('dutyLayout').classList.toggle('is-editing', STATE.duty.editMode);

  btn.innerHTML = STATE.duty.editMode ? '<i class="fi fi-rr-check"></i> View rota' : '<i class="fi fi-rr-pencil"></i> Edit rota';

  btn.classList.toggle('btn-secondary', !STATE.duty.editMode);

// ── Member pool ───────────────────────────────────────────
function renderMemberPool() {
  var body = $('memberPoolBody');
  if (!body) return;
  var members = STATE.duty.members;
  $('memberCount').textContent = members.length + (members.length === 1 ? ' member' : ' members');

  if (members.length === 0) {
    body.innerHTML = '<div class="pool-empty"><i class="fi fi-rr-users" style="font-size:26px"></i><br>No members yet<br>Add a name above to start</div>';
    return;
  }
  var editing = STATE.duty.editMode;
  body.innerHTML = members.map(function(m) {
    var count = STATE.duty.assignments.filter(function(a) { return a.person === m.name; }).length;
