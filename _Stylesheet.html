<style>
/* ─────────────────────────────────────────────────────────
   _Stylesheet.html — UniPlan glassmorphism UI (dark by default)
   ─────────────────────────────────────────────────────── */

/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
/* Flaticon UIcons */
@import url('https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css');

/* ── CSS Variables ─────────────────────────────────── */
:root {
  color-scheme: dark;
  /* DARK THEME (default) */
  --bg-primary: #0f172a;
  --bg-secondary: rgba(255, 255, 255, 0.07);
  --bg-card: rgba(255, 255, 255, 0.05);
  --bg-card-hover: rgba(255, 255, 255, 0.09);
  --bg-solid: #1e293b;
  --border: rgba(255, 255, 255, 0.10);
  --border-hover: rgba(255, 255, 255, 0.22);

  --text-primary: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;

  --accent: #6366f1;
  --accent-hover: #818cf8;
  --accent-light: rgba(99, 102, 241, 0.18);

  --success: #34d399;
  --success-light: rgba(16, 185, 129, 0.16);
  --warning: #fbbf24;
  --warning-light: rgba(245, 158, 11, 0.16);
  --danger: #f87171;
  --danger-light: rgba(239, 68, 68, 0.16);
  --info: #22d3ee;
  --info-light: rgba(6, 182, 212, 0.16);
  --holiday: #a78bfa;
  --holiday-light: rgba(139, 92, 246, 0.16);

  --glass-blur: blur(18px) saturate(140%);
  --orb-opacity: 0.55;
  --grid-line: rgba(255, 255, 255, 0.07);

  --sidebar-w: 248px;
  --sidebar-w-collapsed: 88px;
  --topbar-h: 70px;
  --radius-sm: 12px;
  --radius: 16px;
  --radius-lg: 22px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
  --shadow-lg: 0 14px 34px rgba(0, 0, 0, 0.35);
  --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.30);

  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.15s ease-out;
}

[data-theme="light"] {
  color-scheme: light;
  --bg-primary: #e8eaf6;
  --bg-secondary: rgba(15, 23, 42, 0.06);
  --bg-card: rgba(255, 255, 255, 0.66);
  --bg-card-hover: rgba(255, 255, 255, 0.85);
  --bg-solid: #ffffff;
  --border: rgba(15, 23, 42, 0.10);
  --border-hover: rgba(15, 23, 42, 0.22);

  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;

  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-light: rgba(79, 70, 229, 0.12);

  --success: #059669;
  --warning: #d97706;
  --danger: #dc2626;
  --info: #0891b2;
  --holiday: #7c3aed;

  --orb-opacity: 0.35;
  --grid-line: rgba(15, 23, 42, 0.08);
  --shadow-glass: 0 8px 28px rgba(15, 23, 42, 0.10);
  --shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 14px 30px rgba(15, 23, 42, 0.16);
}

/* ── Reset & Base ──────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  background-color: var(--bg-primary);
  overscroll-behavior-y: auto;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
}

body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  overflow-x: clip;
  overscroll-behavior-y: auto;
  width: 100%;
  font-size: 14px;
  line-height: 1.5;
  transition: background-color var(--transition), color var(--transition);
}

button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
input, select, textarea { font-family: inherit; }
ul { list-style: none; }
.hidden { display: none !important; }

h1, h2, h3, h4, h5, h6 { font-weight: 700; line-height: 1.2; color: var(--text-primary); }
h2 { font-size: 20px; letter-spacing: -0.01em; }

/* Global icon alignment fix */
.fi { display: inline-flex; align-items: center; justify-content: center; line-height: 1; transform: translateY(1px); }

/* ── Decorative background orbs ────────────────────── */
.bg-orbs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--orb-opacity); }
.orb-1 { width: 420px; height: 420px; background: #6366f1; top: -120px; left: -80px; }
.orb-2 { width: 380px; height: 380px; background: #06b6d4; bottom: -140px; right: -60px; }
.orb-3 { width: 300px; height: 300px; background: #a855f7; top: 45%; left: 55%; opacity: calc(var(--orb-opacity) * 0.6); }

/* ── Glass surface mixin (applied to several selectors) ── */
.sidebar, .card, .modal-content, .stat-card, .task-item, .sync-indicator,
.menu-toggle, .theme-btn, .timetable-grid, .duty-grid, .month-grid, .kanban-day-col {
  background: var(--bg-card);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border);
}

/* ── SIDEBAR ──────────────────────────────────────── */
.sidebar {
  position: fixed;
  top: 16px; left: 16px; bottom: 16px;
  width: var(--sidebar-w);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-glass);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: width var(--transition), transform var(--transition);
  overflow: hidden;
}
.sidebar-logo { padding: 24px 22px 16px; display: flex; align-items: center; gap: 12px; }
.logo-icon {
  font-size: 22px; color: #fff;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border-radius: 12px; width: 40px; height: 40px;
  display: flex; justify-content: center; align-items: center;
  box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
}
.logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

.sidebar-nav { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.nav-btn {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--radius-sm);
  color: var(--text-secondary); font-size: 15px; font-weight: 600;
  transition: all var(--transition-fast);
}
.nav-btn:hover { background: var(--bg-secondary); color: var(--text-primary); transform: translateX(4px); }
.nav-btn.active { background: var(--accent-light); color: var(--accent-hover); box-shadow: inset 0 0 0 1px rgba(129, 140, 248, 0.28); }
[data-theme="light"] .nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 18px; display: flex; align-items: center; }

.sidebar-user { padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); min-height: 62px; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-light); color: var(--accent-hover);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
}
.user-email { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Desktop collapsed */
@media (min-width: 901px) {
  .sidebar.collapsed { width: var(--sidebar-w-collapsed); }
  .sidebar.collapsed .logo-text,
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .user-email { display: none; }
  .sidebar.collapsed .sidebar-logo { padding: 24px 0 16px; justify-content: center; }
  .sidebar.collapsed .nav-btn { justify-content: center; padding: 14px 0; }
  .sidebar.collapsed .nav-btn:hover { transform: translateY(-2px); }
  .sidebar.collapsed .sidebar-user { justify-content: center; padding: 14px 0; }
  .main-content.sidebar-collapsed { margin-left: calc(var(--sidebar-w-collapsed) + 32px); }
}

/* ── MAIN CONTENT ─────────────────────────────────── */
.main-content {
  position: relative; z-index: 1;
  margin-left: calc(var(--sidebar-w) + 32px);
  margin-right: 16px;
  flex: 1; min-width: 0; min-height: 100vh;
  display: flex; flex-direction: column;
  transition: margin var(--transition);
  padding-bottom: 24px;
}

/* ── TOPBAR ───────────────────────────────────────── */
.topbar { height: var(--topbar-h); display: flex; align-items: center; padding: 16px 0; gap: 16px; position: sticky; top: 0; z-index: 50; }
.menu-toggle, .theme-btn {
  font-size: 18px; color: var(--text-secondary);
  display: flex; padding: 10px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm); transition: all var(--transition-fast);
}
.menu-toggle:hover, .theme-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.topbar-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }

/* Sync indicator */
.sync-indicator {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  color: var(--text-muted); padding: 6px 14px; border-radius: 20px;
}
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
.sync-dot.saved { background: var(--success); }
.sync-dot.dirty { background: var(--warning); }
.sync-dot.error { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.8); } }

/* ── MODULE VIEW ─────────────────────────────────── */
.module-view { flex: 1; width: 100%; min-width: 0; animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-gap { margin-bottom: 20px; }

/* ── CARDS ────────────────────────────────────────── */
.card { border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-glass); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.card-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

/* ── STATS ────────────────────────────────────────── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.stat-card { border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); transition: all var(--transition-fast); }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat-icon-wrap { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
.stat-card.accent .stat-icon-wrap  { background: var(--accent-light);  color: var(--accent-hover); }
.stat-card.primary .stat-icon-wrap { background: var(--info-light);    color: var(--info); }
.stat-card.success .stat-icon-wrap { background: var(--success-light); color: var(--success); }
.stat-card.warning .stat-icon-wrap { background: var(--warning-light); color: var(--warning); }
.stat-card.danger .stat-icon-wrap  { background: var(--danger-light);  color: var(--danger); }
.stat-value { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.stat-label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.progress-section { margin-top: auto; padding-top: 12px; }
.progress-bar-wrap { height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #6366f1, #22d3ee); transition: width 1s cubic-bezier(.4,0,.2,1); }
.progress-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 8px; }

/* ── BUTTONS ──────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: all var(--transition-fast);
}
.btn-primary { background: linear-gradient(135deg, #6366f1, #7c3aed); color: #fff; box-shadow: 0 6px 16px rgba(99, 102, 241, 0.32); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(99, 102, 241, 0.45); }
.btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-hover); }
.btn-danger { background: var(--danger-light); color: var(--danger); }
.btn-danger:hover { background: rgba(239, 68, 68, 0.28); }
.btn-icon { padding: 8px 10px; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.theme-btn { padding: 10px; }

/* ── FORMS ────────────────────────────────────────── */
.date-input, .form-input, .form-select, .form-textarea, select {
  background-color: var(--bg-secondary); border: 1px solid var(--border);
  color: var(--text-primary); border-radius: var(--radius-sm);
  padding: 9px 14px; font-size: 14px; font-weight: 500; width: 100%;
  transition: all var(--transition-fast);
  color-scheme: dark;
}
[data-theme="light"] .date-input, [data-theme="light"] .form-input,
[data-theme="light"] .form-select, [data-theme="light"] .form-textarea,
[data-theme="light"] select {
  color-scheme: light;
}

/* Explicit solid background & text colors for all dropdowns (<select> & <option>) in Dark & Light modes */
select, .form-select, select.form-input, .swal-form-select {
  background-color: #1e293b !important;
  color: #f1f5f9 !important;
  border: 1px solid var(--border);
  color-scheme: dark;
  cursor: pointer;
}
select option, select optgroup,
.form-select option, select.form-input option, .swal-form-select option {
  background-color: #1e293b !important;
  color: #f1f5f9 !important;
}
[data-theme="light"] select,
[data-theme="light"] .form-select,
[data-theme="light"] select.form-input,
[data-theme="light"] .swal-form-select {
  background-color: #ffffff !important;
  color: #0f172a !important;
  border-color: rgba(15, 23, 42, 0.16);
  color-scheme: light;
}
[data-theme="light"] select option,
[data-theme="light"] select optgroup,
[data-theme="light"] .form-select option,
[data-theme="light"] select.form-input option,
[data-theme="light"] .swal-form-select option {
  background-color: #ffffff !important;
  color: #0f172a !important;
}
.date-input:focus, .form-input:focus, .form-select:focus, .form-textarea:focus, select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.date-input { width: 150px; margin-left: 4px; }

/* Priority picker */
.priority-picker { display: flex; gap: 10px; flex-wrap: wrap; }
.priority-option { cursor: pointer; }
.priority-option input { position: absolute; opacity: 0; pointer-events: none; }
.priority-option span {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600;
  background: var(--bg-secondary); border: 1px solid var(--border);
  transition: all var(--transition-fast);
}
.priority-option.p-urgent span { color: var(--danger); }
.priority-option.p-high span   { color: var(--warning); }
.priority-option.p-normal span { color: var(--info); }
.priority-option.p-low span    { color: var(--success); }
.priority-option input:checked + span { background: var(--accent-light); border-color: currentColor; box-shadow: 0 0 0 2px var(--accent-light); }

/* ── TOOLBAR ──────────────────────────────────────── */
.toolbar-card { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.toolbar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.toolbar-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.toolbar-title h2 { display: flex; align-items: center; gap: 8px; }
.toolbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-row { justify-content: flex-start; }
.search-box { position: relative; flex: 1; min-width: 200px; }
.search-box .fi { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.search-box .form-input { padding-left: 38px; }
.filter-select { width: auto; min-width: 150px; }
.dirty-note { color: var(--warning); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }

/* Edit-only controls */
.edit-only { display: none !important; }
.is-editing .edit-only, .edit-only.is-visible { display: flex !important; }

/* View toggle (pill) */
.view-toggle { display: flex; background: var(--bg-secondary); border-radius: 20px; padding: 4px; }
.view-toggle button { padding: 7px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 16px; transition: all var(--transition-fast); }
.view-toggle button.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }

/* Date navigation */
.date-nav-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 0 4px; }
.date-range-label { font-size: 16px; font-weight: 700; }
.week-nav { display: flex; gap: 8px; align-items: center; }

/* ── TASK LIST ────────────────────────────────────── */
.task-list { display: flex; flex-direction: column; gap: 12px; }
.task-group-title { margin: 14px 0 2px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.task-group-title.overdue { color: var(--danger); }

.task-item {
  border-radius: var(--radius); padding: 16px 18px;
  display: flex; align-items: flex-start; gap: 14px;
  transition: all var(--transition-fast); animation: fadeIn 0.25s ease both;
  box-shadow: var(--shadow-sm);
}
.task-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--border-hover); }

.task-checkbox {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-hover);
  appearance: none; -webkit-appearance: none; cursor: pointer; transition: all var(--transition-fast);
  flex-shrink: 0; margin-top: 2px; position: relative; background: transparent;
}
.task-checkbox:checked { background: var(--success); border-color: var(--success); }
.task-checkbox:checked::after {
  content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.task-item.priority-urgent .task-checkbox { border-color: var(--danger); }
.task-item.priority-high   .task-checkbox { border-color: var(--warning); }
.task-item.priority-normal .task-checkbox { border-color: var(--info); }
.task-item.priority-low    .task-checkbox { border-color: var(--success); }
.task-item.priority-urgent { border-left: 3px solid var(--danger); }
.task-item.priority-high   { border-left: 3px solid var(--warning); }
.task-item.priority-holiday { border-left: 3px solid var(--holiday); }
.task-holiday-icon { width: 24px; height: 24px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: var(--holiday); font-size: 18px; }

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; word-break: break-word; }
.task-item.done .task-title { text-decoration: line-through; color: var(--text-muted); }
.task-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.task-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.badge-urgent  { background: var(--danger-light);  color: var(--danger); }
.badge-high    { background: var(--warning-light); color: var(--warning); }
.badge-normal  { background: var(--info-light);    color: var(--info); }
.badge-low     { background: var(--success-light); color: var(--success); }
.badge-holiday { background: var(--holiday-light); color: var(--holiday); }
.badge-done    { background: var(--bg-secondary);  color: var(--text-muted); }
.task-time { font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.task-desc { font-size: 14px; color: var(--text-secondary); margin-top: 8px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.read-more-btn { color: var(--accent-hover); font-size: 12px; font-weight: 600; padding: 4px 0; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }

.task-actions { display: flex; gap: 2px; }
.action-btn { color: var(--text-muted); padding: 7px; border-radius: var(--radius-sm); transition: all .2s; display: inline-flex; font-size: 14px; }
.action-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
.action-btn.delete:hover { color: var(--danger); }
.action-btn.edit:hover { color: var(--accent-hover); }

/* ── WEEK (kanban) VIEW ───────────────────────────── */
.kanban-week-wrap { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 16px; min-height: 420px; }
.kanban-day-col { flex: 1; min-width: 230px; border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; }
.kanban-day-col.today { border-color: var(--accent); }
.kanban-day-col.drag-over { background: var(--accent-light); border-style: dashed; }
.kanban-day-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.kanban-day-col.today .kanban-day-header { color: var(--accent-hover); background: var(--accent-light); }
.kanban-day-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.kanban-empty { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; }
.kanban-task { background: var(--bg-secondary); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); padding: 10px 12px; cursor: pointer; transition: all var(--transition-fast); }
.kanban-task[draggable="true"] { cursor: grab; }
.kanban-task:hover { background: var(--bg-card-hover); }
.kanban-task.dragging { opacity: .45; }
.kanban-task.done .kanban-task-title { text-decoration: line-through; opacity: .6; }
.kanban-task-title { font-size: 14px; font-weight: 600; word-break: break-word; }
.kanban-task-time { font-size: 12px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }

/* ── MONTH VIEW ───────────────────────────────────── */
.month-grid-wrap { overflow-x: auto; padding-bottom: 12px; }
.month-grid { border-radius: var(--radius-lg); overflow: hidden; min-width: 700px; box-shadow: var(--shadow-glass); }
.month-day-headers { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
.month-day-hdr { padding: 12px 4px; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); }
.month-day-hdr.weekend { color: var(--danger); }
.month-body { display: grid; grid-template-columns: repeat(7, 1fr); }
.month-cell { min-height: 112px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px; cursor: pointer; transition: background var(--transition-fast); min-width: 0; }
.month-cell:hover { background: var(--bg-secondary); }
.month-cell:nth-child(7n) { border-right: none; }
.month-cell.empty { cursor: default; opacity: .4; }
.month-cell.empty:hover { background: transparent; }
.month-cell.today-cell { background: var(--accent-light); }
.month-day-num { font-size: 13px; font-weight: 700; color: var(--text-secondary); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.month-day-num.today-num { background: var(--accent); color: #fff; }
.month-day-num.weekend-num { color: var(--danger); }
.month-task-pill { font-size: 11px; font-weight: 600; color: #fff; padding: 2px 8px; border-radius: 8px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.month-task-pill.pill-done { opacity: .55; text-decoration: line-through; }
.month-more { font-size: 11px; color: var(--text-muted); font-weight: 600; padding-left: 4px; }

/* ── MODALS ───────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(2, 6, 23, 0.6);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px;
}
.modal-content {
  width: 100%; max-width: 520px; max-height: calc(100vh - 40px); overflow-y: auto;
  border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-lg);
  background: var(--bg-solid);
  animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-content.modal-sm { max-width: 420px; }
@keyframes modalPop { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 12px; }
.modal-head-actions { display: flex; gap: 8px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 26px; }
.modal-actions.split { justify-content: space-between; }
.modal-actions-right { display: flex; gap: 12px; }
.modal-scroll { max-height: 60vh; overflow-y: auto; padding-right: 6px; }

/* ── EMPTY STATE ──────────────────────────────────── */
.empty-state { text-align: center; padding: 36px 20px; color: var(--text-muted); }
.empty-icon { font-size: 44px; color: var(--border-hover); margin-bottom: 14px; display: flex; justify-content: center; }
.empty-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.empty-sub { font-size: 14px; }

/* ── POOL (members / subjects) ────────────────────── */
.pool-layout { display: flex; gap: 20px; align-items: flex-start; min-width: 0; }
.pool-layout:not(.is-editing) .pool-card { display: none; }
.pool-card { width: 270px; flex-shrink: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.pool-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); background: var(--bg-secondary); display: flex; justify-content: space-between; align-items: center; }
.count-pill { font-size: 12px; font-weight: 700; color: var(--text-muted); background: var(--bg-card); padding: 4px 10px; border-radius: 12px; }
.pool-body { padding: 14px; overflow-y: auto; max-height: 560px; display: flex; flex-direction: column; gap: 10px; }
.pool-empty { text-align: center; padding: 26px 10px; color: var(--text-muted); font-size: 13px; }
.member-add { display: flex; gap: 8px; padding: 14px 14px 0; }

.pool-item {
  position: relative; padding: 12px 14px; border-radius: var(--radius-sm);
  color: #fff; cursor: grab; box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s; user-select: none; -webkit-user-select: none;
}
.pool-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.pool-item.dragging { opacity: .5; }
.pool-item.touch-selected { outline: 3px solid #fff; box-shadow: 0 0 0 5px var(--accent); }
.pool-item-title { font-weight: 700; font-size: 14px; padding-right: 54px; word-break: break-word; }
.pool-item-code { font-size: 11px; font-weight: 600; opacity: .9; margin-top: 3px; }
.pool-item-room { font-size: 11px; opacity: .85; margin-top: 2px; }
.pool-item-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.pool-action-btn { width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,.22); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.pool-action-btn:hover { background: rgba(255,255,255,.4); }

/* ── GRID SCROLLER (horizontal only on touch) ─────── */
.grid-scroll { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; padding-bottom: 16px; touch-action: pan-x; }

/* ── DUTY GRID ────────────────────────────────────── */
.duty-grid { display: grid; grid-template-columns: 130px repeat(7, minmax(150px, 1fr)); min-width: 1040px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-glass); }
.duty-head, .duty-slot-label { background: var(--bg-secondary); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
.duty-head { padding: 10px 4px; text-align: center; font-weight: 700; font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.duty-head.today { color: var(--accent-hover); background: var(--accent-light); }
.duty-head-date { font-size: 11px; font-weight: 500; opacity: 0.75; }
.duty-slot-label { padding: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; }
.duty-slot-label .slot-times { white-space: nowrap; }
.slot-remove { color: var(--danger); font-size: 12px; font-weight: 600; display: none; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; }
.slot-remove:hover { background: var(--danger-light); }
.pool-layout.is-editing .slot-remove { display: inline-flex; }
.duty-cell { min-height: 92px; padding: 8px; border-right: 1px solid var(--grid-line); border-bottom: 1px solid var(--grid-line); display: flex; flex-direction: column; gap: 6px; transition: background var(--transition-fast); min-width: 0; }
.duty-cell:last-child { border-right: none; }
.pool-layout.is-editing .duty-cell { cursor: copy; }
.duty-cell.drag-over, .tt-cell.drag-over { background: var(--accent-light); outline: 2px dashed var(--accent); outline-offset: -3px; }

.duty-chip {
  position: relative; padding: 7px 10px; border-radius: 10px; color: #fff; font-size: 12px;
  box-shadow: var(--shadow-sm); user-select: none; -webkit-user-select: none; min-width: 0;
}
.duty-chip .chip-person { font-weight: 700; font-size: 13px; padding-right: 44px; word-break: break-word; }
.duty-chip .chip-duty { opacity: .92; margin-top: 1px; word-break: break-word; }
.duty-chip .chip-notes { opacity: .8; font-size: 11px; margin-top: 2px; word-break: break-word; }
.chip-actions { position: absolute; top: 5px; right: 5px; display: none; gap: 3px; }
.pool-layout.is-editing .chip-actions { display: flex; }
.pool-layout.is-editing .duty-chip { cursor: grab; }
.duty-chip.dragging { opacity: .5; }
.duty-chip.touch-selected { outline: 3px solid #fff; box-shadow: 0 0 0 5px var(--accent); }
.chip-btn { width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,.28); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
.chip-btn:hover { background: rgba(255,255,255,.5); }

/* ── CLASS TIMETABLE ──────────────────────────────── */
.timetable-grid { display: grid; min-width: 820px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-glass); }
.tt-header-cell { padding: 10px 4px; font-weight: 600; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); border-right: 1px solid var(--grid-line); background: var(--bg-secondary); }
.tt-day-label { padding: 8px 4px; font-weight: 700; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--bg-secondary); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); line-height: 1.1; }
.tt-day-label.today { color: var(--accent-hover); background: var(--accent-light); }
.tt-day-date { font-size: 11px; font-weight: 500; opacity: 0.75; }
.week-nav-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); width: 100%; }
.week-label { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 0 8px; display: inline-flex; align-items: center; }
.tt-day-track { position: relative; display: flex; border-bottom: 1px solid var(--border); grid-column: 2 / -1; }
.tt-cell { flex: 1; min-height: 64px; border-right: 1px dashed var(--grid-line); transition: background var(--transition-fast); }
.tt-cell.hour-end { border-right: 1px solid var(--border); }

.class-block {
  position: absolute; top: 4px; bottom: 4px; z-index: 10;
  border-radius: var(--radius-sm); padding: 6px 10px; color: #fff; overflow: hidden;
  font-size: 11px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: center;
  transition: box-shadow .2s, transform .2s; line-height: 1.25; user-select: none; -webkit-user-select: none;
}
.pool-layout.is-editing .class-block { cursor: grab; }
.class-block.dragging { opacity: .5; }
.class-block.touch-selected { outline: 3px solid #fff; box-shadow: 0 0 0 5px var(--accent); z-index: 30; }
.class-block .cb-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.class-block .cb-code { font-weight: 700; font-size: 12px; }
.class-block .cb-meta { font-size: 10px; opacity: .9; }
.class-block-edit, .class-block-del {
  position: absolute; right: 4px; width: 22px; height: 22px; border-radius: 5px; display: none;
  align-items: center; justify-content: center; background: rgba(255,255,255,.88); color: #1e293b;
  box-shadow: 0 1px 3px rgba(0,0,0,.3); font-size: 11px; z-index: 12;
}
.class-block-edit { top: 4px; }
.class-block-del  { top: 30px; }
.pool-layout.is-editing .class-block-edit, .pool-layout.is-editing .class-block-del { display: flex; }

/* Color swatches */
.color-swatches { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 0; }
.color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s, border-color .15s; }
.color-swatch:hover { transform: scale(1.12); }
.color-swatch.selected { border-color: var(--text-primary); transform: scale(1.12); }

/* Touch hint toast */
.touch-hint { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 500; box-shadow: var(--shadow-lg); white-space: nowrap; animation: fadeIn .3s ease; }

/* ── LOADING ──────────────────────────────────────── */
.loading-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
.loading-spinner { width: 46px; height: 46px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
.loading-text { color: var(--text-primary); font-weight: 600; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.inline-skeleton { height: 72px; border-radius: var(--radius); background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 12px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Rota & Timetable export: hide edit-only controls while capturing the image */
.exporting .chip-actions, .exporting .slot-remove,
.exporting .class-block-edit, .exporting .class-block-del { display: none !important; }

/* ── OVERVIEW HUB (Today at a Glance + Exam Countdown) ── */
.overview-hub {
  padding: 16px 20px;
  border: 1px solid var(--border);
  transition: all var(--transition);
}
.overview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.overview-title-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.overview-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-hover);
  background: var(--accent-light);
  padding: 5px 12px;
  border-radius: 999px;
}
.overview-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}
.overview-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.exam-countdown-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.countdown-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  color: var(--text-primary);
  cursor: pointer;
  transition: transform var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
}
.countdown-pill:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  background: var(--bg-card-hover);
}
.countdown-pill i { color: var(--warning); font-size: 12px; }
.countdown-pill.soon { border-color: rgba(239, 68, 68, 0.45); background: var(--danger-light); }
.countdown-pill.soon i { color: var(--danger); }
.countdown-pill .cd-days {
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-light);
  color: var(--accent-hover);
}
.countdown-pill.soon .cd-days {
  background: rgba(239, 68, 68, 0.2);
  color: var(--danger);
}
.overview-body {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.overview-hub.collapsed .overview-body {
  display: none;
}
.glance-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: transform var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
  min-width: 0;
}
.glance-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-hover);
  background: var(--bg-card-hover);
}
.glance-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.glance-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.glance-icon-class { background: rgba(99, 102, 241, 0.16); color: #818cf8; }
.glance-icon-duty  { background: rgba(16, 185, 129, 0.16); color: #34d399; }
.glance-icon-task  { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
.glance-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  flex: 1;
}
.glance-count {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-card);
  color: var(--text-secondary);
}
.glance-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.glance-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 6px 8px;
  border-radius: 8px;
  background: var(--bg-card);
  border-left: 3px solid var(--accent);
  min-width: 0;
}
.glance-time {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  white-space: nowrap;
  flex-shrink: 0;
}
.glance-main {
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.glance-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--bg-secondary);
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.glance-empty {
  font-size: 12px;
  color: var(--text-muted);
  padding: 6px 2px;
}
.glance-link-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--accent-light);
  color: var(--accent);
  font-size: 11px;
  text-decoration: none;
  flex-shrink: 0;
  transition: transform .15s, background .15s;
}
.glance-link-badge:hover {
  transform: scale(1.1);
  background: var(--accent);
  color: #fff;
}

/* ── CLASS SESSION BADGES & QUICK LINKS ──────────── */
.cb-badges {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 4px;
}
.cb-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.24);
  color: #fff;
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 9px;
}
.class-block {
  cursor: pointer;
}
.session-quick-links {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
}

/* ── TOPBAR LIVE TIMER PILL ───────────────────────── */
.topbar-timer-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid rgba(99, 102, 241, 0.4);
  background: var(--accent-light);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: transform .15s, box-shadow .15s;
}
.topbar-timer-pill:hover {
  transform: translateY(-1px);
}
.topbar-timer-pill.warn {
  background: rgba(239, 68, 68, 0.18);
  border-color: rgba(239, 68, 68, 0.55);
  color: #f87171;
  animation: pulseWarn 1s infinite alternate;
}

/* ── MODULE 4: STUDY HUB (TIMER & GRADE TRACKER) ─── */
.study-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}
.study-card {
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.study-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.study-sub {
  font-size: 12px;
  color: var(--text-muted);
  margin: 4px 0 0;
}
.timer-status-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.timer-status-badge.running {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
  border-color: rgba(16, 185, 129, 0.4);
}
.timer-status-badge.warn {
  background: rgba(239, 68, 68, 0.2);
  color: #f87171;
  border-color: rgba(239, 68, 68, 0.5);
}
.timer-preset-group {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.timer-preset-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.timer-preset-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.timer-preset-btn {
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.timer-preset-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.timer-preset-btn.osce-btn.active {
  background: #06b6d4;
  border-color: #06b6d4;
  color: #fff;
}
.timer-display-box {
  text-align: center;
  padding: 24px 18px;
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  transition: border-color .25s, box-shadow .25s;
}
.timer-display-box.is-running {
  border-color: rgba(99, 102, 241, 0.5);
  box-shadow: 0 0 24px rgba(99, 102, 241, 0.12);
}
.timer-display-box.osce-warning {
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.08);
  box-shadow: 0 0 28px rgba(239, 68, 68, 0.22);
}
.timer-mode-caption {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.timer-digits {
  font-size: 56px;
  font-weight: 800;
  line-height: 1.1;
  margin: 8px 0 14px;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}
.timer-progress-track {
  height: 8px;
  border-radius: 999px;
  background: var(--bg-card);
  overflow: hidden;
}
.timer-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #06b6d4);
  transition: width 0.4s linear;
}
.timer-warning-banner {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(239, 68, 68, 0.2);
  color: #f87171;
  font-size: 12px;
  font-weight: 800;
}
.timer-controls-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.study-log-section, .grade-target-section {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.study-log-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
}
.study-log-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 210px;
  overflow-y: auto;
}
.study-log-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--bg-secondary);
}
.study-log-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 6px;
  text-transform: uppercase;
}
.study-log-tag.study {
  background: var(--accent-light);
  color: var(--accent);
}
.study-log-tag.osce {
  background: rgba(6, 182, 212, 0.16);
  color: #22d3ee;
}
.study-log-subj {
  font-weight: 700;
  color: var(--text-primary);
}
.study-log-desc {
  color: var(--text-secondary);
  flex: 1;
}
.study-log-time {
  font-size: 11px;
  color: var(--text-muted);
}

/* Grade Tracker */
.study-card-wide {
  grid-column: 1 / -1;
}
.grade-subject-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}
.grade-weight-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 9px 13px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
}
.grade-weight-banner.ok {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.35);
  color: var(--success);
}
.grade-weight-banner.warn {
  background: rgba(245, 158, 11, 0.14);
  border-color: rgba(245, 158, 11, 0.45);
  color: var(--warning);
}
.grade-summary-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.grade-metric {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.grade-metric-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}
.grade-metric-val {
  font-size: 17px;
  font-weight: 800;
  color: var(--text-primary);
}
.grade-items-head {
  display: grid;
  grid-template-columns: 1fr 68px 68px 68px 88px 34px;
  gap: 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  padding: 0 4px;
}
.grade-items-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.grade-item-row {
  display: grid;
  grid-template-columns: 1fr 68px 68px 68px 88px 34px;
  gap: 8px;
  align-items: center;
}
.grade-input-name, .grade-input-num {
  padding: 7px 9px !important;
  font-size: 13px !important;
}
.grade-weighted-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  background: var(--bg-secondary);
  color: var(--text-muted);
  border: 1px solid var(--border);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.grade-weighted-pill.is-graded {
  background: var(--accent-light);
  color: var(--accent-hover);
  border-color: rgba(99, 102, 241, 0.35);
}
[data-theme="light"] .grade-weighted-pill.is-graded {
  color: var(--accent);
}
.grade-items-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.whatif-simulator-box {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.whatif-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
}
.whatif-result {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-light);
  color: var(--text-primary);
}
.whatif-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.whatif-controls input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}
.whatif-pct-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  width: 78px;
  font-size: 12px;
  font-weight: 700;
}
.grade-target-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 8px;
}
.grade-target-card {
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.grade-target-card.secured {
  border-color: rgba(16, 185, 129, 0.45);
  background: rgba(16, 185, 129, 0.08);
}
.grade-target-card.impossible {
  opacity: 0.6;
}
.gt-grade {
  font-size: 15px;
  font-weight: 800;
}
.gt-cut {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}
.gt-need {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* Reference Grade Cutoff Box (เกณฑ์การตัดเกรดอ้างอิง) */
.ref-cutoff-box {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ref-cutoff-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.ref-cutoff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
  gap: 6px;
}
.ref-cut-item {
  display: flex;
  flex-direction: column;
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  font-size: 11px;
  font-weight: 700;
  gap: 2px;
}
.ref-cut-item.pass {
  border-left: 3px solid var(--success);
}
.ref-cut-item.pass .rc-g, .ref-cut-item.pass .rc-p, .ref-cut-item.pass .rc-s {
  color: var(--success);
}
.ref-cut-item.fail {
  border-left: 3px solid var(--danger);
}
.ref-cut-item.fail .rc-g, .ref-cut-item.fail .rc-p, .ref-cut-item.fail .rc-s {
  color: var(--danger);
}
.rc-g {
  font-size: 14px;
  font-weight: 800;
}
.rc-p {
  font-size: 11px;
  opacity: 0.9;
}
.rc-s {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

/* Unified Study Global Subject Navigator */
.study-global-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.study-global-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
  min-width: 280px;
}
.study-global-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.study-global-select {
  flex: 1;
  max-width: 440px;
  font-weight: 700;
  border-color: var(--accent);
}
.study-subject-pills {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.study-pill-btn {
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.study-pill-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-hover);
}
.study-pill-btn.active {
  background: var(--accent);
  color: #fff !important;
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

/* Matrix view filter bar */
.matrix-filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.matrix-filter-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.matrix-filter-pills {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.matrix-filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 18px;
  font-size: 12px;
  font-weight: 700;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.matrix-filter-pill:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}
.matrix-filter-pill.active {
  background: var(--accent-light);
  color: var(--accent-hover);
  border-color: var(--accent);
}
[data-theme="light"] .matrix-filter-pill.active {
  color: var(--accent);
}
.matrix-active-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--accent-light);
  color: var(--accent-hover);
  border: 1px solid rgba(99, 102, 241, 0.35);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 8px;
  vertical-align: middle;
}
[data-theme="light"] .matrix-active-badge {
  color: var(--accent);
}

/* Horizontal Spreadsheet-style Score Matrix */
.score-matrix-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.matrix-subject-block {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-secondary);
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.matrix-subject-block.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-light);
}
.matrix-scroll {
  overflow-x: auto;
}
.matrix-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 680px;
}
.matrix-table th, .matrix-table td {
  border: 1px solid var(--border);
  padding: 8px 10px;
  text-align: center;
  vertical-align: middle;
}
.matrix-table thead th {
  background: var(--bg-card);
  color: var(--text-primary);
  font-weight: 700;
  white-space: nowrap;
}
.matrix-subj-th {
  text-align: left !important;
  min-width: 240px;
  cursor: pointer;
  color: var(--accent-hover) !important;
}
[data-theme="light"] .matrix-subj-th {
  color: var(--accent) !important;
}
.matrix-tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--accent-light);
  color: var(--accent-hover);
  font-size: 10px;
  font-weight: 800;
  margin-right: 6px;
}
[data-theme="light"] .matrix-tag {
  color: var(--accent);
}
.matrix-row-label {
  text-align: left !important;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--bg-card);
  white-space: nowrap;
}
.matrix-weight-cell {
  color: var(--text-secondary);
  font-weight: 600;
  white-space: nowrap;
}
.matrix-total-th, .matrix-grade-th {
  background: var(--accent-light) !important;
}
.matrix-total-weight {
  font-weight: 800;
  color: var(--text-secondary);
  background: rgba(99, 102, 241, 0.06);
}
.matrix-total-score {
  font-size: 15px;
  font-weight: 800;
  color: var(--text-primary);
  background: rgba(99, 102, 241, 0.10);
}
.matrix-score-cell {
  padding: 4px 6px !important;
}
.matrix-score-input {
  width: 76px;
  padding: 5px 6px;
  text-align: center;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 800;
  font-family: inherit;
}
.matrix-score-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.matrix-grade-cell {
  min-width: 72px;
  background: var(--bg-card);
}
.matrix-grade-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 800;
}
.matrix-grade-badge.grade-f {
  background: rgba(239, 68, 68, 0.16);
  color: var(--danger);
}
.matrix-grade-badge.grade-pass {
  background: rgba(16, 185, 129, 0.18);
  color: var(--success);
}
.matrix-proj-hint {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  margin-top: 3px;
  white-space: nowrap;
}

/* All Subjects GPA Overview Table */
.gpa-summary-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.gpa-badge {
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-secondary);
}
.gpa-badge.accent {
  background: var(--accent-light);
  border-color: rgba(99, 102, 241, 0.4);
  color: var(--text-primary);
}
.gpa-table-wrap {
  overflow-x: auto;
}
.gpa-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.gpa-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.gpa-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.gpa-row {
  cursor: pointer;
  transition: background .15s;
}
.gpa-row:hover {
  background: var(--bg-card-hover);
}
.gpa-row.active {
  background: var(--accent-light);
}
.gpa-subj-code {
  font-weight: 800;
  color: var(--text-primary);
}
.gpa-subj-name {
  font-size: 11px;
  color: var(--text-muted);
}
.gpa-cred-input {
  width: 68px !important;
  padding: 5px 8px !important;
  font-size: 13px !important;
}
.gpa-grade-pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  background: var(--bg-secondary);
  color: var(--text-muted);
}
.gpa-grade-pill.has-grade {
  background: rgba(16, 185, 129, 0.16);
  color: var(--success);
}
.gpa-grade-pill.is-fail {
  background: rgba(239, 68, 68, 0.16);
  color: var(--danger);
}
@keyframes pulseWarn {
  from { opacity: 1; }
  to { opacity: 0.65; }
}

.swal-form-group {
  text-align: left;
  margin-bottom: 12px;
}
.swal-form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.swal-form-select {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background-color: var(--bg-solid);
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
}

/* Add time slot dialog */
.swal-time-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.swal-time-row label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; text-align: left; }
.swal-time-row .swal2-input { margin: 0; width: 150px; }

/* Disabled state */
button:disabled, .btn:disabled { opacity: .5; cursor: not-allowed !important; pointer-events: none; }

/* SweetAlert2 theme blend */
.swal2-popup { background: var(--bg-solid) !important; color: var(--text-primary) !important; border: 1px solid var(--border); border-radius: var(--radius-lg) !important; font-family: inherit !important; }
.swal2-title, .swal2-html-container { color: var(--text-primary) !important; }
.swal2-input { color: var(--text-primary) !important; background: var(--bg-secondary) !important; border: 1px solid var(--border) !important; }

/* Pull-to-refresh & Topbar Refresh Button for iPad / iOS */
.ptr-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  margin-bottom: 10px;
  border-radius: var(--radius-sm);
  background: var(--accent-light);
  border: 1px solid rgba(99, 102, 241, 0.35);
  color: var(--accent-hover);
  font-size: 13px;
  font-weight: 700;
  transition: all 0.2s ease;
}
[data-theme="light"] .ptr-indicator { color: var(--accent); }
.ptr-indicator.ready {
  background: var(--success-light);
  border-color: rgba(16, 185, 129, 0.45);
  color: var(--success);
}
@keyframes uniplanSpin {
  to { transform: rotate(360deg); }
}
.theme-btn.is-spinning i,
.ptr-icon.is-spinning {
  animation: uniplanSpin 0.8s linear infinite;
}

/* ── MOBILE: bottom dock ──────────────────────────── */
@media (max-width: 900px) {
  .sidebar {
    top: auto; left: 12px; right: 12px; bottom: 12px;
    width: auto; height: 68px; flex-direction: row; border-radius: 34px; padding: 0 8px;
    justify-content: center; align-items: center;
  }
  .sidebar-logo, .sidebar-user { display: none; }
  .sidebar-nav { padding: 0; flex-direction: row; width: 100%; justify-content: space-around; }
  .nav-btn { flex-direction: column; gap: 3px; padding: 8px; width: 78px; justify-content: center; border-radius: 20px; }
  .nav-label { font-size: 10px; font-weight: 700; }
  .nav-btn:hover { transform: none; background: transparent; }
  .nav-btn.active { background: transparent; box-shadow: none; }
  .nav-btn.active .nav-icon { background: var(--accent-light); padding: 4px 16px; border-radius: 16px; }

  .main-content { margin-left: 12px; margin-right: 12px; margin-bottom: 96px; padding-bottom: 0; }
  .topbar { padding: 12px 4px; }
  .topbar-title { font-size: 20px; }
  .menu-toggle { display: none; }

  .pool-layout { flex-direction: column; }
  .overview-body, .study-grid { grid-template-columns: 1fr; }
  .grade-summary-strip { grid-template-columns: 1fr; }
  .grade-items-head, .grade-item-row { grid-template-columns: 1fr 50px 50px 50px 72px 30px; gap: 4px; }
